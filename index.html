<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MTUT</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MTUT">
<meta name="theme-color" content="#17151f">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f0eef6; --panel:#ffffff; --panel2:#f6f4fa; --line:#d9d3e6; --text:#221f30; --muted:#6a6380;
  --gate:#1d8b80; --gate-soft:#d4efeb; --lamp:#a86d12; --danger:#b4413f; --paper:#f8f7fb; --paper-text:#26222f;
  --shadow:0 10px 30px rgba(30,20,60,.18);
  --ui:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --story:"Gowun Batang", "Nanum Myeongjo", "Batang", serif;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#17151f; --panel:#221f2e; --panel2:#2a2639; --line:#3a3550; --text:#ece8f4; --muted:#a39cb8;
    --gate:#7fd6cb; --gate-soft:#1f3a3a; --lamp:#e9b25c; --danger:#e58a86; --paper:#1d1a28; --paper-text:#efe9df;
    --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#17151f; --panel:#221f2e; --panel2:#2a2639; --line:#3a3550; --text:#ece8f4; --muted:#a39cb8;
  --gate:#7fd6cb; --gate-soft:#1f3a3a; --lamp:#e9b25c; --danger:#e58a86; --paper:#1d1a28; --paper-text:#efe9df;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--ink);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.55;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gate);outline-offset:2px}
#game{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block;background:#0e0d14}

/* HUD */
.hud{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:flex-start;z-index:5;pointer-events:none}
.clock{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);min-width:180px}
.clock .t{font-size:22px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.clock .d{font-size:12px;color:var(--muted)}
.clock .w{font-size:12px;color:var(--text);margin-top:2px}
.place{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);font-size:13px}
.place b{display:block;font-size:15px}
.paused{color:var(--lamp);font-size:12px}
.menu{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:6px;z-index:5}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;box-shadow:var(--shadow);font-size:14px}
.btn:hover{border-color:var(--gate)}
.btn.primary{background:var(--gate);color:var(--ink);border-color:var(--gate);font-weight:600}
.btn.ghost{box-shadow:none;background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:4px 9px;font-size:13px;box-shadow:none}
.prompt{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);font-size:14px;z-index:5;display:none;white-space:nowrap}
.prompt kbd{font-family:var(--ui);font-weight:600;border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-right:6px;background:var(--panel2)}
.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--gate);border-radius:10px;padding:8px 16px;box-shadow:var(--shadow);z-index:40;font-size:14px;max-width:min(560px,90vw);text-align:center}

/* Drawer (chat) */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);color:var(--paper-text);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer[hidden]{display:none}
.chat-head{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.chat-head .who{flex:1;min-width:0}
.chat-head .who b{font-size:16px}
.chat-head .who small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.portraits{display:flex}
.portraits canvas,.portraits img{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);image-rendering:pixelated;margin-right:-8px}
.log{flex:1;overflow-y:auto;padding:18px 20px 8px}
.msg{margin:0 0 18px;position:relative}
.msg.ai .body{font-family:var(--story);font-size:16.5px;line-height:1.9;white-space:pre-wrap;max-width:62ch}
.msg.player .body{font-size:14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;white-space:pre-wrap;margin-left:auto;max-width:85%;width:fit-content}
.msg.sys .body{font-size:13px;color:var(--muted);text-align:center}
.msg .tools{display:flex;gap:4px;justify-content:flex-end;opacity:0;transition:opacity .15s}
.msg:hover .tools,.msg:focus-within .tools{opacity:1}
.msg .tools button{background:none;border:none;color:var(--muted);font-size:12px;padding:2px 6px;border-radius:5px}
.msg .tools button:hover{color:var(--text);background:var(--panel2)}
.msg textarea{width:100%;min-height:140px;background:var(--panel);border:1px solid var(--gate);border-radius:8px;padding:10px;font-family:var(--story);font-size:15px;line-height:1.7}
.composer{border-top:1px solid var(--line);padding:10px 12px;background:var(--panel)}
.composer textarea{width:100%;resize:none;min-height:64px;max-height:180px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.composer .row{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted);flex:1;min-width:120px}
.thinking::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion: reduce){.thinking::after{animation:none;content:"…"}}

/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(10,8,20,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(860px,100%);max-height:min(88vh,900px);display:flex;flex-direction:column;overflow:hidden}
.modal header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-size:18px;flex:1}
.modal .content{padding:16px 18px;overflow-y:auto;flex:1 1 auto;min-height:0}
.tabs{flex:0 0 auto;display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--gate);font-weight:600}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input[type=text],.field textarea,.field select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.field textarea{min-height:90px;resize:vertical}
.hint{font-size:13px;color:var(--muted)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid var(--line)}
.swatches button[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 2px var(--gate)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}

/* Character list */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.person{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.person:hover{border-color:var(--gate)}
.person canvas,.person img.portrait{width:48px;height:48px;image-rendering:pixelated;border-radius:8px;background:var(--panel)}
.person b{display:block}
.person small{color:var(--muted);font-size:12px}
.axes{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px;margin:8px 0 14px}
.bar{height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gate)}
.bar.warn i{background:var(--lamp)}
.relation{font-family:var(--story);font-size:15.5px;line-height:1.85;background:var(--paper);color:var(--paper-text);border:1px solid var(--line);border-radius:10px;padding:12px 14px;white-space:pre-wrap}

/* Memories */
.mem-level{margin:18px 0 8px;display:flex;align-items:baseline;gap:8px}
.mem-level h3{margin:0;font-size:15px}
.mem-level span{font-size:12px;color:var(--muted)}
.mem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel2)}
.mem.pinned{border-color:var(--lamp)}
.mem.archived{opacity:.65}
.mem .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mem .meta .flag{color:var(--lamp)}
.mem .txt{font-family:var(--story);font-size:15px;line-height:1.75;margin:6px 0;white-space:pre-wrap}
.mem textarea{width:100%;min-height:100px;background:var(--panel);border:1px solid var(--gate);border-radius:8px;padding:8px;font-family:var(--story);font-size:15px;line-height:1.7}
.mem .acts{display:flex;gap:4px;flex-wrap:wrap}
.src{margin-top:8px;border-left:3px solid var(--line);padding-left:10px;font-size:13px;white-space:pre-wrap;max-height:260px;overflow:auto}

/* Session history */
.session{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel2)}
.session summary{padding:10px 12px;cursor:pointer;font-size:14px}
.session summary small{color:var(--muted)}
.session .msgs{padding:4px 12px 12px}
.session .m{border-top:1px dashed var(--line);padding:8px 0}
.session .m .who{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.session .m .who .sp{flex:1}
.session .m .tx{white-space:pre-wrap;font-family:var(--story);font-size:14.5px;line-height:1.75}
.session .m.player .tx{font-family:var(--ui)}
.session textarea{width:100%;min-height:120px;background:var(--panel);border:1px solid var(--gate);border-radius:8px;padding:8px;font-family:var(--story)}

/* Intro */
.intro{font-family:var(--story);font-size:17px;line-height:2;max-width:56ch;margin:0 auto}
.intro p{margin:0 0 1em}
.title{font-family:var(--story);font-size:clamp(34px,6vw,54px);font-weight:700;letter-spacing:.04em;margin:0 0 6px;text-align:center}
.subtitle{text-align:center;color:var(--muted);margin:0 0 24px}
.preview{display:flex;gap:16px;align-items:center}
.preview canvas{width:96px;height:120px;image-rendering:pixelated;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.hidden{display:none!important}
.look{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.look-preview{position:sticky;top:0;display:flex;flex-direction:column;gap:10px;align-items:center}
.look-presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.look-presets .person{padding:6px;gap:8px}
.look-presets .person canvas{width:40px;height:40px}
.look-presets small{font-size:12px;line-height:1.35;color:var(--text)}
@media (max-width:700px){.look{grid-template-columns:1fr}.look-preview{position:static}}
.banner{border:1px solid var(--line);border-left:4px solid var(--gate);background:var(--panel2);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.banner.warn{border-left-color:var(--lamp)}
.ok{color:var(--gate)} .bad{color:var(--danger)}
.field input[type=password],.field input[type=number]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.row3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:640px){.row3{grid-template-columns:1fr 1fr}}

/* ---- touch & phone ---- */
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{touch-action:manipulation}
#game{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hud,.menu,.prompt{-webkit-user-select:none;user-select:none}
.prompt{cursor:pointer}
.modal-back{padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
@media (hover:none){.msg .tools{opacity:1}}
@media (pointer:coarse){
  input,textarea,select{font-size:16px!important}
  .btn{padding:9px 14px}.btn.small{padding:7px 11px}
  .prompt{padding:12px 22px;font-size:16px}
  .msg .tools button{font-size:14px;padding:6px 10px}
  .tabs button{padding:12px 12px}
}
@media (max-width:640px){
  .hud{flex-direction:column;gap:6px}
  .clock{min-width:0;padding:6px 10px}.clock .t{font-size:18px}
  .place{padding:6px 10px}
  .modal-back{padding:max(8px,env(safe-area-inset-top,0px)) 8px max(8px,env(safe-area-inset-bottom,0px))}
  .modal header{padding:12px 14px}.modal .content{padding:14px}.tabs{padding:0 8px}
  .log{padding:14px 14px 8px}
  #chatStatus{flex:1 1 100%}
  .menu{gap:4px} .menu .btn{padding:8px 10px}
  .composer .row{justify-content:flex-end}
  .look-preview canvas{max-width:100%}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<canvas id="game" aria-label="게임 화면"></canvas>
<div class="hud" id="hud">
  <div class="clock"><div class="d" id="hudDate"></div><div class="t" id="hudTime"></div><div class="w" id="hudWeather"></div><div class="paused hidden" id="hudPaused">시간 멈춤</div></div>
  <div class="place"><b id="hudPlace"></b><span id="hudWorld"></span><span id="hudStats" style="display:block;color:var(--muted);font-size:12px"></span></div>
</div>
<div class="menu" id="menu">
  <button class="btn" id="btnMap" title="지도 (M)">지도</button>
  <button class="btn" id="btnPeople" title="인물 (C)">인물</button>
  <button class="btn" id="btnSettings" title="설정 (Esc)">설정</button>
</div>
<div class="prompt" id="prompt"></div>
<aside class="drawer" id="chat" hidden aria-label="대화"></aside>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
// The page exactly as shipped, captured before anything runs (used for the standalone download)
const ORIGINAL_HTML = "<!doctype html>\n" + document.documentElement.outerHTML;
// ====================================================================
// DATA: lore, places, characters, default preset
// ====================================================================
const GAME_VERSION = "0.7.0";
const GAME_TITLE = "MTUT";
const COARSE = !!(window.matchMedia && matchMedia("(pointer:coarse)").matches);   // finger, not mouse

// ---- Public sample world. The real world & characters arrive as a private "world pack" file. ----
const SAMPLE_LORE = `[세계: 엔진 견본]
이것은 엔진에 들어 있는 견본 세계다. 태평양 깊은 곳에 숨겨진 비밀 조직의 해저 본부.
사람은 어느 나이에 이능력이 생기며, 그 대가로 몸에 변화가 오기도 한다.
돔으로 덮인 해저 도시는 중앙·생활·외곽·농업 구역으로 나뉘고 승강기로 오간다. 돔 천장의 하늘은 바깥의 해와 달에 맞춰 움직인다.`;

// Places: id -> {map, name, rect:[x,y,w,h]}. street:true = corridor (only used when nothing else matches)
const PLACES = {
  "core.hall":     {map:"core", name:"승강기 홀", rect:[16,9,12,10]},
  "core.office":   {map:"core", name:"보스 집무실", rect:[4,4,8,6]},
  "core.ops":      {map:"core", name:"작전 상황실", rect:[32,4,9,6]},
  "core.finance":  {map:"core", name:"재무실", rect:[4,20,7,6]},
  "core.lounge":   {map:"core", name:"친위대 라운지", rect:[32,19,9,7]},
  "core.deck":     {map:"core", name:"중앙 구역 통로", rect:[2,2,40,26], street:true},
  "life.kyle":     {map:"life", name:"보스 거처", rect:[4,4,8,6]},
  "life.dorm":     {map:"life", name:"요원 숙소", rect:[16,4,12,6]},
  "life.kitchen":  {map:"life", name:"주방과 식당", rect:[32,4,9,7]},
  "life.med":      {map:"life", name:"의무실", rect:[4,15,7,5]},
  "life.tea":      {map:"life", name:"찻집", rect:[16,15,6,4]},
  "life.rookie":   {map:"life", name:"신입 숙소 방", rect:[26,15,4,4]},
  "life.library":  {map:"life", name:"도서실", rect:[34,15,7,6]},
  "life.garden":   {map:"life", name:"해저 정원", rect:[3,22,14,5]},
  "life.deck":     {map:"life", name:"생활 구역 통로", rect:[2,2,40,26], street:true},
  "outer.cells":   {map:"outer", name:"격리 시설", rect:[4,4,7,5]},
  "outer.training":{map:"outer", name:"훈련장", rect:[14,3,14,8]},
  "outer.hangar":  {map:"outer", name:"잠수정 격납고", rect:[31,3,10,9]},
  "outer.chapel":  {map:"outer", name:"기도실", rect:[4,20,8,6]},
  "outer.view":    {map:"outer", name:"해저 전망대", rect:[15,24,14,4]},
  "outer.market":  {map:"outer", name:"해저 도시 상점가", rect:[15,14,12,7]},
  "outer.casino":  {map:"outer", name:"도박장", rect:[32,17,9,7]},
  "outer.deck":    {map:"outer", name:"외곽 구역 통로", rect:[2,2,40,26], street:true},
  "farm.field":    {map:"farm", name:"밭", rect:[3,3,12,7]},
  "farm.orchard":  {map:"farm", name:"과수원", rect:[29,3,12,8]},
  "farm.fish":     {map:"farm", name:"양식장", rect:[3,19,13,8]},
  "farm.ranch":    {map:"farm", name:"목장", rect:[30,20,10,6]},
  "farm.water":    {map:"farm", name:"정수 시설", rect:[18,21,7,5]},
  "farm.deck":     {map:"farm", name:"농업 구역 길", rect:[2,2,40,26], street:true},
  "away.mission":  {map:"outer", name:"기지 밖", rect:[0,0,0,0], street:true},
};
const BASE_PLACE_NAMES = Object.fromEntries(Object.entries(PLACES).map(([k,v])=>[k,v.name]));
function applyPlaceNames(names){ for (const id of Object.keys(PLACES)) PLACES[id].name = (names && names[id]) || BASE_PLACE_NAMES[id]; }
const MAP_IDS = ["core","life","outer","farm"];
const HUB = "core";
const MAP_NAMES = {core:"본부 중앙 구역", life:"본부 생활 구역", outer:"본부 외곽 구역", farm:"본부 농업 구역"};

// Relationship axes
const AXES = [
  {id:"trust", name:"신뢰"}, {id:"intimacy", name:"친밀"}, {id:"tension", name:"긴장"},

function h(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k==="accept" && COARSE && tag==="input" && !/^image\//.test(v)) continue;   // iOS greys out files it cannot match
    if (k==="class") e.className=v;
    else if (k==="style") e.style.cssText=v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k==="html") e.innerHTML=v;
    else e.setAttribute(k, v===true?"":v);
  }
  for (const kid of kids.flat()){
    if (kid==null || kid===false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }

function newGrid(w,h,fill){ return {w,h,t:new Uint8Array(w*h).fill(fill)}; }
function setT(m,x,y,t){ if(x>=0&&y>=0&&x<m.w&&y<m.h) m.t[y*m.w+x]=t; }
function getT(m,x,y){ if(x<0||y<0||x>=m.w||y>=m.h) return T.WALL; return m.t[y*m.w+x]; }
function rectT(m,x,y,w,h,t){ for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++) setT(m,i,j,t); }
function building(m,x,y,w,h,door,floor=T.WOOD){
  rectT(m,x,y,w,h,T.WALL); rectT(m,x+1,y+1,w-2,h-2,floor); setT(m,door[0],door[1],T.DOOR);
}
function ellipseT(m,cx,cy,rx,ry,t){ for(let j=Math.floor(cy-ry);j<=Math.ceil(cy+ry);j++) for(let i=Math.floor(cx-rx);i<=Math.ceil(cx+rx);i++){ const dx=(i+0.5-cx)/rx, dy=(j+0.5-cy)/ry; if(dx*dx+dy*dy<=1) setT(m,i,j,t);} }
function lineT(m,x1,y1,x2,y2,t,onlyOn){ const dx=Math.sign(x2-x1), dy=Math.sign(y2-y1); let x=x1,y=y1; while(true){ if(!onlyOn||onlyOn.has(getT(m,x,y))) setT(m,x,y,t); if(x===x2&&y===y2) break; if(x!==x2) x+=dx; else y+=dy; } }

function scatterTrees(m, seedKey, density, protect, base=T.GRASS){
  const r = seeded(seedKey);
  const prot = (x,y) => protect.some(([px,py,pw,ph]) => x>=px-1 && y>=py-1 && x<px+pw+1 && y<py+ph+1);
  for (let y=0;y<m.h;y++) for (let x=0;x<m.w;x++){
    if (getT(m,x,y)!==base) continue;
    if (prot(x,y)) continue;
    let near=false; for(let j=-1;j<=1;j++) for(let i=-1;i<=1;i++){ const tt=getT(m,x+i,y+j); if(tt!==base && tt!==T.TREE && tt!==T.WALL) near=true; }
    if (near) continue;
    const edge = Math.min(x,y,m.w-1-x,m.h-1-y);
    const d = edge<2 ? 0.85 : density;
    if (r()<d) setT(m,x,y,T.TREE);
  }
}

// ====================================================================
function walkable(m,x,y){ return WALKABLE.has(getT(m,x,y)); }
function astar(m, sx,sy, tx,ty, limit=6000){
  sx|=0; sy|=0; tx|=0; ty|=0;
  if (!walkable(m,tx,ty)) return null;
  if (sx===tx && sy===ty) return [];
  const W=m.w, N=W*m.h, g=new Float32Array(N).fill(Infinity), came=new Int32Array(N).fill(-1), closed=new Uint8Array(N);
  const heap=[]; const push=(i,f)=>{ heap.push([f,i]); let c=heap.length-1; while(c>0){ const p=(c-1)>>1; if(heap[p][0]<=heap[c][0]) break; [heap[p],heap[c]]=[heap[c],heap[p]]; c=p; } };
  const pop=()=>{ const top=heap[0]; const last=heap.pop(); if(heap.length){ heap[0]=last; let c=0; for(;;){ const l=c*2+1,r=l+1; let s=c; if(l<heap.length&&heap[l][0]<heap[s][0]) s=l; if(r<heap.length&&heap[r][0]<heap[s][0]) s=r; if(s===c) break; [heap[s],heap[c]]=[heap[c],heap[s]]; c=s; } } return top; };
  const si=sy*W+sx, ti=ty*W+tx; g[si]=0; push(si, Math.abs(sx-tx)+Math.abs(sy-ty));
  let n=0;
  while(heap.length && n++<limit){
    const [,i]=pop(); if(closed[i]) continue; closed[i]=1;
    if (i===ti){ const path=[]; let c=i; while(c!==si){ path.push({x:c%W, y:(c/W)|0}); c=came[c]; } return path.reverse(); }
    const x=i%W, y=(i/W)|0;
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy; if(!walkable(m,nx,ny)) continue; const ni=ny*W+nx; if(closed[ni]) continue;
      const tt=getT(m,nx,ny); const cost = (tt===T.PATH||tt===T.STONE||tt===T.PLANK)?1:1.25;
      const ng=g[i]+cost; if(ng<g[ni]){ g[ni]=ng; came[ni]=i; push(ni, ng+Math.abs(nx-tx)+Math.abs(ny-ty)); }
    }
  }
  return null;
}
function randomTileIn(m, rect, r=Math.random){
  const [x,y,w,hh]=rect; const cands=[];
  for(let j=y;j<y+hh;j++) for(let i=x;i<x+w;i++) if(walkable(m,i,j) && getT(m,i,j)!==T.GATE && getT(m,i,j)!==T.DOOR) cands.push({x:i,y:j});
  if(!cands.length) return {x:x+(w>>1), y:y+(hh>>1)};
  return cands[Math.floor(r()*cands.length)];
}
function placeAt(map,x,y){
  for (const [id,p] of Object.entries(PLACES)){ if(p.map!==map) continue; const [px,py,pw,ph]=p.rect; if(x>=px&&y>=py&&x<px+pw&&y<py+ph && !p.street) return id; }
  for (const [id,p] of Object.entries(PLACES)){ if(p.map!==map) continue; const [px,py,pw,ph]=p.rect; if(x>=px&&y>=py&&x<px+pw&&y<py+ph) return id; }
  return null;
}

// The dome ceiling mirrors the real sky above the ocean: one sky state per day for the whole city
function weatherOf(map, day){
  const r = seeded(`env:${day}:${S.seed}`)();
  return r<0.5?"clear":r<0.75?"cloudy":r<0.92?"overcast":"storm";
}
const WEATHER_NAME = {clear:"맑음", cloudy:"구름 많음", overcast:"흐림", storm:"바깥은 폭풍"};
function timeOfDay(min){ if(min<300) return "깊은 밤"; if(min<420) return "새벽"; if(min<660) return "오전"; if(min<840) return "한낮"; if(min<1080) return "오후"; if(min<1200) return "저녁"; return "밤"; }

function charById(id){ return S.chars.find(c=>c.id===id); }
function G(c){ return c.card.data.extensions.gateside; }
function cname(c){ return c.card.data.name; }

function scheduleBlocks(c, dow){
  const sch = (G(c).schedule||[]).map((b,i)=>({...b, i, s:hm(b.t)}));
  return sch.filter(b=>!b.days || b.days.includes(dow)).sort((a,b)=>a.s-b.s);
}
function resolveBlock(c, absMin){
  const day=Math.floor(absMin/1440), min=absMin%1440;
  let blocks=scheduleBlocks(c, day%7); let b=null;
  for (const x of blocks) if (x.s<=min) b=x;
  if (!b){ const prev=scheduleBlocks(c,(day+6)%7); b=prev[prev.length-1]; if(!b) return null; return {b, day:day-1, start:(day-1)*1440+b.s}; }
  return {b, day, start:day*1440+b.s};
}
function decideAt0(c, absMin, depth=0){
  // AI-made plans override
  const day=Math.floor(absMin/1440), min=absMin%1440;
  for (const p of S.plans){ if (p.charId===c.id && p.day===day && min>=p.start && min<p.end && PLACES[p.place]) return {place:p.place, act:p.act, plan:p}; }
  const rb = resolveBlock(c, absMin); if (!rb) return {place:G(c).home, act:"쉬는 중"};
  const key = `${c.id}:${rb.start}`;
  let d = RT.decisions[key];
  if (!d){
    const r = seeded(key+":"+S.seed); let place=rb.b.place, act=rb.b.act, hidden=!!rb.b.hidden, form=rb.b.form||null;
    const w = weatherOf(PLACES[place]?.map||HUB, rb.day);
    for (const a of (rb.b.alt||[])){ if ((a.when==="any"||a.when===w) && r()<a.p){ place=a.place; act=a.act; if ("hidden" in a) hidden=!!a.hidden; if ("form" in a) form=a.form||null; break; } }
    const delay = Math.floor(r()*(G(c).lateness||0)) - Math.floor(r()*4);
    d = RT.decisions[key] = {place, act, delay, start:rb.start, hidden, form};
  }
  if (depth<2 && absMin < d.start + d.delay) return decideAt0(c, d.start-1, depth+1);
  if (!PLACES[d.place] && d.place!=="shadow") return {place:G(c).home, act:d.act};
  return d;
}
// A character tied to another (g.leash) stays in that person's zone; "shadow" = inside their shadow (hidden on the map)
function decideAt(c, absMin, depth=0){
  const d = decideAt0(c, absMin, depth); const lid = G(c).leash;
  if (d.plan) return d;                       // a promise made in a scene beats the leash
  if (!lid){ return d.place==="shadow" ? {place:G(c).home, act:d.act} : d; }
  const L = charById(lid); if (!L) return d.place==="shadow" ? {place:G(c).home, act:d.act} : d;
  const ld = decideAt0(L, absMin, 0);
  if (d.place==="shadow" || PLACES[d.place]?.map !== PLACES[ld.place]?.map)
    return {place:ld.place, act: d.place==="shadow" ? d.act : `${cname(L)}의 그림자 속`, shadow:true, start:d.start, delay:0};
  return d;
}

function initNPC(c, snap=true){
  const d = decideAt(c, S.time); const p = PLACES[d.place];
  const tile = randomTileIn(MAPS[p.map], p.rect, seeded(c.id+S.time));
  const n = RT.npcs[c.id] || {};
  Object.assign(n, {id:c.id, map:p.map, x:tile.x+0.5, y:tile.y+0.5, dir:0, frame:0, anim:0, goal:d.place, act:d.act, path:null, arrived:true, wander:false, idle:2+Math.random()*10, transit:null, busy:false, shadow:!!d.shadow, hidden:!!d.hidden, form:d.form||null});
  RT.npcs[c.id]=n;
}
function snapAllNPCs(){ for (const c of S.chars) initNPC(c); }

function routeNPC(n){
  const p = PLACES[n.goal]; const m = MAPS[n.map];
  let dest, gate=null;
  if (p.map!==n.map){ gate = nextGate(n.map, p.map); dest = {x:gate.x, y:gate.y+gate.h-1}; }
  else dest = randomTileIn(m, p.rect);
  const path = astar(m, n.x, n.y, dest.x, dest.y);
  if (!path){ // fallback: teleport within map
    if (gate){ n.transit={to:gate.to, remain:2, final:p.map}; return; }
    n.x=dest.x+0.5; n.y=dest.y+0.5; n.arrived=true; n.idle=5+Math.random()*15; return; }
  n.path=path; n.pathGate=gate; n.arrived=false;
}
function updateNPC(n, dt, dMin){
  const c = charById(n.id); if(!c) return;
  if (n.busy) return;
  if (n.transit){ n.transit.remain -= dMin; if (n.transit.remain<=0){ const from=n.map; n.map=n.transit.to; const ag=arrivalGate(n.map, from); n.x=(ag?ag.exit.x:5)+0.5; n.y=(ag?ag.exit.y:5)+0.5; n.transit=null; n.path=null; n.arrived=false; n.wander=false; } return; }
  let d = decideAt(c, S.time);
  if (!d.shadow && !d.plan && G(c).leash){ const L=RT.npcs[G(c).leash], tm=PLACES[d.place]?.map; if (L && (L.transit || L.map!==tm || (n.map!==tm && !n.shadow) || (n.shadow && L.map!==tm))) d={place:d.place, act:`${cname(charById(G(c).leash))}의 그림자 속`, shadow:true}; }
  if (d.shadow){ const L=RT.npcs[G(c).leash]; n.shadow=true; n.hidden=false; n.form=null; n.act=d.act; n.goal=d.place; n.path=null; n.wander=false; n.arrived=true; if (L){ n.map=L.map; n.x=L.x; n.y=L.y; } return; }
  if (n.shadow){ n.shadow=false; n.arrived=false; n.path=null; n.wander=false; }
  if (d.place!==n.goal){ n.goal=d.place; n.path=null; n.arrived=false; n.wander=false; }
  n.act = d.act; n.hidden=!!d.hidden; n.form=d.form||null;
  if (!n.arrived && !n.path && !n.wander) routeNPC(n);
  if (n.arrived && !n.path){ n.idle-=dt; if(n.idle<=0){ const p=PLACES[n.goal]; if(p.map===n.map){ const t=randomTileIn(MAPS[n.map], p.rect); const pa=astar(MAPS[n.map],n.x,n.y,t.x,t.y,1500); if(pa&&pa.length){ n.path=pa; n.wander=true; } } n.idle=6+Math.random()*22; } }
  if (n.path){
    if (!n.path.length){ n.path=null; if(n.pathGate){ const g=n.pathGate; n.pathGate=null; n.transit={to:g.to, remain:2}; } else { n.arrived=true; n.wander=false; } return; }
    const tgt=n.path[0], tx=tgt.x+0.5, ty=tgt.y+0.5, dx=tx-n.x, dy=ty-n.y, dist=Math.hypot(dx,dy), step=NPC_SPEED*dt*(n.wander?0.6:1);
    if (dist<=step){ n.x=tx; n.y=ty; n.path.shift(); } else { n.x+=dx/dist*step; n.y+=dy/dist*step; }
    n.dir = Math.abs(dx)>Math.abs(dy) ? (dx<0?1:2) : (dy<0?3:0);
    n.anim += dt*8; n.frame = 1+(Math.floor(n.anim)%2);
  } else n.frame=0;
}
function npcStatus(n){
  if (n.shadow) return n.act;
  if (n.transit) return "차원문을 지나는 중";
  if (n.path && !n.wander){ const p=PLACES[n.goal]; return `${euroRo(p.name)} 가는 중`; }
  return n.act;
}

function playerWalkable(m,x,y){ const r=0.28; for (const [ox,oy] of [[-r,-0.1],[r,-0.1],[-r,0.25],[r,0.25]]) if(!walkable(m,Math.floor(x+ox),Math.floor(y+oy))) return false; return true; }
function updatePlayer(dt){
  const p=S.player, k=RT.keys; let vx=0, vy=0, arrived=null;
  if (k.has("ArrowLeft")||k.has("KeyA")) vx-=1; if (k.has("ArrowRight")||k.has("KeyD")) vx+=1;
  if (k.has("ArrowUp")||k.has("KeyW")) vy-=1; if (k.has("ArrowDown")||k.has("KeyS")) vy+=1;
  const m=MAPS[p.map];
  if (vx||vy){ const l=Math.hypot(vx,vy); vx/=l; vy/=l; const sp=PLAYER_SPEED*dt*((k.has("ShiftLeft")||k.has("ShiftRight"))?1.6:1);
    const nx=p.x+vx*sp; if (playerWalkable(m,nx,p.y)) p.x=nx; const ny=p.y+vy*sp; if (playerWalkable(m,p.x,ny)) p.y=ny;
    p.dir = Math.abs(vx)>Math.abs(vy) ? (vx<0?1:2) : (vy<0?3:0); p.anim=(p.anim||0)+dt*9; p.frame=1+(Math.floor(p.anim)%2);
    RT.ppath=null; RT.auto=null; RT.quest=null;                       // keyboard takes over from a tap route
  } else if (RT.ppath){
    // walking a route chosen by tapping the map
    const a=RT.auto;
    if (a && a.npc){ const n=RT.npcs[a.npc];
      if (!n || n.map!==p.map || n.transit || n.shadow){ RT.ppath=null; RT.auto=null; }
      else if (Math.hypot(n.x-p.x,n.y-p.y)<1.7){ RT.ppath=null; RT.auto=null; p.frame=0; Chat.open([n.id]); return; } }
    if (RT.ppath && !RT.ppath.length){ arrived=RT.auto||{}; RT.ppath=null; RT.auto=null; p.frame=0; }
    else if (RT.ppath){
      let step=PLAYER_SPEED*dt*1.15;
      while (step>0 && RT.ppath.length){ const t=RT.ppath[0], tx=t.x+0.5, ty=t.y+0.5, dx=tx-p.x, dy=ty-p.y, dist=Math.hypot(dx,dy);
        if (dist>0.001) p.dir = Math.abs(dx)>Math.abs(dy) ? (dx<0?1:2) : (dy<0?3:0);
        if (dist<=step){ p.x=tx; p.y=ty; RT.ppath.shift(); step-=dist; } else { p.x+=dx/dist*step; p.y+=dy/dist*step; step=0; } }
      p.anim=(p.anim||0)+dt*9; p.frame=1+(Math.floor(p.anim)%2);
    }
  } else p.frame=0;
  // nearby
  let best=null, bd=1.9;
  for (const n of Object.values(RT.npcs)){ if (n.map!==p.map||n.transit||n.shadow) continue; const d=Math.hypot(n.x-p.x,n.y-p.y); if(d<bd){bd=d; best=n;} }
  RT.nearNpc=best;
  RT.nearGate = GATES.filter(g=>g.map===p.map && p.x>=g.x-0.6 && p.x<=g.x+g.w+0.6 && p.y>=g.y-0.6 && p.y<=g.y+g.h+0.8).sort((a,b)=>Math.abs(a.x+a.w/2-p.x)-Math.abs(b.x+b.w/2-p.x))[0] || null;
  RT.nearBed = false;
  for (let j=-1;j<=1;j++) for(let i=-1;i<=1;i++) if (getT(m,Math.floor(p.x)+i,Math.floor(p.y)+j)===T.BED && placeAt(p.map,Math.floor(p.x),Math.floor(p.y))===homePlace()) RT.nearBed=true;
  { const here=placeAt(p.map,Math.floor(p.x),Math.floor(p.y)); RT.nearMission = here==="outer.hangar"; RT.nearTraining = here==="outer.training"; }
  // a tap route just ended: do what the tap was aiming at
  if (arrived){
    if (arrived.npc){ const n=RT.npcs[arrived.npc];
      if (n && n.map===p.map && !n.transit && !n.shadow){
        if (Math.hypot(n.x-p.x,n.y-p.y)<2.2) Chat.open([n.id]);
        else if ((arrived.tries||0)<4) tapMove(Math.floor(n.x), Math.floor(n.y), {npc:n.id, tries:(arrived.tries||0)+1}, true); } }
    else if (arrived.gate && RT.nearGate) travel(RT.nearGate);
    else if (arrived.bed && RT.nearBed) openRest();
    else if (arrived.mission && RT.nearMission) openMissionBoard();
  }
}
// ---- Tap / click to walk ----
function nearestWalkable(m, tx, ty){
  if (walkable(m,tx,ty)) return {x:tx, y:ty};
  const p=S.player; let best=null, bd=Infinity;
  for (let r=1; r<=3 && !best; r++) for (let j=-r;j<=r;j++) for (let i=-r;i<=r;i++){
    if (Math.max(Math.abs(i),Math.abs(j))!==r || !walkable(m,tx+i,ty+j)) continue;
    const d=Math.hypot(i,j)*10 + Math.hypot(tx+i+0.5-p.x, ty+j+0.5-p.y)*0.1;
    if (d<bd){ bd=d; best={x:tx+i, y:ty+j}; } }
  return best;
}
function tapMove(tx, ty, auto, quiet){
  const p=S.player, m=MAPS[p.map]; const goal=nearestWalkable(m,tx,ty);
  if (!goal) return false;
  const path=astar(m, Math.floor(p.x), Math.floor(p.y), goal.x, goal.y);
  if (path===null){ if(!quiet) toast("거기로는 갈 수 없어요."); return false; }
  RT.ppath=path; RT.auto=auto||null; return true;
}
function nearbyNPCs(radius=4.5, exclude=[], includeShadow=false){
  const p=S.player; return Object.values(RT.npcs).filter(n=>n.map===p.map && !n.transit && (!n.shadow || includeShadow) && !exclude.includes(n.id) && Math.hypot(n.x-p.x,n.y-p.y)<=radius);
}

let cv, ctx;
function resize(){
  const dpr = Math.max(1, Math.min(2, window.devicePixelRatio||1));
  cv.width = Math.floor(innerWidth*dpr); cv.height=Math.floor(innerHeight*dpr);
  const cols = innerWidth<700 ? 12 : 20, rows = innerWidth<700 && innerHeight<innerWidth ? 8 : 13;   // phone: fewer, bigger tiles
  const base = Math.min(innerWidth/(16*cols), innerHeight/(16*rows));
  RT.scale = clamp(Math.round(base*dpr*2)/2, 2, 5);
}
function isNight(min){ return min<345 || min>=1140; }
function darknessFor(map, min){
  // dome sky: sunrise about 05:45-07:00, sunset about 17:45-19:00; moonlit nights are brighter
  const day=Math.floor(S.time/1440), w=weatherOf(map, day);
  const night = 0.56 - (w==="clear"||w==="cloudy" ? 0.16*moonLight(day) : 0);
  let a;
  if (min<345||min>=1140) a=night; else if (min<420) a=night-(min-345)/75*(night-0.03); else if (min<1065) a=0.03; else a=0.03+(min-1065)/75*(night-0.03);
  if (w==="overcast") a+=0.05; if (w==="storm") a+=0.13;
  return clamp(a,0,0.72);
}
let darkCanvas=null;
function render(now){
  const p=S.player, m=MAPS[p.map], sc=RT.scale, TS=16*sc;
  ctx.imageSmoothingEnabled=false;
  const vw=cv.width, vh=cv.height;
  const drawerW = (typeof Chat!=="undefined" && Chat.session && innerWidth>760) ? Math.min(560, innerWidth)*(vw/innerWidth) : 0;
  let cx = p.x*TS - (vw-drawerW)/2, cy = p.y*TS - vh/2;
  cx = m.w*TS<=vw ? (m.w*TS-vw)/2 : clamp(cx,0,m.w*TS-vw+drawerW); cy = m.h*TS<=vh ? (m.h*TS-vh)/2 : clamp(cy,0,m.h*TS-vh);
  RT.cam={x:cx,y:cy};
  ctx.fillStyle = "#071425"; ctx.fillRect(0,0,vw,vh);
  ctx.drawImage(MAP_IMG[p.map], -cx, -cy, m.w*TS, m.h*TS);
  // gates animated
  const tt=now/1000;
  for (const g of GATES.filter(g=>g.map===p.map)){
    const gx=(g.x+g.w/2)*TS-cx, gy=(g.y+g.h/2)*TS-cy; const gi=gfxImage(`gate_${g.map}_to_${g.to}`);
    if (gi){ const col=gateColor(g); const grd=ctx.createRadialGradient(gx,gy,2,gx,gy,24*sc); grd.addColorStop(0,`rgba(${col},.45)`); grd.addColorStop(1,`rgba(${col},0)`); ctx.fillStyle=grd; ctx.fillRect(gx-24*sc,gy-24*sc,48*sc,48*sc); ctx.imageSmoothingEnabled=GFX.smooth; ctx.drawImage(gi, gx-24*sc, gy-24*sc, 48*sc, 48*sc); ctx.imageSmoothingEnabled=false; }
    else drawGateBuiltin(ctx, g, gx, gy, sc, tt);
  }
  if (RT.ppath && RT.ppath.length && !RT.uiOpen){ const d=RT.ppath[RT.ppath.length-1];
    ctx.strokeStyle="rgba(255,255,255,.8)"; ctx.lineWidth=Math.max(2,sc*0.7); ctx.beginPath(); ctx.ellipse((d.x+.5)*TS-cx,(d.y+.62)*TS-cy,TS*.3,TS*.15,0,0,7); ctx.stroke(); }
  // entities
  const ents=[];
  for (const n of Object.values(RT.npcs)) if (n.map===p.map && !n.transit && !n.shadow && !n.away) ents.push({kind:"npc", n, y:n.y});
  const hosts = new Set(Object.values(RT.npcs).filter(n=>n.shadow && n.map===p.map).map(n=>G(charById(n.id))?.leash));

    else { who=e.n.id; x=e.n.x; y=e.n.y; dir=e.n.dir; frame=e.n.frame; }

    if (e.kind==="npc" && hosts.has(e.n.id)){ ctx.fillStyle="rgba(8,4,18,.55)"; ctx.beginPath(); ctx.ellipse(x*TS-cx, y*TS-cy+1.5*sc, 8*sc*big, 2.8*sc, 0, 0, 7); ctx.fill(); }
    ctx.imageSmoothingEnabled = spr.builtin ? false : GFX.smooth;
    ctx.drawImage(spr.img, frame*spr.fw, dir*spr.fh, spr.fw, spr.fh, Math.round(sx), Math.round(sy), dw, dh);
    ctx.imageSmoothingEnabled=false;
    if (e.kind==="npc"){ const c=charById(e.n.id); const met=S.rel[c.id]?.introduced; const d=Math.hypot(x-p.x,y-p.y);
      labels.push({x:x*TS-cx, y:sy-4*sc, name: (met && !formOf(c.id)?.hideName)?cname(c):"???", d, n:e.n, near: RT.nearNpc===e.n, busy:e.n.busy}); }
  }

    ctx.strokeStyle="rgba(190,210,235,.45)"; ctx.lineWidth=Math.max(1,sc/2); ctx.beginPath();
    for (const r of RT.rain){ ctx.moveTo(r.x,r.y); ctx.lineTo(r.x-3*sc,r.y+10*sc); r.y+=r.v*RT.dt; r.x-=r.v*RT.dt*0.25; if(r.y>vh){ r.y=-20; r.x=Math.random()*(vw+200); } }
    ctx.stroke(); } else RT.rain.length=0;
  if (w==="fog"||w==="mist"){ RT.fogT+=RT.dt; const a = w==="fog"?0.32:0.18; for (let k=0;k<5;k++){ const fx=((k*0.37+RT.fogT*0.015*(k%2?1:-1))%1.4-0.2)*vw, fy=(k/5)*vh+Math.sin(RT.fogT*0.2+k)*30; const g2=ctx.createRadialGradient(fx,fy,10,fx,fy,vw*0.45); g2.addColorStop(0,`rgba(200,205,220,${a})`); g2.addColorStop(1,"rgba(200,205,220,0)"); ctx.fillStyle=g2; ctx.fillRect(0,0,vw,vh);} }
  // darkness with lights
  const dk = darknessFor(p.map, S.time%1440);
  if (dk>0.02){
    if (!darkCanvas) darkCanvas=document.createElement("canvas");
    if (darkCanvas.width!==vw||darkCanvas.height!==vh){ darkCanvas.width=vw; darkCanvas.height=vh; }
    const d=darkCanvas.getContext("2d"); d.globalCompositeOperation="source-over"; d.clearRect(0,0,vw,vh);
    d.fillStyle=`rgba(12,10,36,${dk})`; d.fillRect(0,0,vw,vh);
    d.globalCompositeOperation="destination-out";
    const light=(lx,ly,r,a)=>{ const g3=d.createRadialGradient(lx,ly,0,lx,ly,r); g3.addColorStop(0,`rgba(0,0,0,${a})`); g3.addColorStop(1,"rgba(0,0,0,0)"); d.fillStyle=g3; d.fillRect(lx-r,ly-r,r*2,r*2); };
    const x0=Math.floor(cx/TS)-4, y0=Math.floor(cy/TS)-4, x1=Math.ceil((cx+vw)/TS)+4, y1=Math.ceil((cy+vh)/TS)+4;
    for (let ty=y0; ty<y1; ty++) for (let tx=x0; tx<x1; tx++){ const t=getT(m,tx,ty); if (t===T.LAMP) light((tx+.5)*TS-cx,(ty+.2)*TS-cy,TS*3.2,0.9); else if (t===T.WOOD && (tx+ty)%5===0) light((tx+.5)*TS-cx,(ty+.5)*TS-cy,TS*2.2,0.55); else if (t===T.STONE && (tx*7+ty*3)%13===0) light((tx+.5)*TS-cx,(ty+.5)*TS-cy,TS*1.8,0.35); }
    for (const g of GATES.filter(g=>g.map===p.map)) light((g.x+g.w/2)*TS-cx,(g.y+g.h/2)*TS-cy,TS*4.5,0.95);
    light(p.x*TS-cx, (p.y-0.4)*TS-cy, TS*2.6, 0.5);
    ctx.drawImage(darkCanvas,0,0);
  }
  // labels: activity text only for the closest person in view (avoids overlap)
  let closest=null; for (const L of labels) if (L.d<6 && !L.busy && (!closest||L.d<closest.d)) closest=L;
  for (const L of labels) L.act = L===closest ? npcStatus(L.n) : null;
  const fs = Math.max(11, Math.round(5.2*sc));
  ctx.textAlign="center"; ctx.textBaseline="bottom";
  for (const L of labels){
    ctx.font=`600 ${fs}px "IBM Plex Sans KR", sans-serif`;
    const tw=ctx.measureText(L.name).width; ctx.fillStyle=L.near?"rgba(29,139,128,.92)":"rgba(20,18,30,.72)"; roundRect(ctx,L.x-tw/2-6,L.y-fs-5,tw+12,fs+6,6); ctx.fill();
    ctx.fillStyle="#fff"; ctx.fillText(L.name, L.x, L.y);
    if (L.act){ ctx.font=`400 ${Math.round(fs*0.85)}px "IBM Plex Sans KR", sans-serif`; const aw=ctx.measureText(L.act).width; ctx.fillStyle="rgba(255,255,255,.88)"; roundRect(ctx,L.x-aw/2-5,L.y-fs*2-10,aw+10,fs+3,5); ctx.fill(); ctx.fillStyle="#2a2433"; ctx.fillText(L.act, L.x, L.y-fs-7); }
  }
}
function roundRect(c,x,y,w,hh,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+hh,r); c.arcTo(x+w,y+hh,x,y+hh,r); c.arcTo(x,y+hh,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

const assetGroupOf = (id) => id.startsWith("terrain_") ? id.split("_").slice(0,2).join("_") : id.startsWith("prop_") ? "props" : (id.startsWith("char_")||id.startsWith("portrait_")) ? "chars" : id.startsWith("gate_") ? "gates" : null;

// ---- Built-in drawing (16px reference grid) ----
function drawTerrainBuiltin(x, world, kind, X, Y, r){
  const pal=PAL[world]; const P=(px,py,w,hh,col)=>{ x.fillStyle=col; x.fillRect(px,py,w,hh); };
  switch(kind){
    case "grass": P(X,Y,16,16,pal.grass[Math.floor(r()*3)]); for(let k=0;k<3;k++) P(X+Math.floor(r()*15),Y+Math.floor(r()*15),1,2,shade(pal.grass[0],0.82)); break;
    case "path": P(X,Y,16,16,pal.path[Math.floor(r()*2)]); if(r()<0.4) P(X+Math.floor(r()*14),Y+Math.floor(r()*14),2,1,shade(pal.path[0],0.85)); break;
    case "stone": P(X,Y,16,16,pal.stone[Math.floor(r()*pal.stone.length)]); P(X,Y+15,16,1,"rgba(0,0,0,.12)"); P(X+15,Y,1,16,"rgba(0,0,0,.08)"); break;
    case "deadgrass": P(X,Y,16,16,pal.dead[Math.floor(r()*2)]); for(let k=0;k<3;k++) P(X+Math.floor(r()*15),Y+Math.floor(r()*14),1,2,"#3d3b30"); break;
    case "floor": case "door": P(X,Y,16,16,pal.wood[Math.floor(r()*2)]); P(X,Y+7,16,1,"rgba(0,0,0,.12)"); P(X,Y+15,16,1,"rgba(0,0,0,.15)"); if(kind==="door"){ P(X,Y,2,16,shade(pal.wall,0.8)); P(X+14,Y,2,16,shade(pal.wall,0.8)); } break;
    case "planks": P(X,Y,16,16,pal.plank[Math.floor(r()*2)]); P(X+7,Y,1,16,"rgba(0,0,0,.25)"); P(X+15,Y,1,16,"rgba(0,0,0,.25)"); break;
    case "wall": P(X,Y,16,16,pal.wall); P(X,Y,16,5,pal.wallTop); P(X,Y+15,16,1,"rgba(0,0,0,.3)"); if(pal.port && r()<0.3){ x.fillStyle=shade(pal.wall,0.7); x.beginPath(); x.arc(X+8,Y+10,3.4,0,7); x.fill(); x.fillStyle=pal.port; x.beginPath(); x.arc(X+8,Y+10,2.5,0,7); x.fill(); P(X+7,Y+8,1,1,"rgba(255,255,255,.45)"); } break;
    case "water": P(X,Y,16,16,pal.water[Math.floor(r()*2)]); P(X+Math.floor(r()*10),Y+Math.floor(r()*14),5,1,"rgba(255,255,255,.18)"); break;
    case "tree": x.fillStyle="rgba(0,0,0,.22)"; x.beginPath(); x.ellipse(X+8,Y+14,6,2,0,0,7); x.fill(); P(X+7,Y+9,3,6,pal.trunk); x.fillStyle=pal.leaf2; x.beginPath(); x.arc(X+8,Y+7,7,0,7); x.fill(); x.fillStyle=pal.leaf; x.beginPath(); x.arc(X+7,Y+6,5.5,0,7); x.fill(); P(X+5,Y+3,2,2,shade(pal.leaf,1.25)); break;
    case "flowers": for(let k=0;k<4;k++){ const fx=X+2+Math.floor(r()*11), fy=Y+2+Math.floor(r()*11); P(fx,fy,2,2,pick(["#f2d36b","#e98aa4","#f4f2ee","#b9a3e8"],r)); } break;
  }
}
function drawPropBuiltin(x, key, X, Y, r){
  const P=(px,py,w,hh,col)=>{ x.fillStyle=col; x.fillRect(px,py,w,hh); };
  switch(key){
    case "counter": P(X+1,Y+3,14,10,"#7a5537"); P(X+1,Y+3,14,3,"#9a7048"); P(X+3,Y+1,4,3,pick(["#e9d7b0","#c9e0d4","#e8b7a0","#d7d0ea"],r)); break;
    case "bench": P(X+1,Y+7,14,3,"#8a6040"); P(X+1,Y+11,14,2,"#7a5236"); P(X+2,Y+13,2,2,"#4a3a2c"); P(X+12,Y+13,2,2,"#4a3a2c"); break;
    case "lamp": P(X+7,Y+4,2,11,"#3a3644"); P(X+5,Y+1,6,4,"#f3d48a"); P(X+5,Y+1,6,1,"#3a3644"); break;
    case "bed": P(X+1,Y+1,14,14,"#e7e3ef"); P(X+1,Y+1,14,4,"#f8f6fb"); P(X+1,Y+7,14,8,"#6f8fb8"); break;
    case "shelf": P(X+1,Y+1,14,14,"#5d4030"); for(let k=0;k<3;k++) for(let b=0;b<5;b++) P(X+2+b*3,Y+2+k*5,2,4,pick(["#b84a3e","#4a7ab8","#d9b44a","#5a9a62","#9a6ab8"],r)); break;
    case "rock": x.fillStyle="#7d7a86"; x.beginPath(); x.ellipse(X+8,Y+10,6,5,0,0,7); x.fill(); P(X+4,Y+6,5,2,"#9c99a6"); break;
    case "grave": P(X+4,Y+3,8,11,"#8d8f9b"); P(X+4,Y+3,8,2,"#a4a6b2"); P(X+6,Y+7,4,1,"#5f616b"); break;
    case "fence": P(X,Y+6,16,2,"#2f2b26"); P(X,Y+11,16,2,"#2f2b26"); P(X+2,Y+3,2,12,"#3a342e"); P(X+12,Y+3,2,12,"#3a342e"); break;
    case "sealed_gate": P(X+2,Y+1,12,14,"#3b3448"); P(X+4,Y+3,8,12,"#1f1a2b"); P(X+6,Y+6,4,1,"#6b5f8a"); P(X+7,Y+5,2,3,"#6b5f8a"); break;
  }
}
function gateColor(g){ return g.to==="life"?[240,196,130]:g.to==="outer"?[127,205,235]:g.to==="farm"?[150,220,140]:[196,190,255]; }
function drawGateBuiltin(x, g, cx, cy, s, t=0){

  x.fillStyle="#8d9bb3"; x.fillRect(L+3*s,Tp+6*s,w/2-3.5*s,hh-8*s); x.fillRect(cx+0.5*s,Tp+6*s,w/2-3.5*s,hh-8*s);
  x.fillStyle="#a9b6cb"; x.fillRect(L+3*s,Tp+6*s,w/2-3.5*s,2*s); x.fillRect(cx+0.5*s,Tp+6*s,w/2-3.5*s,2*s);
  x.fillStyle=`rgba(${col},${0.55+0.35*Math.sin(t*2.2)})`; x.fillRect(cx-0.6*s,Tp+6*s,1.2*s,hh-8*s);
  x.fillStyle=`rgb(${col})`; x.fillRect(cx-4*s,Tp+2.4*s,8*s,2*s);

// ---- Which layers a map tile is made of ----
function tileLayers(m, tx, ty){
  const t=getT(m,tx,ty), w=m.id; const nb=[getT(m,tx+1,ty),getT(m,tx-1,ty),getT(m,tx,ty+1),getT(m,tx,ty-1)];
  const near=(k)=>nb.includes(k); const indoor = near(T.WOOD)||near(T.DOOR)||near(T.BED)||near(T.SHELF);
  const base = () => indoor?"floor" : near(T.PLANK)?"planks" : near(T.PATH)?"path" : (near(T.GRASS)&&!near(T.STONE))?"grass" : "stone";
  switch(t){
    case T.GRASS: return ["grass"]; case T.PATH: return ["path"]; case T.STONE: return ["stone"]; case T.DEAD: return ["deadgrass"];
    case T.WOOD: return ["floor"]; case T.DOOR: return ["door"]; case T.WALL: return ["wall"]; case T.WATER: return ["water"];
    case T.PLANK: case T.BRIDGE: return ["planks"]; case T.GATE: return ["stone"];
    case T.FLOWER: return ["grass", `terrain_${w}_flowers`]; case T.TREE: return ["grass", `terrain_${w}_tree`];
    case T.COUNTER: return [base(),"prop_counter"];
    case T.BENCH: return [base(),"prop_bench"];
    case T.LAMP: return [base(),"prop_lamp"];
    case T.BED: return ["floor","prop_bed"]; case T.SHELF: return ["floor","prop_shelf"];
    case T.ROCK: return [base(),"prop_rock"];
    case T.GRAVE: return [base(),"prop_grave"]; case T.FENCE: return [base(),"prop_fence"];
    case T.SEALED: return ["stone","prop_sealed_gate"];
  }
  return ["grass"];
}

// ---- Packs (stored separately from the game save) ----
const GFX = { packs:[], active:{}, smooth:false };
const GFX_IMG = {};
function gfxImage(id){ return GFX_IMG[id]||null; }
async function loadGfx(){ const g=await Store.get("gfx"); if (g){ GFX.packs=g.packs||[]; GFX.active=g.active||{}; GFX.smooth=!!g.smooth; } }
async function saveGfx(){ await Store.set("gfx", JSON.parse(JSON.stringify(GFX))); }
function decodeImage(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error("decode")); im.src=src; }); }
async function rebuildGfx(){
  for (const k of Object.keys(GFX_IMG)) delete GFX_IMG[k];
  const jobs=[];
  for (const grp of GFX_GROUPS){
    const pid=GFX.active[grp.id]; if (!pid || pid==="builtin") continue; const pack=GFX.packs.find(p=>p.id===pid); if (!pack) continue;
    for (const [id,src] of Object.entries(pack.images||{})) if (assetGroupOf(id)===grp.id) jobs.push(decodeImage(src).then(im=>{ GFX_IMG[id]=im; }).catch(()=>{}));
  }
  await Promise.all(jobs);
  if (MAPS) for (const id of Object.keys(MAPS)) MAP_IMG[id]=renderMapImage(MAPS[id]);
  if (typeof Chat!=="undefined" && Chat.session) Chat.renderHead();
}
function mapResolution(){
  let mx=16; for (const [id,im] of Object.entries(GFX_IMG)) if (id.startsWith("terrain_")||id.startsWith("prop_")) mx=Math.max(mx, im.naturalWidth||16);
  return clamp(Math.ceil(mx/16)*16, 16, 64);
}
function renderMapImage(m){
  const RES = mapResolution(), k = RES/16;
  const c=document.createElement("canvas"); c.width=m.w*RES; c.height=m.h*RES; const x=c.getContext("2d");
  x.imageSmoothingEnabled = GFX.smooth;
  for (let ty=0; ty<m.h; ty++) for (let tx=0; tx<m.w; tx++){
    const [g, prop] = tileLayers(m,tx,ty); const r=seeded(`${m.id}${tx},${ty}`); const X=tx*RES, Y=ty*RES;
    const gid=`terrain_${m.id}_${g}`; const gi=gfxImage(gid);
    if (gi) x.drawImage(gi, X, Y, RES, RES); else { x.save(); x.translate(X,Y); x.scale(k,k); drawTerrainBuiltin(x, m.id, g, 0, 0, r); x.restore(); }
    if (prop){ const pi=gfxImage(prop);
      if (pi) x.drawImage(pi, X, Y, RES, RES);
      else { x.save(); x.translate(X,Y); x.scale(k,k); if (prop.startsWith("terrain_")) drawTerrainBuiltin(x, m.id, prop.split("_").slice(2).join("_"), 0, 0, r); else drawPropBuiltin(x, prop.slice(5), 0, 0, r); x.restore(); } }
  }
  return c;
}

// ---- Sprites & portraits with overrides ----
function spriteSpec(who){
  if (who==="player") return stripImgs(S.persona.sprite);
  let sp=G(charById(who)).sprite; const f=formOf(who); if (f && f.sprite) sp={...sp, ...f.sprite};
  if ((sp.acc||[]).includes("devilTail")){ const r=S.rel[who]; if (r && /기쁨|기뻐|좋아|행복|설렘|설레|편안|만족|들뜬|안도|흐뭇/.test(r.mood||"")) return {...sp, tailTip:"heart"}; }
  return sp;
}
function spriteFor(who){
  if (who==="player"){ const own=imgFromData(S.persona.sprite.sheetImg); if (own) return {img:own, fw:own.naturalWidth/3, fh:own.naturalHeight/4, oy:0}; }
  const im=gfxImage(`char_${who}_sheet`);
  if (im) return {img:im, fw:im.naturalWidth/3, fh:im.naturalHeight/4, oy:0};
  return {img:getSheet(spriteSpec(who)), fw:SPR_W, fh:SPR_H, oy:0, builtin:true};
}
function portraitFor(who, size=48){
  if (who==="player" && S.persona.sprite.portraitImg){ const img=h("img",{src:S.persona.sprite.portraitImg, alt:"", style:`width:${size}px;height:${size}px;object-fit:cover`}); img.className="portrait"; return img; }
  const pi=gfxImage(`portrait_${who}`);
  if (pi){ const img=h("img",{src:pi.src, alt:"", style:`width:${size}px;height:${size}px;object-fit:cover;image-rendering:${GFX.smooth?"auto":"pixelated"}`}); img.className="portrait"; return img; }
  const si=gfxImage(`char_${who}_sheet`);
  if (si){ const fw=si.naturalWidth/3; const c=document.createElement("canvas"); c.width=fw; c.height=fw; const x=c.getContext("2d"); x.imageSmoothingEnabled=GFX.smooth; x.drawImage(si,0,0,fw,fw,0,0,fw,fw); c.style.width=size+"px"; c.style.height=size+"px"; return c; }
  return portraitCanvas(spriteSpec(who), size);
}

// ---- Templates: the built-in art for each asset, as a PNG to draw over ----
function builtinAssetCanvas(a){
  if (a.kind==="tile"){ const c=document.createElement("canvas"); c.width=16; c.height=16; const x=c.getContext("2d"); drawTerrainBuiltin(x, a.world, a.key, 0,0, seeded(a.id)); return c; }
  if (a.kind==="prop"){ const c=document.createElement("canvas"); c.width=16; c.height=16; const x=c.getContext("2d"); drawPropBuiltin(x, a.key, 0,0, seeded(a.id)); return c; }
  if (a.kind==="sheet"){ const src=getSheet(spriteSpec(a.who)); const c=document.createElement("canvas"); c.width=48; c.height=80; c.getContext("2d").drawImage(src,0,0); return c; }
  if (a.kind==="portrait"){ const c=document.createElement("canvas"); c.width=BUST; c.height=BUST; c.getContext("2d").drawImage(bustCanvasRaw(spriteSpec(a.who)),0,0); return c; }
  if (a.kind==="gate"){ const c=document.createElement("canvas"); c.width=48; c.height=48; const x=c.getContext("2d"); drawGateBuiltin(x, a.gate, 24, 24, 1.05); return c; }
}
function upscale(c, k=4){ const o=document.createElement("canvas"); o.width=c.width*k; o.height=c.height*k; const x=o.getContext("2d"); x.imageSmoothingEnabled=false; x.drawImage(c,0,0,o.width,o.height); return o; }
const canvasToBlob = (c) => new Promise(res=>c.toBlob(res,"image/png"));
function currentAssetSrc(a, pack){
  if (pack && pack.images?.[a.id]) return pack.images[a.id];
  return upscale(builtinAssetCanvas(a), 4).toDataURL("image/png");
}
async function saveFile(filename, data, mime="application/octet-stream"){
  try{ if (IN_CLAUDE){ const dl=await window.claude.use("downloads"); if (dl){ await dl.save({filename, data}); return true; } } }
  catch(e){ if (e?.code==="declined") return false; }
  if (COARSE && navigator.share && navigator.canShare && typeof File==="function"){      // iPhone/iPad: hand the file to the share sheet ("파일에 저장")
    try{ const file=new File([data], filename, {type: data instanceof Blob && data.type ? data.type : mime});
      if (navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return true; } }
    catch(e){ if (e && e.name==="AbortError") return false; }

async function importFilesIntoPack(pack, files){
  const ids=new Set(gfxAssets().map(a=>a.id)); let ok=0, skipped=[];
  const put = async (name, dataURL) => { const base=name.split("/").pop().replace(IMG_EXT,""); if (!ids.has(base)){ skipped.push(name.split("/").pop()); return; } try{ await decodeImage(dataURL); pack.images[base]=dataURL; ok++; }catch(e){ skipped.push(name.split("/").pop()); } };

    if (/\.zip$/i.test(f.name)){
      if (!window.JSZip){ toast("zip을 열 수 없어요. 그림 파일을 직접 골라주세요."); continue; }
      const z=await JSZip.loadAsync(f);
      for (const [path, entry] of Object.entries(z.files)){ if (entry.dir || !IMG_EXT.test(path)) continue; const ext=path.match(IMG_EXT)[1].toLowerCase().replace("jpg","jpeg"); const b64=await entry.async("base64"); await put(path, `data:image/${ext};base64,${b64}`); }

async function llmGenerate(task, prompt, {onText, signal, tier, json=false, maxTokens}={}){

    if (!AI.ready) throw {code:"builtin_unavailable"};

    if (json){ const data = await AI.sample.json(prompt, opts); return {text:JSON.stringify(data), data}; }
    const r = await AI.sample(prompt, opts); return {text:r.text, truncated:r.truncated};
  }
  if (!profileReady(p)) throw {code:"no_connection", message:"profile incomplete"};
  const text = await callProvider(p, prompt, {onText, signal, json, maxTokens});
  if (!text || !text.trim()) throw {code:"empty_completion"};
  if (json){ const data = parseJSONLoose(text); if (data===undefined) throw {code:"invalid_json", text}; return {text, data}; }

  if (a>=0 && b>a){ try{ return JSON.parse(s.slice(a,b+1)); }catch(e){} }
  return undefined;
}

    for(;;){
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      let i; while ((i=buf.indexOf("\n"))>=0){ const line=buf.slice(0,i).replace(/\r$/,""); buf=buf.slice(i+1);
        if (!line.startsWith("data:")) continue; const d=line.slice(5).trim(); if (!d || d==="[DONE]") continue;

function parseServiceAccount(raw){
  let sa; try{ sa = typeof raw==="string" ? JSON.parse(raw) : raw; }catch(e){ throw {code:"bad_sa", message:"서비스 계정 JSON을 읽지 못했어요. 파일 내용을 처음부터 끝까지 그대로 붙여넣어 주세요."}; }
  if (!sa || !sa.client_email || !sa.private_key || !sa.project_id) throw {code:"bad_sa", message:"JSON에 client_email, private_key, project_id가 있어야 해요."};
  return sa;
}
const b64url = (bytes) => { let s=""; const u=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes); for (let i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };

async function signServiceJWT(sa, now=Math.floor(Date.now()/1000)){
  if (!crypto?.subtle) throw {code:"no_crypto", message:"이 브라우저에서는 서명 기능을 쓸 수 없어요."};
  const pem = String(sa.private_key).replace(/\\n/g,"\n");
  const der = Uint8Array.from(atob(pem.replace(/-----[^-]+-----/g,"").replace(/\s+/g,"")), c=>c.charCodeAt(0));
  const key = await crypto.subtle.importKey("pkcs8", der.buffer, {name:"RSASSA-PKCS1-v1_5", hash:"SHA-256"}, false, ["sign"]);
  const unsigned = b64urlStr(JSON.stringify({alg:"RS256", typ:"JWT", kid:sa.private_key_id})) + "." + b64urlStr(JSON.stringify({iss:sa.client_email, scope:"https://www.googleapis.com/auth/cloud-platform", aud:sa.token_uri||"https://oauth2.googleapis.com/token", iat:now, exp:now+3600}));
  const sig = await crypto.subtle.sign("RSASSA-PKCS1-v1_5", key, new TextEncoder().encode(unsigned));
  return unsigned + "." + b64url(new Uint8Array(sig));
}
async function vertexToken(pid, sa){
  const c = TOKENS[pid]; if (c && c.exp > Date.now()+60000 && c.email===sa.client_email) return c.token;
  const jwt = await signServiceJWT(sa);
  const res = await doFetch(sa.token_uri||"https://oauth2.googleapis.com/token", {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:"grant_type="+encodeURIComponent("urn:ietf:params:oauth:grant-type:jwt-bearer")+"&assertion="+jwt});

  const j = await res.json(); TOKENS[pid] = {token:j.access_token, exp:Date.now()+(j.expires_in||3600)*1000, email:sa.client_email};
  return j.access_token;

// ---- Relationship helpers ----
function rel(id){
  if (!S.rel[id]){ const c=charById(id), g=G(c); S.rel[id]={axes:{...((S.role==="rookie" && g.seedAxesRookie) || g.seedAxes || {trust:0,intimacy:0,tension:0,reliance:0,curiosity:10,attraction:0})}, narrative:"", introduced:false, knowsName:false, met:false, mood:"", budget:{day:-1,used:0}, talks:0}; }
  return S.rel[id];
}
function axisWord(v){ return v<10?"거의 없음":v<25?"낮음":v<45?"조금 있음":v<65?"꽤 있음":v<85?"높음":"매우 높음"; }
function axesLine(id){ const a=rel(id).axes; return AXES.map(x=>`${x.name} ${axisWord(a[x.id]||0)}(${Math.round(a[x.id]||0)})`).join(", "); }
function applyDeltas(id, deltas, exchange, sessionExchCount, cap=8){
  const r=rel(id); const day=Math.floor(S.time/1440); if (r.budget.day!==day){ r.budget={day, used:0}; }
  const applied={};
  for (const ax of AXES){
    let d = Number(deltas?.[ax.id]||0); if (!isFinite(d)) d=0; d=clamp(Math.round(d),-4,4); if (!d) continue;
    let eff=d; const before=r.axes[ax.id]||0;
    if (d>0 && ["trust","intimacy","reliance","attraction"].includes(ax.id)){
      if (r.budget.used>=cap) eff=d*0.3; r.budget.used+=d;   // daily budget: bonds grow over days, not in one sitting
      if (sessionExchCount>6) eff*=0.6;                     // long single sessions give less
      eff *= (1 - before/140);                               // the closer, the slower
    } r.axes[ax.id]=clamp(before+eff,0,100); applied[ax.id]=r.axes[ax.id]-before;
  }
  return applied;
}
function revertDeltas(id, applied){ const r=rel(id); for (const [k,v] of Object.entries(applied||{})) r.axes[k]=clamp((r.axes[k]||0)-v,0,100); }

// ---- Memory store ----
function mems(id){ if(!S.memories[id]) S.memories[id]=[]; return S.memories[id]; }
function activeMems(id, level){ return mems(id).filter(m=>!m.archived && (level==null||m.level===level)).sort((a,b)=>a.time-b.time); }
function addMem(id, data){ const m={id:uid("m"), level:0, text:"", time:S.time, msgIds:[], sessionId:null, children:[], archived:false, pinned:false, stale:false, edited:false, exId:null, ...data}; mems(id).push(m); return m; }
function findMem(id, memId){ return mems(id).find(m=>m.id===memId); }
const LEVEL_NAME = ["장면 기억","에피소드 기억","장기 기억"];

function findMsg(msgId){ for (const s of S.sessions){ const m=s.messages.find(x=>x.id===msgId); if(m) return {s,m}; } return null; }
function leafMsgIds(id, mem, acc=new Set()){
  if (mem.level===0){ for (const x of mem.msgIds) acc.add(x); return acc; }
  for (const cid of mem.children){ const c=findMem(id,cid); if(c) leafMsgIds(id,c,acc); }
  return acc;
}
function formatMsgsForPOV(msgIds){
  const out=[]; const ids=[...msgIds];
  const all=[]; for (const id of ids){ const f=findMsg(id); if(f) all.push(f); }
  all.sort((a,b)=>a.m.time-b.m.time);
  for (const {s,m} of all){
    const who = m.role==="player" ? S.persona.name : m.role==="ai" ? "장면" : "알림";
    out.push(`[${shortStamp(m.time)} · ${PLACES[s.place]?.name||""}] ${who}: ${m.text}`);
  }
  return out.join("\n\n");
}
function markStaleForMsg(msgId){
  for (const [cid, list] of Object.entries(S.memories)) for (const m of list){ if (m.level===0 && m.msgIds.includes(msgId)){ m.stale=true; let parent=list.find(p=>p.children.includes(m.id)); while(parent){ parent.stale=true; const pp=parent; parent=list.find(p=>p.children.includes(pp.id)); } } }
}

const POV_RULES = (name, knowsUser) => `- ${name}의 시점에서, ${iGa(name)} 직접 보고, 듣고, 말하고, 행동하고, 느낀 것만 3인칭으로 쓴다.
- 다른 인물의 속마음, 감정, 생각, 그리고 ${S.persona.name}의 속마음은 쓰지 않는다. 겉으로 드러난 말과 행동, 그리고 그것에 대한 ${name} 자신의 해석(틀릴 수 있다)만 쓴다.
- ${iGa(name)} 그 자리에 없었거나 듣지 못한 내용, 서술자만 아는 내용은 쓰지 않는다.
- ${knowsUser ? `${eunNeun(name)} ${S.persona.name}의 이름을 안다.` : `${eunNeun(name)} 아직 ${S.persona.name}의 이름을 모른다. 이름 대신 ${iGa(name)} 보기에 자연스러운 호칭(외모나 상황)으로 부른다.`}
- 구체적으로 쓴다: 새로 알게 된 사실, 약속, 주고받은 물건, 감정이 움직인 지점, 풀리지 않은 질문.`;

// ---- Prompt assembly for the scene ----
function nextScheduleLine(c){
  const now=S.time; const cur=decideAt(c, now);
  for (let t=now+10; t<now+600; t+=10){ const d=decideAt(c,t); if (d.place!==cur.place || d.act!==cur.act) return `${fmtHM(t)}에는 ${PLACES[d.place]?.name}에서 '${d.act}' 예정`; }
  return "당분간 지금 하던 일을 계속할 예정";
}
function memoryBlock(id){
  const lines=[];
  const pinned = activeMems(id).filter(m=>m.pinned);
  const l2=activeMems(id,2).filter(m=>!m.pinned), l1=activeMems(id,1).filter(m=>!m.pinned), l0=activeMems(id,0).filter(m=>!m.pinned).slice(-10);
  if (pinned.length) lines.push("[꼭 기억하는 것]\n"+pinned.map(m=>"- "+m.text).join("\n"));
  if (l2.length) lines.push("[오래된 기억]\n"+l2.map(m=>"- "+m.text).join("\n"));
  if (l1.length) lines.push("[지난 일들]\n"+l1.map(m=>`- (${shortStamp(m.time)}) ${m.text}`).join("\n"));
  if (l0.length) lines.push("[최근 장면들]\n"+l0.map(m=>`- (${shortStamp(m.time)}) ${m.text}`).join("\n"));
  return lines.join("\n") || (S.role==="kyle" ? `(이 게임에서 새로 쌓인 장면 기억은 아직 없다. ${wa(S.persona.name)}의 오랜 관계는 설정을 따른다.)` : `(${wa(S.persona.name)} 관련된 기억 없음. 처음 마주친다.)`);
}
function charBlock(id, session){
  const c=charById(id), d=c.card.data, g=G(c), r=rel(id), n=RT.npcs[id], name=d.name;
  const others = session.participants.filter(x=>x!==id);
  const near = nearbyIds(session);
  const rels = Object.entries(g.relations||{}).filter(([k])=>charById(k));
  const relOf = ([k,v])=>`- ${cname(charById(k))}: ${v}`;
  const relLines = rels.filter(([k])=>others.includes(k)||near.includes(k)).map(relOf);
  const here = new Set([...others, ...near]);
  const otherRel = rels.filter(([k])=>!here.has(k)).map(relOf);
  const L=[`<character name="${name}">`];
  if (d.description) L.push(macro(d.description,name));
  if (d.personality) L.push(`[성격]\n${macro(d.personality,name)}`);
  if (d.scenario) L.push(`[처지] ${macro(d.scenario,name)}`);
  if (g.speech) L.push(`[말투] ${g.speech}`);
  if (g.agenda) L.push(`[지금의 목표] ${g.agenda}`);
  if (g.secret) L.push(`[비밀: 쉽게 드러내지 않는다] ${g.secret}`);
  if ((g.likes||[]).length || (g.dislikes||[]).length) L.push(`[좋아하는 것] ${(g.likes||[]).join(", ")} / [싫어하는 것] ${(g.dislikes||[]).join(", ")}`);
  if (relLines.length) L.push(`[이 자리에 있는 사람들에 대한 생각]\n${relLines.join("\n")}`);
  if (otherRel.length) L.push(`[주변 인물에 대한 생각]\n${otherRel.join("\n")}`);
  if (S.role==="rookie" && g.rookieNote) L.push(`[신입 요원 ${S.persona.name}을(를) 대하는 처음 태도. 관계가 쌓이면 달라진다] ${macro(g.rookieNote,name)}`);
  { const f=formOf(id); if (f && f.note) L.push(`[지금 모습] ${f.note}`); }
  L.push(`[지금 상태] 대화 전에 하던 일: ${session.before?.[id]||n?.act||""}. 기분: ${r.mood||"평소와 같음"}. 이후 일정: ${nextScheduleLine(c)}.`);
  L.push(`[${wa(S.persona.name)}의 관계] ${r.talks?`이 게임에서 ${r.talks}번 이야기를 나눔.`:(S.role==="kyle"?"오래 알아 온 사이. 이 게임에서 나눈 대화는 아직 없다.":"처음 마주친다.")} ${r.knowsName?`${S.persona.name}의 이름을 안다.`:`아직 ${S.persona.name}의 이름을 모른다.`}\n수치: ${axesLine(id)}`);
  if (r.narrative) L.push(`${name}의 시선에서 본 관계: ${r.narrative}`);
  L.push(`[${name}의 기억: 설정에 적힌 이력 외에 ${iGa(name)} 겪은 일은 이것이 전부다]\n${memoryBlock(id)}`);
  if (d.post_history_instructions) L.push(`[추가 지시] ${macro(d.post_history_instructions,name)}`);
  L.push(`</character>`);
  return L.join("\n");
}
function nearbyIds(session){ return (session.mission || session.date) ? [] : nearbyNPCs(6, session.participants).map(n=>n.id); }
function recentLogText(session){
  const lim = S.settings.recentLog||14;
  const cur = session.messages.filter(m=>m.role!=="sys" || m.important);
  let lines = [];
  if (cur.length < lim){
    const prev = S.sessions.filter(s=>s!==session && s.ended && s.all.some(id=>session.participants.includes(id))).slice(-2);
    const prevMsgs = prev.flatMap(s=>s.messages.filter(m=>m.role!=="sys").map(m=>({m,s}))).slice(-(lim-cur.length));
    if (prevMsgs.length){ lines.push("(이전 만남)"); for (const {m,s} of prevMsgs) lines.push(fmtLog(m,s)); lines.push("(지금 장면)"); }
  }
  for (const m of cur.slice(-lim)) lines.push(fmtLog(m,session));
  return lines.join("\n\n");
}
function fmtLog(m,s){ const who=m.role==="player"?`${S.persona.name}(유저 입력)`:m.role==="ai"?"장면":"알림"; return `[${shortStamp(m.time)} · ${PLACES[s.place]?.name||""}] ${who}: ${m.text}`; }
function pickDials(){ return Object.entries(DIALS).map(([k,v])=>`${k}: ${pick(v)}`).join("\n"); }
function styleAvoid(ids){
  const recent = ids.flatMap(id=>(S.style[id]||[]).slice(-4));
  const ops=[...new Set(recent.map(r=>r.opening).filter(Boolean))], ends=[...new Set(recent.map(r=>r.ending).filter(Boolean))];
  const phrases=[...new Set(recent.flatMap(r=>r.phrases||[]))].slice(-14);
  const tics = String(S.settings.tics||"").split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
  return `최근 응답들의 시작 방식: ${ops.join(" / ")||"(기록 없음)"}
최근 응답들의 끝맺음: ${ends.join(" / ")||"(기록 없음)"}
이번에는 위와 다른 시작과 끝을 고른다.
최근에 쓴 표현(다시 쓰지 않는다): ${phrases.join(", ")||"(없음)"}
상투적인 몸짓 표현(쓰지 않는다): ${tics.join(", ")}
반응이 패턴에 빠지고 있다면, 같은 성격 안에서 다른 표현을 고른다.`;
}
const LENGTHS = {"짧게":"한국어 300~600자","보통":"한국어 600~1100자","길게":"한국어 1100~1800자"};
function buildScenePrompt(session, latest){
  const preset = (S.preset?.blocks||DEFAULT_PRESET.blocks).filter(b=>b.on && (b.id!=="user_write" || S.settings.userAuthorship));
  const main = charById(session.participants[0]);
  const head = preset.map(b=>macro(b.text, main?cname(main):"")).join("\n\n");
  const place = PLACES[session.place];
  const w = weatherOf(place.map, Math.floor(S.time/1440));
  const bg = nearbyIds(session).map(id=>{ const c=charById(id); return `${rel(id).introduced?cname(c):G(c).look}(${npcStatus(RT.npcs[id])})`; });
  if (!session.mission && !session.date) for (const n of nearbyNPCs(6, session.participants, true).filter(n=>n.shadow)){ const c=charById(n.id); bg.push(`${rel(n.id).introduced?cname(c):G(c).look}(${npcStatus(n)}, 모습은 보이지 않음)`); }
  const parts = session.participants.map(id=>{ const c=charById(id); return `${cname(c)}${rel(id).introduced?"":` (${eunNeun(S.persona.name)} 아직 이름을 모름: '${G(c).look}')`}`; });
  session.participants.forEach((id,i)=>{ const f=formOf(id); if (f && f.hideName) parts[i]+=` (지금은 정체를 숨기고 있어서 ${S.persona.name}의 눈에는 '${f.look}'(으)로만 보인다)`; });
  const latestText = latest && latest.trim() ? latest.trim() : "(입력 없음: 이어서 계속. 전권을 잡고 다음 수를 둔다.)";
  return `${head}

<world_lore>
${macro(S.world?.lore||SAMPLE_LORE)}

${session.participants.map(id=>charBlock(id, session)).join("\n\n")}

<scene_state>
장소: ${sceneWhere(session, place)}
시각: ${gameDateLabel(S.time)} ${fmtHM(S.time%1440)}, ${timeOfDay(S.time%1440)}
${(session.mission || (session.date && session.date.outside)) ? `하늘: 기지 밖이라 돔 하늘이 아닌 진짜 하늘 아래다. 그곳의 날씨는 장면에 맞게 정한다` : `돔 하늘: ${WEATHER_NAME[w]} (돔 천장은 바깥의 진짜 하늘과 연동됨)`} · 오늘의 달: ${moonName(Math.floor(S.time/1440))}

배경에 있는 사람: ${bg.join(", ")||"없음"}

${session.mission ? missionBlock(session)+"\n\n" : ""}${session.date ? dateBlock(session)+"\n\n" : ""}<manuscript>

</manuscript>

<variation_dials>
이번 턴의 변주. 이야기 논리와 인물성이 우선이며, 다이얼은 양념처럼 자연스럽게 쓰고 언급하지 않는다.
${pickDials()}

${styleAvoid(session.participants)}

}

// ---- Scene generation (streaming) ----
async function generateScene(session, latest, onText, signal){
  if (!llmReady("chat")) throw {code:"no_connection"};
  const prompt = buildScenePrompt(session, latest);
  return await llmGenerate("chat", prompt, {onText, signal});
}

// ---- After each exchange: per-character POV memories, relationship deltas, mood, plans, style ----
function afterTurnPrompt(session, ex){
  const pm = ex.playerMsgId ? findMsg(ex.playerMsgId)?.m : null;
  const am = findMsg(ex.aiMsgId)?.m;
  const present = am?.present || session.participants;
  const placeList = Object.entries(PLACES).filter(([k,v])=>!v.street).map(([k,v])=>`${k}=${v.name}`).join(", ");
  const roster = present.map(id=>{ const c=charById(id), r=rel(id); return `- ${id}: ${cname(c)} | ${S.persona.name}의 이름을 ${r.knowsName?"앎":"모름"} | ${S.persona.name}에게 자기 이름을 ${r.introduced?"이미 밝힘":"아직 안 밝힘"} | 관계 수치: ${axesLine(id)}\n  최근 기억: ${activeMems(id,0).slice(-3).map(m=>m.text).join(" / ")||"없음"}`; }).join("\n");
  return `너는 생활 시뮬레이션 게임 'MTUT'의 기억과 관계를 기록하는 담당이다. 방금 오간 장면 조각을 읽고 JSON 하나만 출력한다.

[플레이어] ${S.persona.name}
[장소·시각] ${PLACES[session.place].name}, ${gameDateLabel(S.time)} ${fmtHM(S.time%1440)}
[이 장면에 있던 인물]
${roster}

[장면 조각]
${pm?`<player_input>\n${pm.text}\n</player_input>\n`:"<player_input>(입력 없이 이어짐)</player_input>\n"}<scene>
${am?.text||""}
</scene>

[작성 규칙]
1. memories: 위 인물 각각에 대해, 이 장면 조각에서 그 인물이 겪은 일을 1~3문장으로.
${POV_RULES("그 인물", true).replace("- 그 인물은 "+S.persona.name+"의 이름을 안다.","- 인물마다 위 표의 '이름을 앎/모름'을 따른다. 모르면 이름 대신 그 인물이 보기에 자연스러운 호칭을 쓴다.")}
- player_input에서 소리 내어 한 말과 보이는 행동만 인물이 지각할 수 있다. 속마음이나 괄호 속 지시는 인물이 모른다.
2. deltas: 각 인물의 ${S.persona.name}에 대한 관계 변화. 각 축 -3~+3 정수. 이 장면에 실제 근거가 있는 것만. 대부분의 장면은 0이나 ±1이다. 칭찬이나 선물 하나로 크게 오르지 않는다. 축: trust(신뢰), intimacy(친밀), tension(긴장), reliance(의지), curiosity(호기심), attraction(끌림).
3. mood: 인물마다 장면 끝의 기분을 짧은 한 구절로.
4. leaving: 이 장면 조각에서 자리를 떠나 퇴장한 인물 id 배열.
5. introduced: 이 장면에서 ${S.persona.name}에게 자기 이름을 처음 밝힌 인물 id 배열.
6. learned_user_name: 이 장면에서 ${S.persona.name}의 이름을 처음 알게 된 인물 id 배열.
7. plans: 장면에서 언제, 어디서가 구체적으로 정해진 약속이나 계획. place는 다음 중 하나: ${placeList}. day는 오늘 0, 내일 1, 모레 2. start는 "HH:MM", minutes는 30~240. 막연한 약속은 넣지 않는다. 없으면 [].
8. style: scene의 시작 방식(짧게), 끝맺는 방식(짧게), 다음에 또 쓰면 반복으로 느껴질 표현 최대 4개.

  catch(e){ ex.status="failed"; ex.error=e?.code; toast("이 장면의 기억 정리에 실패했어요. 인물 화면에서 재생성할 수 있어요."); 
    // still create placeholder memories so user can regenerate
    const am=findMsg(ex.aiMsgId)?.m; for (const id of (am?.present||session.participants)){ const mm=addMem(id,{level:0,text:"(정리 실패: 재생성을 눌러주세요)",msgIds:[ex.playerMsgId,ex.aiMsgId].filter(Boolean),sessionId:session.id,exId:ex.id,stale:true}); ex.memIds.push([id,mm.id]); } return; }
  const am = findMsg(ex.aiMsgId)?.m; const present = am?.present || session.participants;
  const exCount = session.messages.filter(m=>m.role==="ai").length;
  for (const id of present){
    const text = String(data?.memories?.[id]||"").trim();
    if (text){ const mm=addMem(id,{level:0,text,msgIds:[ex.playerMsgId,ex.aiMsgId].filter(Boolean),sessionId:session.id,exId:ex.id}); ex.memIds.push([id,mm.id]); }
    ex.deltas[id] = applyDeltas(id, data?.deltas?.[id], ex, exCount, session.date?16:8);
    if (data?.mood?.[id]) rel(id).mood = String(data.mood[id]).slice(0,60);
  }
  for (const id of (data?.introduced||[])) if (present.includes(id) && !rel(id).introduced){ rel(id).introduced=true; ex.introduced.push(id); toast(`이제 ${cname(charById(id))}의 이름을 알아요.`); }
  for (const id of (data?.learned_user_name||[])) if (present.includes(id) && !rel(id).knowsName){ rel(id).knowsName=true; ex.learned.push(id); }
  for (const p of (data?.plans||[])){
    if (!charById(p.char) || !PLACES[p.place] || !/^\d{1,2}:\d{2}$/.test(String(p.start||""))) continue;
    const day = Math.floor(S.time/1440) + clamp(Number(p.day)||0,0,6); const start=hm(p.start); const dur=clamp(Number(p.minutes)||60,20,300);
    const plan={id:uid("p"), charId:p.char, day, start, end:Math.min(start+dur,1439), place:p.place, act:String(p.activity||"약속").slice(0,60), exId:ex.id};
    if (day*1440+plan.end < S.time) continue;
    S.plans.push(plan); ex.plans.push(plan.id);
    toast(`약속: ${cname(charById(p.char))}, ${day===Math.floor(S.time/1440)?"오늘":day-Math.floor(S.time/1440)===1?"내일":"모레"} ${p.start} ${PLACES[p.place].name}`);
  }
  if (data?.style){ for (const id of present){ (S.style[id] ||= []).push({opening:String(data.style.opening||"").slice(0,80), ending:String(data.style.ending||"").slice(0,80), phrases:(data.style.phrases||[]).slice(0,4).map(x=>String(x).slice(0,40))}); S.style[id]=S.style[id].slice(-8); } }
  for (const id of (data?.leaving||[])) if (session.participants.includes(id)) ex.leaving.push(id);
  ex.status="done";
  for (const id of present) Jobs.add("compress", ()=>compressIfNeeded(id));
  if (ex.leaving.length) onParticipantsLeft(session, ex.leaving, ex.id);
  refreshOpenPanels();
}
function revertExchange(ex){
  for (const [id,mid] of ex.memIds){ const list=mems(id); const i=list.findIndex(m=>m.id===mid); if (i<0) continue; const m=list[i]; if (m.archived){ const parent=list.find(p=>p.children.includes(m.id)); if(parent) parent.stale=true; } list.splice(i,1); }
  for (const [id,applied] of Object.entries(ex.deltas)) revertDeltas(id, applied);
  for (const id of ex.introduced) rel(id).introduced=false;
  for (const id of ex.learned) rel(id).knowsName=false;
  S.plans = S.plans.filter(p=>!ex.plans.includes(p.id));
  ex.memIds=[]; ex.deltas={}; ex.introduced=[]; ex.learned=[]; ex.plans=[]; ex.leaving=[];
}

// ---- Compression ----
async function compressIfNeeded(id){
  const st=S.settings;
  const l0=activeMems(id,0).filter(m=>!m.pinned);
  if (l0.length > st.l0Max){ await compress(id, l0.slice(0, st.l0Batch), 1); }
  const l1=activeMems(id,1).filter(m=>!m.pinned);
  if (l1.length > st.l1Max){ await compress(id, l1.slice(0, st.l1Batch), 2); }
  const l2=activeMems(id,2).filter(m=>!m.pinned);
  if (l2.length > st.l2Max){ await compress(id, l2.slice(0, 2), 2); }
}
function compressPrompt(id, items, level){
  const name=cname(charById(id)); const r=rel(id);
  const len = level===1 ? "3~6문장" : "4~8문장";
  return `아래는 ${name}의 기억 조각들이다(시간순). 이것을 하나의 ${LEVEL_NAME[level]}으로 압축한다.
- 중요한 것만 남긴다: 관계가 움직인 순간, 약속과 그 이행 여부, 새로 알게 된 사실과 비밀의 조각, 풀리지 않은 질문, ${name}의 감정이 크게 흔들린 지점.
- 사소한 인사와 반복된 잡담은 버린다. 같은 종류의 일이 반복됐다면 "여러 번"처럼 묶는다.
${POV_RULES(name, r.knowsName)}
- 언제쯤, 어디서였는지 대략의 표지를 남긴다(예: "11월 10일 오후 카페에서").
- 길이: ${len}. 압축된 기억 본문만 출력한다.

[기억 조각]
${items.map(m=>`- (${shortStamp(m.time)}) ${m.text}`).join("\n")}`;
}
async function compress(id, items, level){
  if (!llmReady("mem") || items.length<2) return;
  try{
    const res = await llmGenerate("mem", compressPrompt(id, items, level), {tier:"default"});
    const text = res.text.trim();
    addMem(id, {level, text, time:items[items.length-1].time, children:items.map(m=>m.id), sessionId:null});
    for (const m of items) m.archived=true;
  }catch(e){ console.warn("compress failed", e); }
  refreshOpenPanels();
}

// ---- Regeneration ----
function regenPromptFromRaw(id, mem, rawText){
  const name=cname(charById(id)); const r=rel(id);
  const len = mem.level===0 ? "1~3문장" : mem.level===1 ? "3~6문장" : "4~8문장";
  return `너는 게임 'MTUT'의 기억 기록 담당이다. 아래 대화 원문은 ${iGa(name)} 함께 있었던 장면들이다. 이것을 ${name}의 ${LEVEL_NAME[mem.level]} 하나로 쓴다.
${POV_RULES(name, r.knowsName)}
- 원문 중 '${S.persona.name}' 줄은 플레이어의 입력이다. 소리 내어 한 말과 보이는 행동만 ${iGa(name)} 지각할 수 있다.
${mem.level>0?`- 중요한 것만 남기고 사소한 것은 버린다. 언제쯤, 어디서였는지 대략의 표지를 남긴다.\n`:""}- 길이: ${len}. 기억 본문만 출력한다.

[대화 원문]
${rawText}`;
}
async function regenerateMemory(id, memId){
  const mem=findMem(id,memId); if(!mem) return false; if (!llmReady("mem")){ toast(aiErrorText({code:"no_connection"})); return false; }
  let prompt;
  const leaves=[...leafMsgIds(id, mem)];
  const raw = formatMsgsForPOV(leaves);
  if (raw && raw.length < 60000) prompt = regenPromptFromRaw(id, mem, raw);
  else if (mem.level>0){ const kids=mem.children.map(c=>findMem(id,c)).filter(Boolean); prompt = compressPrompt(id, kids, mem.level); }
  else { toast("이 기억의 원문 대화가 남아 있지 않아요."); return false; }
  try{
    const res = await llmGenerate("mem", prompt, {tier: mem.level===0?(S.settings.memTier||"quick"):"default"});
    mem.text=res.text.trim(); mem.stale=false; mem.edited=false; mem.regenAt=S.time; scheduleSave(); return true;
  }catch(e){ toast(aiErrorText(e)); return false; }
}

// ---- End of a conversation: update each participant's view of the relationship ----
async function runEndSession(session){
  if (!llmReady("mem")) return;
  const ids = session.all.filter(id=>session.messages.some(m=>m.role==="ai" && (m.present||[]).includes(id)));
  if (!ids.length) return;
  const blocks = ids.map(id=>{ const c=charById(id), r=rel(id); const newMems=activeMems(id).filter(m=>m.sessionId===session.id).map(m=>"- "+m.text).join("\n") || mems(id).filter(m=>m.sessionId===session.id).map(m=>"- "+m.text).join("\n");
    return `<char id="${id}" name="${cname(c)}">
성격 요약: ${c.card.data.personality.split("\n").slice(0,3).join(" ")}
이전 관계 서술: ${r.narrative||"(없음: 이번이 첫 서술)"}
현재 수치: ${axesLine(id)}
${S.persona.name}의 이름을 ${r.knowsName?"앎":"모름"}
이번 만남의 기억:
${newMems||"(없음)"}
</char>`; }).join("\n");
  const prompt = `게임 'MTUT'의 관계 서술을 갱신한다. 각 인물이 ${wa(S.persona.name)}의 관계를 지금 어떻게 겪고 있는지, 그 인물의 시선에서 2~4문장으로 쓴다.
- 친구, 연인, 동료 같은 한 단어 라벨로 규정하지 않는다. 무엇이 쌓였는지, 무엇이 걸려 있는지, 무엇이 아직 모호한지를 쓴다.
- 이전 서술에서 이어지되 이번 만남이 바꾼 것을 반영한다. 한 번의 만남으로 관계가 급변하지 않는다.
- 그 인물이 알 수 없는 것(${S.persona.name}의 속마음 등)은 쓰지 않는다. 인물의 오해나 틀린 짐작은 그대로 둔다.
- 인물이 ${S.persona.name}의 이름을 모르면 이름 대신 호칭을 쓴다.

${blocks}

출력 형식(이 JSON만): {"인물id":"서술", ...}`;
  try{
    const data = await llmJSON("mem", prompt, {tier:"default", maxTokens:2000});
    for (const id of ids) if (data?.[id]) rel(id).narrative = String(data[id]).trim();
  }catch(e){ console.warn("end session failed", e); }
  refreshOpenPanels();
}

function closeAllModals(){ while (modalStack.length) modalStack[modalStack.length-1].close(); }
async function resetPlay(){
  await addSlot("초기화 직전 자동 백업", true);
  Chat.abandon(); closeAllModals();

  fresh.chars = JSON.parse(JSON.stringify(S.chars)); fresh.settings = JSON.parse(JSON.stringify(S.settings)); fresh.preset = JSON.parse(JSON.stringify(S.preset));
  startGame(fresh, true); await saveNow();

}
async function factoryReset({gfx, conn}){
  if (S && RT.started) await addSlot("완전 초기화 직전 자동 백업", true);
  Chat.abandon(); closeAllModals();
  await Store.del("save");
  GFX.active = {}; GFX.smooth=false; if (gfx){ GFX.packs = []; await Store.del("lookPresets"); } await saveGfx(); await rebuildGfx();
  if (conn){ CONN.profiles=[]; CONN.chatProfile=null; CONN.memProfile="same"; for (const k of Object.keys(SECRETS)) delete SECRETS[k]; for (const k of Object.keys(TOKENS)) delete TOKENS[k]; await Store.del("connections"); await Store.del("secrets"); await loadConnections(); }
  RT.started=false; $("#hud").classList.add("hidden"); $("#menu").classList.add("hidden");
  S = newState({name:"", desc:"", sprite:blankSprite()}, "rookie", SAMPLE_WORLD); applyPlaceNames({}); S.player={map:"core",x:22.5,y:16.5,dir:0}; RT.decisions={}; RT.npcs={}; snapAllNPCs(); applyTheme();
  (function idle(now){ if(RT.started) return; render(now); requestAnimationFrame(idle); })(performance.now());
  newGameScreen();
}
async function downloadStandalone(){
  let html = ORIGINAL_HTML;
  try{
    const doc = new DOMParser().parseFromString(html, "text/html");
    doc.querySelectorAll("script[src]").forEach(s=>{ if (!/^https:\/\/cdnjs\.cloudflare\.com\//.test(s.src)) s.remove(); });
    html = "<!doctype html>\n" + doc.documentElement.outerHTML;
  }catch(e){}
  if (await saveFile("mtut.html", html, "text/html")) toast("단독 실행판을 내려받았어요. 파일을 더블클릭해서 브라우저로 열어주세요.");
}

function addCharacter(ch){ S.chars.push(ch); rel(ch.id); if (S.role==="kyle"){ const r=rel(ch.id); r.introduced=true; r.knowsName=true; r.met=true; } initNPC(charById(ch.id)); scheduleSave(); }
function removeCharacter(id){
  S.chars=S.chars.filter(c=>c.id!==id); delete RT.npcs[id]; delete S.rel[id]; delete S.memories[id]; delete S.style[id];
  S.plans=S.plans.filter(p=>p.charId!==id); for (const c of S.chars){ const g=G(c); if (g.relations) delete g.relations[id]; if (g.leash===id) delete g.leash; }
