async function endFieldMission(how){
  const F=S.field; if (!F || F.ending || F.kind!=="mission") return; F.ending=true;
  const s=fieldSession(), g=F.goal||{};
  if (Chat.session) Chat.suspend();
  if (g.type==="구출"||g.type==="호위"){ const a=F.npcs.find(x=>x.id===g.npc); g.done = !!(a && a.follow && !a.gone) && how==="extract"; }
  let result;
  if (how==="abort" && S.time-F.start<25 && !F.clues.length && !g.done) result="abort";
  else if (how==="defeat") result = g.done ? "partial" : "fail";
  else if (how==="timeout") result = g.done && !["구출","호위"].includes(g.type) ? "partial" : "fail";
  else if (g.done) result = ((g.type==="잠입" && F.alarm) || F.defeats>0 || how==="abort") ? "partial" : "success";
  else result = (F.clues.length>=2 || F.foes.some(x=>x.down && !x.temp)) ? "partial" : "fail";
  const wait=openModal("귀환 중", (box)=>{ box.append(h("div",{class:"content"}, h("p",{class:"thinking"},"임무 결과를 정리하는 중이에요…"))); }, {closable:false});
  let sm; try{ sm = await fieldSummary(s||{all:F.team, messages:[]}, F, result); } finally { wait.close(); }
  const out = s ? applyMissionResult(s, {result, summary:sm.summary, mvp:sm.mvp}) : null;
  if ((F.items["현금 봉투"]||0)>0 && result!=="abort") S.stats.merit += 3*F.items["현금 봉투"];
  if (s){ s.mission.done=true; s.ended=true; s.end=S.time;
    for (const id of s.all){ if (!charById(id)) continue; addMem(id,{level:0, text:`(임무) ${F.title} · ${RESULT_NAME[result]}: ${sm.summary}`, sessionId:s.id}); rel(id).talks=(rel(id).talks||0)+1; }
    if (s.messages.some(m=>m.role==="ai")) Jobs.add("endSession", ()=>runEndSession(s)); }
  const diff=F.diff; leaveField(); S.time += 60 + 30*diff; RT.decisions={}; snapAllNPCs(); scheduleSave();
  if (out) showMissionResult(out);

const TIER = [

];
const TIER_FRENZY  = {k:"frenzy",  name:"광분", col:"#ff1f3d", g:"감정이 무너져 이성을 잃었다. 마주치면 덤벼든다. 말이 거의 통하지 않는다."};
const TIER_DEVOTED = {k:"devoted", name:"맹목", col:"#862e9c", g:"무슨 일이 있어도 해치지 않는다. 공격을 받아도 막기만 한다. 모든 것을 걸고 따른다."};
const TIER_ORDER = ["frenzy", ...TIER.map(t=>t.k), "devoted"];
function tierOfVal(v){ v=Math.round(Number(v)||0); for (const t of TIER) if (v<=t.max) return t; return TIER[TIER.length-1]; }
function tierOf(R){ return !R ? TIER[6] : R.bond==="frenzy" ? TIER_FRENZY : R.bond==="devoted" ? TIER_DEVOTED : tierOfVal(R.aff); }
function tierMin(t){ const i=TIER.indexOf(t); return i<=0 ? -100 : TIER[i-1].max+1; }
function peakOf(R){ return R.peak==null ? (R.aff||0) : R.peak; }

// a save from before 0.10: the number is read off the six old relationship bars
function seedAff(ax){ ax=ax||{}; const v=0.35*(ax.trust||0)+0.30*(ax.intimacy||0)+0.20*(ax.attraction||0)+0.15*(ax.reliance||0)-0.35*(ax.tension||0); return clamp(Math.round(v),-100,100); }
function bond(id){ const r=rel(id); if (r.aff==null){ r.aff=seedAff(r.axes); r.peak=r.aff; } if (r.bond===undefined) r.bond=null; if (r.omen===undefined) r.omen=null; return r; }

// d>0 has a daily allowance (bonds grow over days); free=true for big events and for losses
function addAff(R, d, cap=10, free=false){
  d=Number(d)||0; if (!d) return 0; const day=Math.floor(S.time/1440);
  if (!R.affDay || R.affDay.day!==day) R.affDay={day, up:0};
  if (d>0 && !free){ const room=Math.max(0, cap-R.affDay.up); const eff=Math.min(d, room) + Math.max(0, d-room)*0.25; R.affDay.up+=d; d=eff;
    if ((R.aff||0)>60) d*=Math.max(0.3, 1-((R.aff||0)-60)/80); }
  const before=R.aff||0; R.aff=Math.round(clamp(before+d,-100,100)*10)/10; R.peak=Math.max(peakOf({aff:before, peak:R.peak}), R.aff);
  return R.aff-before;
}

const ATT_AFF = {"반갑게 맞는다":14,"먼저 다가온다":10,"매달린다":12,"호기심을 보인다":8,"말을 건다":6,"두려워하면서도 기대한다":6,"덤덤하다":0,"흥정하려 든다":0,"말을 아낀다":-2,

function riotBattle(id, team, mode, o={}){

// a confined person stays in the cells (outer.cells); meals come to them, the room has the basics

    releaseFac(n); const t=slot;

  const mm=S.time%1440, night=mm<360||mm>=1380, c=charById(n.id), nd=needsOf(n.id);
  n.task=null; n.stage="do"; n.frame=0; n.sleeping=night; n.act=night?"독방에서 잠든 중":"격리 시설 독방에 갇혀 있는 중";

출력 형식(이 JSON만): {"prefs":{"인물id":{"물건이름":{"p":"neutral","why":"..."}}}}`;
    try{ const d=await llmJSON("mem", prompt, {tier:"default", maxTokens:900}); const P=d?.prefs||{};

function rollN(n){ return 1+Math.floor(Math.random()*n); }
function diceWhat(){
  const bag=bagItems(); if (!bag.length) return {items:[], text:"가방이 비어 있어요."};
  const kinds=rollN(Math.min(3,bag.length)); const pool=bag.slice(); const items=[], rolls=[];
  for (let i=0;i<kinds;i++){ const r=rollN(pool.length); const [it,v]=pool.splice(r-1,1)[0]; const q=rollN(Math.min(3,v)); items.push({item:it, n:q}); rolls.push(`${it} 🎲${r} · 개수 🎲${q}`); }
  return {items, text:`🎲 종류 ${kinds}가지 → ${rolls.join(" / ")}`};
}
function diceWho(items, people){
  const gives=[], rolls=[];
  for (const {item,n} of items){ const per={}; for (let k=0;k<n;k++){ const r=rollN(people.length); per[people[r-1]]=(per[people[r-1]]||0)+1; rolls.push(`${item} 🎲${r}→${shownName(people[r-1])}`); }
    for (const [to,q] of Object.entries(per)) gives.push({item, to, n:q}); }
  return {gives, text:rolls.join(" · ")};
}
function diceHow(){ const r=rollN(GIVE_MANNERS.length); return {how:GIVE_MANNERS[r-1], text:`🎲 ${r} → ${GIVE_MANNERS[r-1]}`}; }
function cleanItems(list){ const out=[], bag=invOf("me"), used={};
  for (const x of (Array.isArray(list)?list:[])){ const it=String(x?.item||"").trim(), n=Math.floor(Number(x?.n)||0); if (!it || n<=0 || !bag[it]) continue; const k=Math.min(n, bag[it]-(used[it]||0)); if (k<=0) continue; used[it]=(used[it]||0)+k; const o=out.find(y=>y.item===it); if (o) o.n+=k; else out.push({item:it, n:k}); }
  return out; }
function cleanGives(list, items, people){ const left={}; for (const x of items) left[x.item]=x.n; const out=[];
  for (const g of (Array.isArray(list)?list:[])){ const it=String(g?.item||""), to=String(g?.to||""), n=Math.floor(Number(g?.n)||0); if (!left[it] || !people.includes(to) || n<=0) continue; const k=Math.min(n,left[it]); left[it]-=k; const o=out.find(y=>y.item===it && y.to===to); if (o) o.n+=k; else out.push({item:it, to, n:k}); }
  return out; }

function giftCard(g){ return h("div",{class:"giftcard"}, g.gives.map(x=>h("div",{}, `${x.ok?"✓":"✗"} ${shownName(x.to)} · ${x.item} ${cnt(x.n)} ${x.ok?(x.pref==="like"?"(좋아함)":"(받음)"):"(거절, 돌려받음)"}`))); }
// move the things now; a refused thing stays in the bag
function applyGift(g){
  g.ops=[]; g.aff={};
  for (const x of g.gives){
    x.ok = x.pref!=="dislike";
    if (x.ok){ const k=invTake("me", x.item, x.n); x.n=k||x.n; if (k){ invAdd(x.to, x.item, k); g.ops.push({to:x.to, item:x.item, n:k}); if (charById(x.to)){ const gf=giftedOf(x.to); gf[x.item]=(gf[x.item]||0)+k; } } else x.ok=false; }

    const before=tierOf(R), d = !x.ok ? addAff(R,-3,0,true) : x.pref==="like" ? addAff(R,5,14) : addAff(R,2,14);

function revertGift(g){

  g.applied=false; scheduleSave();
}

function hashPick(s, arr){ let x=0; for (const ch of String(s)) x=(x*31+ch.charCodeAt(0))>>>0; return arr[x%arr.length]; }

// one monster's numbers (also used by the balance check)
function monStats(sp, g, o={}){
  const S0=SPECIES[sp], R=MROLE[o.big?"big":S0.role], hpM=Math.pow(1.45,g), atkM=Math.pow(1.3,g);
  let elem=S0.elem==="random" ? (o.elem || pick(ELEM_KEYS)) : S0.elem;
  const skills=S0.skills.slice(0, Math.min(S0.skills.length, 1+Math.floor(g/2)));
  if (g>=3 && !skills.includes("enrage")) skills.push("enrage");
  if (g>=4 && !skills.includes("multislam")) skills.push("multislam");
  if (g>=5 && !skills.includes("shield")) skills.push("shield");
  const st={hp:Math.round(R.hp*hpM*(o.hpMul||1)), atk:R.atk*atkM, def:R.def+3*g, spd:R.spd*(1+0.03*g), range:R.range, cd:R.cd, r:Math.min(0.95, R.r*(1+0.07*g)), elem, skills, gear:[]};
  // monsters wear gear too: a weapon and/or armor of a grade that fits theirs
  const gr=clamp(Math.floor(g*0.62),0,6), chance=Math.min(0.85, 0.2+0.08*g);
  if (Math.random()<chance){ st.gear.push({slot:"weapon", grade:gr}); st.atk+=G_ATK[gr]*0.45; }
  if (Math.random()<chance){ st.gear.push({slot:"armor", grade:gr}); st.hp+=Math.round(G_HP[gr]*0.6); st.def+=G_DEF[gr]; }
  return st;
}

// the usual groups when a battle does not bring its own
function monsterGroup(diff, opts={}){
  const pickSp=()=>pick(CREATURES), out=[];
  if (opts.boss){ out.push({mon:{sp:pick(["squid","turtle","crab","lizard"]), g:rollGrade(diff,1), big:true}, n:1, name:null});
    for (let i=0;i<diff+Math.floor((opts.team||[]).length/2);i++) out.push({mon:{sp:pickSp(), g:rollGrade(diff)}, n:1}); return out; }
  const n=[3,5,5][clamp(diff,1,3)-1]+(opts.team||[]).length+(Math.random()<0.5?1:0);   // more of them when you bring friends
  for (let i=0;i<n;i++) out.push({mon:{sp:pickSp(), g:rollGrade(diff)}, n:1});

}
// a mission map's foe group becomes real monsters (people keep their look)
function fieldFoesToMon(g, F){
  const human=!!g.spr, out=[];

    const big=u.type==="boss", sp = human ? (u.type==="shooter" ? "gunner" : big ? "esper" : (/이능/.test(u.name||"")?"esper":"thug")) : (big ? hashPick(u.name||g.label, ["squid","turtle","crab","lizard","wolf"]) : hashPick(u.name||g.label, CREATURES));

function makeGear(slot, grade, elem, o={}){
  grade=clamp(grade,0,6); elem=elem||"none"; const v=()=>0.88+Math.random()*0.24, base=o.base||pick(GEAR_BASE[slot]);

  else if (slot==="armor"){ g.hp=Math.round(G_HP[grade]*v()); g.def=Math.round(G_DEF[grade]*v()); }
  else { g.crit=Math.round(G_CRIT[grade]*v()*100)/100; g.atk=Math.round(G_ATK[grade]*0.3*v()); g.hp=Math.round(G_HP[grade]*0.25*v()); }
  gearList().push(g); return g;
}
function gearText(g){ const p=[]; if (g.atk) p.push(`공격 +${g.atk}`); if (g.hp) p.push(`체력 +${g.hp}`); if (g.def) p.push(`방어 +${g.def}`); if (g.crit) p.push(`치명 +${Math.round(g.crit*100)}%`); if (g.elem && g.elem!=="none") p.push(`${ELEM[g.elem].n} 속성`); return p.join(" · "); }

function gearBonus(owner){

}

function matsOfTier(t){ return bagItems().filter(([k])=>itemDef(k).kind==="material" && itemDef(k).tier===t); }
function openCraft(){
  let slot="weapon", tier=0, last=null;
  openModal("장비 제작", (box, api)=>{
    const c=h("div",{class:"content"});
    c.append(h("p",{class:"hint"}, "몬스터에게서 얻거나 주워 모은 재료로 장비를 만들어요. 재료의 등급이 높을수록 좋은 장비가 나와요. 주사위가 높으면 한두 등급 위로 나와요."));
    c.append(h("div",{class:"gmodes",style:"margin:6px 0"}, ["weapon","armor","trinket"].map(s=>h("button",{class:"chip"+(slot===s?" on":""),onclick:()=>{ slot=s; api.rebuild(); }}, SLOT_NAME[s]))));
    const tiers=h("div",{class:"gmodes",style:"flex-wrap:wrap;margin:6px 0"});
    for (let t=0;t<7;t++){ const have=matsOfTier(t).reduce((a,[,v])=>a+v,0); tiers.append(h("button",{class:"chip"+(tier===t?" on":""),onclick:()=>{ tier=t; api.rebuild(); }}, `${MAT_TIER[t]} (${have})`)); }
    c.append(tiers);
    const need=CRAFT_NEED[slot], have=matsOfTier(tier), total=have.reduce((a,[,v])=>a+v,0), cost=G_CRAFT[tier];
    c.append(h("div",{class:"banner"}, `${SLOT_NAME[slot]} 만들기: '${MAT_TIER[tier]}' 재료 ${need}개 + ${cost} 노트 → ${EGRADE[tier]} 이상`, h("div",{class:"hint"}, `가진 재료 ${total}개 · 가진 돈 ${money()} 노트`)));
    if (have.length) c.append(h("div",{class:"hint"}, have.map(([k,v])=>`${k} ${v}`).join(" · ")));
    if (last) c.append(h("div",{class:"mem",style:"margin-top:8px"}, h("div",{class:"meta"}, last.dice), h("div",{}, gradeChip(last.g.grade), " ", last.g.name), h("div",{class:"hint"}, gearText(last.g))));
    const ok = total>=need && money()>=cost;
    c.append(h("div",{style:"display:flex;justify-content:flex-end;gap:8px;margin-top:10px"}, h("button",{class:"btn",onclick:()=>api.close()},"닫기"),
      h("button",{class:"btn primary",disabled:!ok||null,onclick:()=>{ const r=craftGear(slot, tier); if (r){ last=r; api.rebuild(); } }}, "만들기")));
    box.append(c);
  });

function craftGear(slot, tier){
  const need=CRAFT_NEED[slot], cost=G_CRAFT[tier]; let have=matsOfTier(tier).sort((a,b)=>b[1]-a[1]);
  if (have.reduce((a,[,v])=>a+v,0)<need || money()<cost) return null;
  const used={}; let left=need;
  for (const [k,v] of have){ const t=Math.min(v,left); if (t>0){ invTake("me",k,t); used[k]=t; left-=t; } if (!left) break; }
  addMoney(-cost);
  const votes={}; for (const [k,n] of Object.entries(used)){ const el=itemDef(k).elem||"none"; if (el!=="none") votes[el]=(votes[el]||0)+n; }
  const elem=Object.entries(votes).sort((a,b)=>b[1]-a[1])[0]?.[0]||"none";
  const d=d20(), up=d>=19?2:d>=14?1:0, g=makeGear(slot, Math.min(6,tier+up), elem, {by:"craft"});
  scheduleSave();
  return {g, dice:`🎲 ${d} → ${up===2?"두 등급 위!":up===1?"한 등급 위!":"그대로"} (14 이상 한 등급, 19 이상 두 등급)`};
}

// ---------- battle: hits, statuses, monster skills, telegraphs ----------
bHit = function(B, src, tg, dmg, o={}){
  if (!tg || tg.hp<=0 || tg.st.invul>0) return 0;
  let d=dmg*(0.85+Math.random()*0.3);
  if (src){ if (src.st.buff>0) d*=1.5; if (src.mode==="sword") d*=2; }
  const el=o.elem || (src && src.elem) || "none", em=elemMult(el, tg.elem||"none"); d*=em;
  if (tg.side==="foe" && tg.noAttack) d*=0.5;
  if (tg.side==="ally"){ if (B.shield>0) d*=0.4; if (tg.mode==="shield") d*=0.35; else if (B.units.some(a=>a.mode==="shield" && a.hp>0 && bdist(a,tg)<2.3)) d*=0.6; }
  d*=60/(60+(tg.def||0)*(tg.st.harden>0?1.8:1));
  if (tg.res && el===tg.res) d*=0.75;
  let crit=false; if (src && src.crit && !o.noCrit && Math.random()<src.crit){ d*=1.6; crit=true; }
  if (tg.shieldHp>0){ const a=Math.min(tg.shieldHp, d); tg.shieldHp-=a; d-=a; if (d<=0.5){ B.txt.push({x:tg.x, y:tg.y-0.9, t:0.5, s:"막음", col:"#9fd3ff"}); return 0; } }
  d=Math.max(1,Math.round(d)); tg.hp-=d;
  B.txt.push({x:tg.x+(Math.random()-0.5)*0.3, y:tg.y-0.9, t:0.7, s:String(d)+(crit?"!":"")+(em>1?" 약점":""), col: tg.side==="ally" ? "#ff8d86" : crit ? "#ffd23f" : em>1 ? "#9cff9c" : "#ffe9a8"});
  if (src && src.drain && src.hp>0) src.hp=Math.min(src.maxhp, src.hp+d*src.drain);
  if (tg.hp<=0){ tg.hp=0; if (tg.kind==="ally"){ B.fallen.push(tg.id); if (tg.fusedWith) B.fallen.push(tg.fusedWith); } }
  return d;
};
const _bMove0 = bMove;
bMove = function(B, u, vx, vy, dt){ if (u.st && u.st.root>0){ u.frame=0; return; } return _bMove0(B, u, vx, vy, dt); };
function tgCircle(B, u, x, y, r, delay, fn){ (B.tg ||= []).push({k:"c", x, y, r, t:delay, T:delay, src:u, fn}); }
function tgLine(B, u, x, y, x2, y2, w, delay, fn){ (B.tg ||= []).push({k:"l", x, y, x2, y2, w, t:delay, T:delay, src:u, fn}); }
function alliesIn(B, x, y, r){ return B.units.filter(a=>a.side==="ally" && a.hp>0 && Math.hypot(a.x-x,a.y-y)<=r+(a.r||0.3)); }
function alliesOnLine(B, x, y, x2, y2, w){ const dx=x2-x, dy=y2-y, L2=dx*dx+dy*dy||1;
  return B.units.filter(a=>{ if (a.side!=="ally" || a.hp<=0) return false; const t=clamp(((a.x-x)*dx+(a.y-y)*dy)/L2,0,1), px=x+dx*t, py=y+dy*t; return Math.hypot(a.x-px,a.y-py)<=w/2+(a.r||0.3); }); }
function monCast(B, u, k, tg){
  const say=(s)=>B.txt.push({x:u.x, y:u.y-1.6, t:1, s, col:"#ffb3a8"}); const atk=u.atk;
  if (k==="slam"){ const x=tg.x, y=tg.y; tgCircle(B,u,x,y,1.3,1.1,()=>{ for (const a of alliesIn(B,x,y,1.3)) bHit(B,u,a,atk*2.2); }); }
  else if (k==="multislam"){ const ts=B.units.filter(a=>a.side==="ally"&&a.hp>0); for (let i=0;i<3;i++){ const v=ts[Math.floor(Math.random()*ts.length)]||tg, x=v.x+(Math.random()-0.5)*1.6, y=v.y+(Math.random()-0.5)*1.6; tgCircle(B,u,x,y,1.2,1.2+i*0.25,()=>{ for (const a of alliesIn(B,x,y,1.2)) bHit(B,u,a,atk*2); }); } }
  else if (k==="leap"){ const x=tg.x, y=tg.y; tgCircle(B,u,x,y,0.9,0.65,()=>{ bJump(B,u,x,y); for (const a of alliesIn(B,x,y,0.9)) bHit(B,u,a,atk*1.8); }); }

function m2Block(session){

  const L=[`이 임무의 숨은 설계다. 게임 진행용이며 ${me}${josa(me,"은","는")} 아직 모른다. 지금 시각 ${fmtHM(m2Now())}.`,
    `- 배경: ${M.setting||"(없음)"}`, `- 이야기 줄기: ${M.storyline||"(없음)"}`, `- 이곳 사람들과 지금 하는 일(장면에 없는 사람은 말하지 않는다. 대화 속에서 언급될 수만 있다):\n${people.join("\n")||"- 없음"}`];
  if (M.stories.length) L.push(`- 숨은 이야기:\n${M.stories.map(s=>`  ${s.id} '${s.title}': ${s.truth} [${st[s.state]}]`).join("\n")}`);
  if (M.circ.length) L.push(`- 숨은 사정:\n${M.circ.map(x=>{ const a=F.npcs.find(n=>n.id===x.npc); return `  ${a?a.name:"?"}(${a?a.role:""}, id ${x.npc}): ${x.text} [${st[x.state]}]`; }).join("\n")}`);
  if (M.rewards.length) L.push(`- 숨은 보상:\n${M.rewards.map(r=>`  ${r.id} '${r.name}': 조건 — ${r.condition}${r.how==="talk"?` (주는 사람: ${F.npcs.find(a=>a.id===r.npc)?.name||"?"})`:" (숨겨진 곳에 있다. 말로 건네지 않는다)"} [${r.got?"얻음":"아직"}]`).join("\n")}`);
  L.push(`규칙:
- 숨은 것을 먼저 말하거나 설명하지 않는다. 인물의 말과 행동, 찾은 단서로 조금씩만 드러난다.
- ${me}${josa(me,"이","가")} 캐묻거나 조건을 채운 만큼만 드러낸다. 숨은 사정은 그 인물이 깊이 믿거나 증거를 들이밀 때만 털어놓는다.
- 숨은 인물은 찾기 전에는 장면에 나오지 않는다. 인물은 일정과 예외 조건대로 움직인다.${M.deadline?`\n- 시간 제한까지 ${m2TimeLeft(M)} 남았다.`:""}`);
  let t=`\n\n<mission_secrets>\n${L.join("\n")}\n</mission_secrets>`;
  const a = session.focus ? F.npcs.find(x=>x.id===session.focus && x.m2) : null;
  if (a) t+=`\n<field_person_plan>
${a.name}의 하루 일정: ${(a.m2.schedule||[]).map(e=>`${e.from}~${e.to} ${e.zone}: ${e.doing}`).join(" / ")}
일정에서 벗어나는 조건: ${(a.m2.exceptions||[]).join(" / ")||"없음"}
먹고 자고 씻는 곳: ${a.m2.needs||"정해지지 않음"}${a.m2.circ?`\n숨은 사정(스스로 털어놓지 않는다): ${a.m2.circ}`:""}

function applyM2After(session, ex, data){
  const F=S.field, M=F?.m2, d=data?.m2; if (!M || !d || typeof d!=="object" || F.sessionId!==session.id) return;

    snap.circ[id]=x.state; x.state=v; toast(`🔒 누군가의 숨은 사정을 ${v==="full"?"알아냈어요":"눈치챘어요"}.`); }
  for (const id of (Array.isArray(d.reward)?d.reward:[])){ const rw=M.rewards.find(r=>r.id===id && r.how==="talk" && !r.got); if (rw && m2Grant(rw)) snap.reward.push(rw.id); }

}
function m2Revert(ex){
  const sn=ex?.m2Snap, F=S.field, M=F?.m2; if (!sn || !M) return; ex.m2Snap=null;
  for (const id of sn.found){ const a=F.npcs.find(x=>x.id===id); if (!a || !a.m2) continue; a.m2.found=false; a.gone=true; const q=F.pois.find(x=>x.id===a.m2.spot); if (q) q.done=false; }
  for (const [id,v] of Object.entries(sn.story)){ const s=M.stories.find(x=>x.id===id); if (s) s.state=v; }
  for (const [id,v] of Object.entries(sn.circ)){ const x=M.circ.find(c=>c.npc===id); if (x) x.state=v; }
  for (const id of sn.reward) m2Ungrant(M.rewards.find(r=>r.id===id));

  fight:/전투|싸움|검술|총|무력|체술|근접|파괴|격투|살상|저격|폭발|힘/g, interro:/심문|위압|공포|협박|정신 조작|자백|고문|냉혹|압박|지배/g,
  bribe:/거래|돈|협상|말솜씨|사업|상인|설득|흥정|계산|능글/g, charm:/다정|매력|미소|친절|공감|호감|상냥|애교|부드러/g};

[인물]
${need.map(id=>`- ${id}: ${cname(charById(id))} — ${m2cut(charText(id),900)}`).join("\n")}

confinedHold = function(n, dt, dMin){
  const r=S.rel[n.id]; if (!r || !r.confined) return false; const cf=cellInit(r.confined);
  if (n.busy) return true;
  const P=PLACES["outer.cells"]; if (!P || !MAPS[P.map]) return false;
  const slot=cellSlot(n.id);
  if (n.map!==P.map || Math.floor(n.x)!==slot.x || Math.floor(n.y)!==slot.y || n.shadow || n.transit || n.follow){
    releaseFac(n);
    Object.assign(n,{map:P.map, x:slot.x+0.5, y:slot.y+0.5, path:null, pathGate:null, transit:null, sub:null, tgt:null, shadow:false, hidden:false, away:false, follow:false, inStall:false, form:null, outfit:"uniform"}); }
  const mm=S.time%1440, night=mm<360||mm>=1380, c=charById(n.id), nd=needsOf(n.id);
  n.task=null; n.stage="do"; n.frame=0; n.sleeping=night;

  if (night) addNeed(nd,"energy",0.21*dMin); else cf.stir=clamp((cf.stir||0)+dMin*0.05,0,100);

  const next=cellNextMeal(cf.mealAt); if (S.time>=next){ cf.mealAt=S.time; if (nd.hunger<68) nd.hunger=68; cf.eatUntil=S.time+20; cf.eatAct="독방에서 배식된 기본 식사를 먹는 중"; }
  if (nd.bladder<30) nd.bladder=100;
  if (nd.hygiene<22) nd.hygiene=22;
  if (nd.energy<10) nd.energy=40;
  if (nd.social<5) nd.social=5;
  // food they were given
  if (!night && nd.hunger<55){ const fi=ownFood(n.id); if (fi && invTake(n.id, fi, 1)){ addNeed(nd,"hunger", Math.max(20,(itemDef(fi).hunger||10)*1.5)); cf.eatUntil=S.time+15; cf.eatAct=`독방에서 받은 ${fi}${josa(fi,"을","를")} 먹는 중`; } }
  n.act = night ? "독방에서 잠든 중" : S.time<(cf.eatUntil||0) ? cf.eatAct : cf.stir>=70 ? "독방 안을 서성이는 중" : nd.social<25 ? "독방 창살 밖을 멍하니 보는 중" : "격리 시설 독방에 갇혀 있는 중";

    if (nd.hunger<42 && S.time<cellNextMeal(S.time)-60 && ok("meal")) cellAsk(n.id,"meal");
    else if (nd.hygiene<40 && ok("wash")) cellAsk(n.id,"wash");
    else if (nd.social<32 && ok("talk")) cellAsk(n.id,"talk");
    else if (cf.stir>=70 && ok("air")) cellAsk(n.id,"air");
    else if (S.time-(cf.reqAt.item||cf.since)>=1440 && ok("item") && Math.random()<0.5) cellAsk(n.id,"item"); }
  // left unanswered for half a day: it hurts
  for (const q of cf.reqs){ if (q.done || S.time-q.at<720 || q.hurt) continue; q.hurt=true; cf.mood=clamp((cf.mood??50)-8,0,100); addAff(r,-2,0,true); }
  return true;
};

const FN_DECAY = {hunger:0.08, energy:0.05, bladder:0.1};
const RE_EAT=/먹|끼니|식사|점심|저녁|아침|밥/, RE_SLEEP=/잠|자는|잔다|숙소|침대/, RE_FOODZ=/식당|주방|매점|카페|휴게|부엌|급식|식료|포장마차|노점|푸드|레스토랑|술집|바$/, RE_WC=/화장실|변소|욕실|샤워/, RE_BEDZ=/숙소|침실|쉼터|휴게|객실|방$/;
const FNRT = {t:0};
function fnNeeds(a){ if (!a.nd){ const r=seeded("fnd"+a.id+(S.field?.seed||"")); a.nd={hunger:45+r()*45, energy:55+r()*40, bladder:50+r()*45}; } return a.nd; }
function fnHome(a){ if (a.homeZ==null){ const z=fieldZoneAt(a.hx??a.x, a.hy??a.y); a.homeZ = z!=null ? z : (a.z ?? S.field.entry); } return a.homeZ; }
function fnZoneFor(a, kind){
  const F=S.field, sch=a.m2?.schedule||[], re = kind==="eat"?RE_EAT:kind==="sleep"?RE_SLEEP:null;
  if (re){ const e=sch.find(e=>re.test(e.doing||"")); if (e){ const zi=m2ZoneIndex(F, e.zone); if (zi!=null) return zi; } }

  let win=0;
  for (let it=0;it<iters;it++){ const d=shuffleR(rest, Math.random); let k=0; const bd=[...board]; while (bd.length<5) bd.push(d[k++]);

function pkAct(i, a){

  else if (a==="call"){ const c=P.cur-s.bet; if (c>0){ if (s.me ? money()<c : s.stack<c){ s.folded=true; s.act="포기"; } else { pkPut(i,c); s.act="콜"; } } else s.act="체크"; }
  else { const sz=pkSize(), c=P.cur+sz-s.bet; if (s.me ? money()<c : s.stack<c){ return pkAct(i,"call"); } pkPut(i,c); P.cur+=sz; P.raises++; P.acted=new Set(); s.act=P.raises===1&&P.cur===sz?"벳":"레이즈"; }

function pkAI(i){

async function judgeMission(s){
  const m=s.mission, turns=s.messages.filter(x=>x.role==="ai").length;
  if (turns<2) return {result:"abort", summary:"임무를 시작하자마자 돌아왔다."};
  if (!llmReady("mem")) return {result:"partial", summary:"(연결이 없어 결과를 판정하지 못했어요. 부분 성공으로 기록해요.)"};
  const log=s.messages.filter(x=>x.role!=="sys"||x.important).map(x=>`${x.role==="player"?S.persona.name:x.role==="sys"?"알림":"장면"}: ${x.text}`).join("\n\n").slice(-14000);
  const ids=s.all.map(id=>`${id}=${cname(charById(id))}`).join(", ");
  const prompt=`너는 게임 'MTUT'의 임무 결과 판정 담당이다. 아래 임무 기록을 읽고 JSON 하나만 출력한다.
[임무] ${m.title}: ${m.brief}
[동행] ${ids||"없음"}
[기록]
${log}
[판정 규칙]
- result: 임무 목표를 이뤘으면 "success", 일부만 이뤘거나 큰 대가를 치렀으면 "partial", 이루지 못했으면 "fail". 기록에 실제로 일어난 일만 근거로 삼는다. 결말이 나지 않은 채 돌아왔으면 "partial"이나 "fail"이다.
- summary: 임무 보고서처럼 2~3문장으로 무슨 일이 있었는지 쓴다.
- mvp: 가장 공이 큰 동행의 id. 동행이 없거나 가릴 수 없으면 "".
출력 형식(이 JSON만): {"result":"success","summary":"...","mvp":""}`;
  try{ const d=(await llmJSON("mem", prompt, {tier:"default", maxTokens:600})) || {}; if (!["success","partial","fail"].includes(d.result)) d.result="partial"; return d; }
  catch(e){ return {result:"partial", summary:"(결과 판정에 실패해서 부분 성공으로 기록해요.)"}; }
}
function applyMissionResult(s, res){
  const m=s.mission, st=S.stats, mult=RESULT_MULT[res.result] ?? 0.5, diff=m.diff||1;
  const xp=Math.round(60*diff*mult), merit=Math.round(10*diff*mult); let leveled=0;
  st.xp+=xp; while (st.xp>=xpNeed(st.level)){ st.xp-=xpNeed(st.level); st.level++; leveled++; }
  st.merit+=merit; if (res.result!=="abort") st.missions++;
  const notes = res.result==="abort" ? 0 : Math.round(NOTE_BASE*diff*mult); addMoney(notes);
  const team=[];
  for (const id of s.all){ if (!charById(id)) continue; const r=rel(id), g=Math.round(merit*(id===res.mvp?1.5:1)); r.merit=(r.merit||0)+g; team.push({id, merit:g, total:r.merit, mvp:id===res.mvp}); }
  const rec={title:m.title, brief:m.brief, diff, result:res.result, summary:String(res.summary||"").slice(0,400), day:Math.floor(S.time/1440), team:team.map(t=>t.id), xp, merit, notes};
  S.missions.unshift(rec); S.missions=S.missions.slice(0,30);
  return {...rec, leveled, teamDetail:team};
}

    if (u.boss){ u.tele-=dt; if (u.tele<=0){ u.tele=6; const v=en[Math.floor(Math.random()*en.length)]; B.fx.push({kind:"tele", x:v.x, y:v.y, r:1.9, t:1.3, dmg:u.atk*2.2}); } }
  }
  for (const f of B.fx){ f.t-=dt; if (f.kind==="tele" && f.t<=0){ for (const a of live("ally")) if (Math.hypot(a.x-f.x,a.y-f.y)<=f.r) bHit(B,null,a,f.dmg); f.kind="boom"; f.t=0.25; } }
  B.fx=B.fx.filter(f=>f.t>0); for (const t of B.txt){ t.t-=dt; t.y-=dt*0.6; } B.txt=B.txt.filter(t=>t.t>0);
  if (!live("foe").length) endBattle(true); else if (P.hp<=0) endBattle(false);

function endBattle(win, retreat){

  const res={win:!!win, retreat:!!retreat, hp:Math.max(0,Math.round(B.P.hp/B.P.maxhp*100)), fallen:[...new Set(B.fallen)], strained:[...new Set(B.strained)], time:Math.round(B.time), diff:B.opts.diff||1};
  if (!B.opts.practice) S.player.hp = (!win && !retreat) ? 0.15 : clamp(B.P.hp/B.P.maxhp, 0.05, 1);
  B.endT=setTimeout(()=>{ if (RT.battle!==B) return;
    $("#battleUI")?.remove(); RT.battle=null; RT.uiOpen=Math.max(0,RT.uiOpen-1); RT.keys.clear(); RT.last=0;
    for (const id of ["hud","menu","prompt"]) $("#"+id).classList.remove("hidden");

function battleSummary(r){

  return `전투 결과: ${r.retreat?`${iGa(me)} 싸움에서 물러났다`:r.win?"적을 모두 쓰러뜨렸다":`${iGa(me)} 쓰러져 싸움에서 졌다`}. ${me}의 남은 체력 ${r.hp}%. ${r.fallen.length?`싸우다 쓰러진 동행: ${nm(r.fallen)}.`:"쓰러진 동행은 없다."}${r.strained.length?` 능력을 무리하게 써서 한동안 움직이지 못한 동행: ${nm(r.strained)}.`:""} (${r.time}초 동안의 싸움)`;

function drawEnemy(u,px,py,ts){
  const r=u.r*ts; ctx.fillStyle="rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(px,py+r*0.15,r,r*0.35,0,0,7); ctx.fill();
  ctx.fillStyle = u.st.stun>0 ? "#c9b56a" : u.st.slow>0 ? "#6f8fb8" : u.col; ctx.beginPath();
  if (u.type==="shooter"){ ctx.moveTo(px,py-r*2.2); ctx.lineTo(px+r,py); ctx.lineTo(px-r,py); ctx.closePath(); } else ctx.ellipse(px,py-r*0.9,r,r*0.95,0,0,7);
  ctx.fill();
  if (u.boss){ ctx.fillStyle="#2a1420"; for (const sx of [-0.6,0,0.6]){ ctx.beginPath(); ctx.moveTo(px+sx*r-r*0.18,py-r*1.7); ctx.lineTo(px+sx*r,py-r*2.3); ctx.lineTo(px+sx*r+r*0.18,py-r*1.7); ctx.closePath(); ctx.fill(); } }
  ctx.fillStyle="#fff"; const ey=py-r*(u.type==="shooter"?0.9:1.15), es=Math.max(2,r*0.24); ctx.fillRect(px-r*0.42,ey,es,es); ctx.fillRect(px+r*0.42-es,ey,es,es);
}
function renderBattle(now){
  const B=RT.battle; if (!B) return; const m=B.m, k=cv.width/innerWidth, padT=64*k, padB=(COARSE?150:110)*k;
  const ts=Math.max(8,Math.floor(Math.min(cv.width/m.w,(cv.height-padT-padB)/m.h))), ox=Math.floor((cv.width-ts*m.w)/2), oy=Math.floor(padT+(cv.height-padT-padB-ts*m.h)/2); B.view={ts,ox,oy};
  if (!B.bg){ const c=document.createElement("canvas"); c.width=m.w*16; c.height=m.h*16; const x=c.getContext("2d");
    for (let ty=0;ty<m.h;ty++) for (let tx=0;tx<m.w;tx++){ const r=seeded("bt"+tx+","+ty); drawTerrainBuiltin(x,B.opts.ground&&PAL.field?"field":"farm",B.opts.ground&&PAL.field?B.opts.ground:"deadgrass",tx*16,ty*16,r); if (getT(m,tx,ty)===T.ROCK) drawPropBuiltin(x,"rock",tx*16,ty*16,r); } B.bg=c; }
  ctx.imageSmoothingEnabled=false; ctx.fillStyle="#0b0f14"; ctx.fillRect(0,0,cv.width,cv.height); ctx.drawImage(B.bg,ox,oy,ts*m.w,ts*m.h);
  const X=(v)=>ox+v*ts, Y=(v)=>oy+v*ts;

  if (B.dest){ ctx.strokeStyle="rgba(255,255,255,.7)"; ctx.lineWidth=Math.max(2,ts*0.06); ctx.beginPath(); ctx.ellipse(X(B.dest.x),Y(B.dest.y),ts*0.3,ts*0.15,0,0,7); ctx.stroke(); }
  for (const u of B.units.filter(u=>u.hp>0).sort((a,b)=>a.y-b.y)){
    const px=X(u.x), py=Y(u.y);
    if (u.kind==="enemy"){ if (B.ptgt===u){ ctx.strokeStyle="#ffe27a"; ctx.lineWidth=Math.max(2,ts*0.07); ctx.beginPath(); ctx.ellipse(px,py,u.r*ts*1.3,u.r*ts*0.55,0,0,7); ctx.stroke(); }
      if (u.spr){ const sh=getSheet(u.spr), sc2=(u.boss?1.2:1)*(u.spr.scale||1), dw=ts*1.05*sc2, dh=dw*SPR_H/SPR_W; ctx.fillStyle="rgba(210,40,40,.35)"; ctx.beginPath(); ctx.ellipse(px,py,ts*0.45*sc2,ts*0.18,0,0,7); ctx.fill();
        ctx.globalAlpha = u.st.stun>0 ? 0.6 : 1; ctx.drawImage(sh, (u.frame||0)*SPR_W, (u.dir||0)*SPR_H, SPR_W, SPR_H, Math.round(px-dw/2), Math.round(py-dh+ts*0.18), dw, dh); ctx.globalAlpha=1; }
      else drawEnemy(u,px,py,ts); }
    else {
      if (u.mode){ ctx.fillStyle = u.mode==="sword" ? "rgba(40,12,60,.6)" : "rgba(50,80,150,.55)"; ctx.beginPath(); ctx.ellipse(px,py,ts*0.6,ts*0.3,0,0,7); ctx.fill(); }
      const who=u.id==="player"?"player":u.id, spr=spriteFor(who), sc=spriteSpec(who).scale||1, dw=ts*1.05*sc, dh=dw*spr.fh/spr.fw;
      ctx.globalAlpha = u.st.invul>0 ? 0.5 : 1; ctx.drawImage(spr.img, u.frame*spr.fw, u.dir*spr.fh, spr.fw, spr.fh, Math.round(px-dw/2), Math.round(py-dh+ts*0.18), dw, dh); ctx.globalAlpha=1;
    }
    const bw=ts*(u.boss?1.6:0.9), top=py-ts*(u.kind==="enemy"&&!u.spr?u.r*2.4+0.3:(u.spr&&u.boss?1.75:1.5)), bh=Math.max(3,ts*0.1);
    ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(px-bw/2,top,bw,bh); ctx.fillStyle = u.side==="ally" ? (u===B.P?"#6fe08a":"#7fc4ff") : "#ff6b5e"; ctx.fillRect(px-bw/2,top,bw*u.hp/u.maxhp,bh);
  }
  for (const f of B.fx) if (f.kind==="line"){ ctx.strokeStyle=f.col; ctx.lineWidth=Math.max(2,ts*0.07); ctx.beginPath(); ctx.moveTo(X(f.x),Y(f.y)); ctx.lineTo(X(f.x2),Y(f.y2)); ctx.stroke(); }
  ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.font=`700 ${Math.max(12,Math.round(ts*0.42))}px "IBM Plex Sans KR", sans-serif`;
  for (const t of B.txt){ ctx.fillStyle="rgba(0,0,0,.65)"; ctx.fillText(t.s,X(t.x)+1,Y(t.y)+1); ctx.fillStyle=t.col; ctx.fillText(t.s,X(t.x),Y(t.y)); }
  if (B.shield>0){ ctx.strokeStyle="rgba(140,200,255,.75)"; ctx.lineWidth=Math.max(3,ts*0.12); ctx.strokeRect(ox+2,oy+2,ts*m.w-4,ts*m.h-4); }
  if (B.over){ ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fillRect(0,0,cv.width,cv.height); ctx.fillStyle="#fff"; ctx.font=`700 ${Math.round(ts*1.6)}px "Gowun Batang", serif`; ctx.fillText(B.retreat?"후퇴":B.win?"승리":"패배", cv.width/2, cv.height/2); }
  for (const o of B.btns){ const cd = o.u==="dodge" ? B.dodge : o.u.skt, dead = o.u!=="dodge" && o.u.hp<=0;
    const tx = o.label + (o.u!=="dodge" && o.u.mode ? (o.u.mode==="sword"?" (검)":" (방패)") : "") + (dead?" ✕":cd>0?` ${Math.ceil(cd)}`:"");
    if (o.shown!==tx){ o.shown=tx; o.b.textContent=tx; } const dis=dead||cd>0||B.over; if (o.b.disabled!==dis) o.b.disabled=dis; }
  const info=`${B.opts.title||"전투"} · 내 체력 ${Math.max(0,Math.round(B.P.hp))}/${B.P.maxhp} · 남은 적 ${B.units.filter(u=>u.side==="foe"&&u.hp>0).length}`, el=$("#btInfo"); if (el && el.textContent!==info) el.textContent=info;
}
function canvasPoint(e){
  const r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(cv.width/Math.max(1,r.width)), y:(e.clientY-r.top)*(cv.height/Math.max(1,r.height))};
}
function handleCanvasPointer(e){
  if (RT.battle){ battleTap(e); return; }
  if (!RT.started || RT.uiOpen) return;
  const point=canvasPoint(e), mx=point.x+RT.cam.x, my=point.y+RT.cam.y, TS=16*RT.scale;
  RT.quest=null; const reach=COARSE?0.85:0.6; let hit=null, hd=Infinity;
  { const fa=fieldHit(mx, my, TS, reach); if (fa){ if (Math.hypot(fa.o.x-S.player.x,fa.o.y-S.player.y)<2.2){ RT.ppath=null; RT.auto=null; fieldTapActor(fa); } else tapMove(Math.floor(fa.o.x),Math.floor(fa.o.y)); return; } }
  for (const n of Object.values(RT.npcs)){
    if(n.map!==S.player.map||n.transit||n.shadow||n.inStall||n.away) continue;
    const ddx=Math.abs(mx-n.x*TS);
    if(ddx<TS*reach && my>(n.y-1.4)*TS && my<(n.y+0.45)*TS && ddx<hd){ hd=ddx; hit=n; }
  }
  if(hit){
    if(Math.hypot(hit.x-S.player.x,hit.y-S.player.y)<2.2){ RT.ppath=null; RT.auto=null; Chat.open([hit.id]); }
    else tapMove(Math.floor(hit.x),Math.floor(hit.y),{npc:hit.id,tries:0});
    return;
  }
  if (S.settings.tapWalk===false) return;
  const m=MAPS[S.player.map], tx=Math.floor(mx/TS), ty=Math.floor(my/TS);
  if(tx<0||ty<0||tx>=m.w||ty>=m.h) return;
  const t=getT(m,tx,ty); tapMove(tx,ty,t===T.GATE?{gate:true}:t===T.BED?{bed:true}:null);
}
function battleTap(e){
  const B=RT.battle; if (!B || B.over || B.hold || !B.view) return;
  const point=canvasPoint(e), v=B.view, x=(point.x-v.ox)/v.ts, y=(point.y-v.oy)/v.ts;
  let hit=null; for (const u of B.units) if (u.side==="foe" && u.hp>0 && Math.hypot(u.x-x,(u.y-u.r)-y)<Math.max(0.7,u.r+0.4)) hit=u;
  if (hit){ B.ptgt=hit; B.dest=null; } else { B.ptgt=null; B.dest={x:clamp(x,0.4,B.m.w-0.4), y:clamp(y,0.4,B.m.h-0.4)}; }
}
function gainXp(n){ const st=S.stats; let up=0; st.xp+=n; while (st.xp>=xpNeed(st.level)){ st.xp-=xpNeed(st.level); st.level++; up++; } return up; }
function openTraining(){
  if (!RT.started || Chat.session || RT.battle) return; let diff=1; const team=new Set();
  openModal("모의 전투", (box, api)=>{
    const st=S.stats, c=h("div",{class:"content"}), day=Math.floor(S.time/1440);
    c.append(h("p",{class:"hint"},"훈련장에서 하는 연습 전투예요. 연습이라 진짜 체력은 줄지 않아요. 왼쪽 조이스틱이나 땅을 눌러 움직이고, 적을 누르거나 '공격'을 누르면 가까운 적을 노려요. 가까운 적은 알아서 때려요. '회피'로 피하고, 오른쪽 버튼으로 내 기술과 동행의 이능력을 써요. 키보드는 방향키/WASD로 움직이고 스페이스가 강타, Shift가 회피예요."));
    const ds=h("select",{}, [1,2,3].map(d=>h("option",{value:d,selected:diff===d||null,disabled:st.level<MISSION_UNLOCK[d-1]||null},`난이도 ${"★".repeat(d)}${st.level<MISSION_UNLOCK[d-1]?` (레벨 ${MISSION_UNLOCK[d-1]}부터)`:""}`))); ds.onchange=()=>{ diff=Number(ds.value); };

      c.append(h("label",{class:"person",style:"margin-bottom:6px"+(e.ok?"":";opacity:.6")}, cb, portraitFor(ch.id,36), h("div",{style:"flex:1"}, h("b",{},dispName(ch.id)), h("small",{}, e.ok?`기술: ${combatSpec(ch.id).skill.name}`:e.why)))); }

        const ids=[...team]; api.close(); startBattle({diff, team:ids, title:"모의 전투", practice:true, onEnd:(r)=>{
