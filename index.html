function applyWorldToSave(d){
  S.world = worldMeta(d);
  for (const ch of d.characters){
    if (S.role==="kyle" && ch.id===d.kyleId) continue;
    const cur=charById(ch.id);
    if (cur) cur.card=JSON.parse(JSON.stringify(ch.card)); else addCharacter(JSON.parse(JSON.stringify(ch)));
  }
  applyPlaceNames(S.world.placeNames); RT.decisions={}; snapAllNPCs(); scheduleSave(); refreshOpenPanels();
}
async function exportWorld(){
  const W=S.world||{}; const chars=S.chars.map(c=>JSON.parse(JSON.stringify(c)));
  if (W.kyleCard && !chars.some(c=>c.id===W.kyleCard.id)) chars.unshift(JSON.parse(JSON.stringify(W.kyleCard)));
  const out={mtutWorld:1, title:W.title, subtitle:W.subtitle, intro:W.intro, lore:W.lore, roles:W.roles, kyleId:W.kyleId, placeNames:W.placeNames, characters:chars, exported:new Date().toISOString(), engine:GAME_VERSION};
  if (await saveFile(`mtut_world_${String(W.title||"world").replace(/[\\/:*?"<>|]/g,"-")}.json`, JSON.stringify(out,null,1), "application/json")) toast("월드팩을 내보냈어요. 깃허브에는 올리지 마세요.");
}
async function importCharCard(f){
  let data;
  if (/\.png$/i.test(f.name) || f.type==="image/png"){
    const buf=new Uint8Array(await f.arrayBuffer()); let p=8, found=null; const lat=new TextDecoder("latin1");
    while (p+8<=buf.length){
      const len=((buf[p]<<24)|(buf[p+1]<<16)|(buf[p+2]<<8)|buf[p+3])>>>0, type=lat.decode(buf.slice(p+4,p+8));
      if (type==="tEXt"){ const ch=buf.slice(p+8,p+8+len), z=ch.indexOf(0), key=lat.decode(ch.slice(0,z));
        if (key==="chara"||key==="ccv3"){ const bin=Uint8Array.from(atob(lat.decode(ch.slice(z+1))),c=>c.charCodeAt(0)); found=new TextDecoder().decode(bin); if (key==="ccv3") break; } }
      if (type==="IEND") break; p+=12+len;
    }
    if (!found) throw 0; data=JSON.parse(found);
  } else data=JSON.parse(await f.text());
  const d = data.data || data; if (!d || !d.name) throw 0;
  const ch={id:uid("ch"), card:blankCard(String(d.name))}; const cd=ch.card.data;
  for (const k of ["description","personality","scenario","mes_example","creator_notes","post_history_instructions"]) if (d[k]) cd[k]=String(d[k]);
  if (Array.isArray(d.tags)) cd.tags=d.tags;
  if (d.extensions?.gateside) Object.assign(cd.extensions.gateside, JSON.parse(JSON.stringify(d.extensions.gateside)));
  return ch;
}

async function judgeMission(s){

  if (!llmReady("mem")) return {result:"partial", summary:"(연결이 없어 결과를 판정하지 못했어요. 부분 성공으로 기록해요.)"};

  const ids=s.all.map(id=>`${id}=${cname(charById(id))}`).join(", ");
  const prompt=`너는 게임 'MTUT'의 임무 결과 판정 담당이다. 아래 임무 기록을 읽고 JSON 하나만 출력한다.

[동행] ${ids||"없음"}
[기록]
${log}
[판정 규칙]
- result: 임무 목표를 이뤘으면 "success", 일부만 이뤘거나 큰 대가를 치렀으면 "partial", 이루지 못했으면 "fail". 기록에 실제로 일어난 일만 근거로 삼는다. 결말이 나지 않은 채 돌아왔으면 "partial"이나 "fail"이다.
- summary: 임무 보고서처럼 2~3문장으로 무슨 일이 있었는지 쓴다.
- mvp: 가장 공이 큰 동행의 id. 동행이 없거나 가릴 수 없으면 "".
출력 형식(이 JSON만): {"result":"success","summary":"...","mvp":""}`;
  try{ const d=(await llmJSON("mem", prompt, {tier:"default", maxTokens:600})) || {}; if (!["success","partial","fail"].includes(d.result)) d.result="partial"; return d; }

}
function applyMissionResult(s, res){
  const m=s.mission, st=S.stats, mult=RESULT_MULT[res.result] ?? 0.5, diff=m.diff||1;

  const team=[];
  for (const id of s.all){ if (!charById(id)) continue; const r=rel(id), g=Math.round(merit*(id===res.mvp?1.5:1)); r.merit=(r.merit||0)+g; team.push({id, merit:g, total:r.merit, mvp:id===res.mvp}); }

function bWalk(B,x,y){ const m=B.m; if (x<0.3||y<0.3||x>m.w-0.3||y>m.h-0.3) return false; for (const [ox,oy] of [[-0.25,-0.2],[0.25,-0.2],[-0.25,0.2],[0.25,0.2]]) if (getT(m,Math.floor(x+ox),Math.floor(y+oy))===T.ROCK) return false; return true; }

function bJump(B,u,x,y){ for (const [ox,oy] of [[0.7,0.2],[-0.7,0.2],[0,0.8],[0,-0.8],[0.9,0.9],[-0.9,-0.9]]) if (bWalk(B,x+ox,y+oy)){ u.x=x+ox; u.y=y+oy; return; } }
function bHit(B,src,tg,dmg){
  if (tg.hp<=0 || tg.st.invul>0) return; let d=dmg*(0.85+Math.random()*0.3);
  if (src){ if (src.st.buff>0) d*=1.5; if (src.mode==="sword") d*=2; }
  if (tg.side==="ally"){ if (B.shield>0) d*=0.4; if (tg.mode==="shield") d*=0.35; else if (B.units.some(a=>a.mode==="shield" && a.hp>0 && bdist(a,tg)<2.3)) d*=0.6; }
  d=Math.max(1,Math.round(d)); tg.hp-=d; B.txt.push({x:tg.x, y:tg.y-0.9, t:0.7, s:String(d), col:tg.side==="ally"?"#ff8d86":"#ffe9a8"});
  if (tg.hp<=0){ tg.hp=0; if (tg.kind==="ally"){ B.fallen.push(tg.id); if (tg.fusedWith) B.fallen.push(tg.fusedWith); } }
}
function bAttack(B,u,tg){
  if (!tg || u.t>0 || u.noAttack) return; u.t=u.cd*(u.st.slow>0?1.8:1);
  const dx=tg.x-u.x, dy=tg.y-u.y; u.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?1:2):(dy<0?3:0);
  B.fx.push({kind:"line", x:u.x, y:u.y-0.4, x2:tg.x, y2:tg.y-0.4, t:0.12, col:u.side==="ally"?"#ffffff":"#ff9a8a"}); bHit(B,u,tg,u.atk);
}
function useSkill(B,u){
  if (!B || B.over || B.hold || !u || u.hp<=0 || u.skt>0 || u.st.stun>0) return;
  const foes=B.units.filter(e=>e.side==="foe" && e.hp>0); if (!foes.length) return;
  const k=u.skill.kind, near=(o)=>foes.slice().sort((a,b)=>bdist(o,a)-bdist(o,b))[0]; let label=u.skill.name;
  if (k==="smash"){ for (const e of foes) if (bdist(u,e)<=1.8+e.r) bHit(B,u,e,u.atk*2.5); B.fx.push({kind:"ring",x:u.x,y:u.y,r:1.8,t:0.25,col:"rgba(255,240,180,.45)"}); }
  else if (k==="strike"){ const tg=foes.slice().sort((a,b)=>b.hp-a.hp)[0]; bJump(B,u,tg.x,tg.y); bHit(B,u,tg,u.atk*4); B.fx.push({kind:"ring",x:tg.x,y:tg.y,r:0.8,t:0.25,col:"rgba(255,255,255,.6)"}); }
  else if (k==="dash"){ const tg=near(u); bJump(B,u,tg.x,tg.y); bHit(B,u,tg,u.atk*2.5); tg.st.stun=1.3; B.fx.push({kind:"ring",x:tg.x,y:tg.y,r:0.9,t:0.25,col:"rgba(255,200,120,.6)"}); }
  else if (k==="shield"){ B.shield=5; }
  else if (k==="aoe"){ const tg=near(B.P); for (const e of foes) if (bdist(tg,e)<=2.6) bHit(B,u,e,u.atk*3); B.fx.push({kind:"ring",x:tg.x,y:tg.y,r:2.6,t:0.35,col:"rgba(190,160,255,.5)"});
    u.uses=(u.uses||0)+1; if (u.skill.strain && u.uses%u.skill.strain===0){ u.st.stun=6; B.strained.push(u.id); label="과부하"; } }
  else if (k==="slow"){ for (const e of foes) e.st.slow=5; B.fx.push({kind:"ring",x:B.m.w/2,y:B.m.h/2,r:Math.max(B.m.w,B.m.h),t:0.3,col:"rgba(120,170,230,.25)"}); }
  else if (k==="buff"){ for (const a of B.units) if (a.side==="ally" && a.hp>0) a.st.buff=6; }
  else if (k==="fusion"){ u.mode = u.mode==="sword" ? "shield" : "sword"; label = u.mode==="sword" ? "검으로" : "방패로"; }
  u.skt = SKILL_CD[k] || 10; B.txt.push({x:u.x, y:u.y-1.5, t:1, s:label, col:"#ffffff"});
}
function battleDodge(){
  const B=RT.battle; if (!B || B.over || B.hold || B.dodge>0 || B.P.hp<=0) return; const P=B.P, f=B.face;
  for (let i=0;i<12;i++){ const nx=P.x+f.x*0.25, ny=P.y+f.y*0.25; if (!bWalk(B,nx,ny)) break; P.x=nx; P.y=ny; }
  P.st.invul=0.6; B.dodge=5; B.dest=null; B.txt.push({x:P.x, y:P.y-1.5, t:0.8, s:"회피", col:"#ffffff"});
}
function updateBattle(dt){
  const B=RT.battle; if (!B || B.over || B.hold) return;
  B.time+=dt; B.shield=Math.max(0,B.shield-dt); B.dodge=Math.max(0,B.dodge-dt);
  const live=(side)=>B.units.filter(u=>u.hp>0 && u.side===side);
  const nearestOf=(o,arr)=>{ let b=null, bd=1e9; for (const a of arr){ const d=bdist(o,a); if (d<bd){ bd=d; b=a; } } return b; };
  for (const u of B.units){ if (u.hp<=0) continue; u.t=Math.max(0,u.t-dt); u.skt=Math.max(0,u.skt-dt); for (const k in u.st) u.st[k]=Math.max(0,u.st[k]-dt); }
  const P=B.P, foes=live("foe");
  if (P.hp>0 && P.st.stun<=0){
    const k=RT.keys; let vx=0, vy=0;
    if (k.has("ArrowLeft")||k.has("KeyA")) vx-=1; if (k.has("ArrowRight")||k.has("KeyD")) vx+=1; if (k.has("ArrowUp")||k.has("KeyW")) vy-=1; if (k.has("ArrowDown")||k.has("KeyS")) vy+=1;
    if (vx||vy){ const l=Math.hypot(vx,vy); vx/=l; vy/=l; B.dest=null; B.ptgt=null; }
    else { const goal = (B.ptgt && B.ptgt.hp>0) ? (bdist(P,B.ptgt)>P.range*0.85 ? B.ptgt : null) : B.dest;
      if (goal){ const dx=goal.x-P.x, dy=goal.y-P.y, d=Math.hypot(dx,dy); if (d<0.12) B.dest=null; else { vx=dx/d; vy=dy/d; } } }
    if (vx||vy) B.face={x:vx,y:vy};
    bMove(B,P,vx,vy,dt);
    let pt = (B.ptgt && B.ptgt.hp>0 && bdist(P,B.ptgt)<=P.range+B.ptgt.r) ? B.ptgt : null;
    if (!pt){ const n=nearestOf(P,foes); if (n && bdist(P,n)<=P.range+n.r) pt=n; }
    bAttack(B,P,pt);
  }
  for (const u of B.units){
    if (u===P || u.hp<=0 || u.st.stun>0) continue;
    const en=live(u.side==="ally"?"foe":"ally"); if (!en.length) break;
    if (u.noAttack){ const d=Math.max(0.001,bdist(u,P)); if (d>2.2) bMove(B,u,(P.x-u.x)/d,(P.y-u.y)/d,dt); else u.frame=0; continue; }
    const tg=nearestOf(u,en), d=Math.max(0.001,bdist(u,tg)), reach=u.range+(tg.r||0.3), ux=(tg.x-u.x)/d, uy=(tg.y-u.y)/d;
    if (u.range>3){ if (d>u.range) bMove(B,u,ux,uy,dt); else if (d<u.range*0.45) bMove(B,u,-ux,-uy,dt); else u.frame=0; }
    else if (d>reach*0.9) bMove(B,u,ux,uy,dt); else u.frame=0;
    if (d<=reach) bAttack(B,u,tg);
    if (u.boss){ u.tele-=dt; if (u.tele<=0){ u.tele=6; const v=en[Math.floor(Math.random()*en.length)]; B.fx.push({kind:"tele", x:v.x, y:v.y, r:1.9, t:1.3, dmg:u.atk*2.2}); } }
  }
  for (const f of B.fx){ f.t-=dt; if (f.kind==="tele" && f.t<=0){ for (const a of live("ally")) if (Math.hypot(a.x-f.x,a.y-f.y)<=f.r) bHit(B,null,a,f.dmg); f.kind="boom"; f.t=0.25; } }
  B.fx=B.fx.filter(f=>f.t>0); for (const t of B.txt){ t.t-=dt; t.y-=dt*0.6; } B.txt=B.txt.filter(t=>t.t>0);
  if (!live("foe").length) endBattle(true); else if (P.hp<=0) endBattle(false);
}
function endBattle(win, retreat){
  const B=RT.battle; if (!B || B.over) return; B.over=true; B.win=!!win; B.retreat=!!retreat;
  const res={win:!!win, retreat:!!retreat, hp:Math.max(0,Math.round(B.P.hp/B.P.maxhp*100)), fallen:[...new Set(B.fallen)], strained:[...new Set(B.strained)], time:Math.round(B.time), diff:B.opts.diff||1};
  setTimeout(()=>{
    $("#battleUI")?.remove(); RT.battle=null; RT.uiOpen=Math.max(0,RT.uiOpen-1); RT.keys.clear(); RT.last=0;
    for (const id of ["hud","menu","prompt"]) $("#"+id).classList.remove("hidden");
    if (Chat.session) Chat.el.hidden=false;
    try{ B.opts.onEnd && B.opts.onEnd(res); }catch(e){ console.warn("battle end", e); }
  }, retreat?60:1200);
}
function battleSummary(r){
  const me=S.persona.name, nm=(ids)=>ids.map(id=>charById(id)?cname(charById(id)):"").filter(Boolean).join(", ");
  return `전투 결과: ${r.retreat?`${iGa(me)} 싸움에서 물러났다`:r.win?"적을 모두 쓰러뜨렸다":`${iGa(me)} 쓰러져 싸움에서 졌다`}. ${me}의 남은 체력 ${r.hp}%. ${r.fallen.length?`싸우다 쓰러진 동행: ${nm(r.fallen)}.`:"쓰러진 동행은 없다."}${r.strained.length?` 능력을 무리하게 써서 한동안 움직이지 못한 동행: ${nm(r.strained)}.`:""} (${r.time}초 동안의 싸움)`;
}
function drawEnemy(u,px,py,ts){
  const r=u.r*ts; ctx.fillStyle="rgba(0,0,0,.3)"; ctx.beginPath(); ctx.ellipse(px,py+r*0.15,r,r*0.35,0,0,7); ctx.fill();
  ctx.fillStyle = u.st.stun>0 ? "#c9b56a" : u.st.slow>0 ? "#6f8fb8" : u.col; ctx.beginPath();
  if (u.type==="shooter"){ ctx.moveTo(px,py-r*2.2); ctx.lineTo(px+r,py); ctx.lineTo(px-r,py); ctx.closePath(); } else ctx.ellipse(px,py-r*0.9,r,r*0.95,0,0,7);
  ctx.fill();
  if (u.boss){ ctx.fillStyle="#2a1420"; for (const sx of [-0.6,0,0.6]){ ctx.beginPath(); ctx.moveTo(px+sx*r-r*0.18,py-r*1.7); ctx.lineTo(px+sx*r,py-r*2.3); ctx.lineTo(px+sx*r+r*0.18,py-r*1.7); ctx.closePath(); ctx.fill(); } }
  ctx.fillStyle="#fff"; const ey=py-r*(u.type==="shooter"?0.9:1.15), es=Math.max(2,r*0.24); ctx.fillRect(px-r*0.42,ey,es,es); ctx.fillRect(px+r*0.42-es,ey,es,es);
}
function renderBattle(now){
  const B=RT.battle; if (!B) return; const m=B.m, k=cv.width/innerWidth, padT=64*k, padB=(B.btns.length>3?160:100)*k;
  const ts=Math.max(8,Math.floor(Math.min(cv.width/m.w,(cv.height-padT-padB)/m.h))), ox=Math.floor((cv.width-ts*m.w)/2), oy=Math.floor(padT+(cv.height-padT-padB-ts*m.h)/2); B.view={ts,ox,oy};
  if (!B.bg){ const c=document.createElement("canvas"); c.width=m.w*16; c.height=m.h*16; const x=c.getContext("2d");
    for (let ty=0;ty<m.h;ty++) for (let tx=0;tx<m.w;tx++){ const r=seeded("bt"+tx+","+ty); drawTerrainBuiltin(x,"farm","deadgrass",tx*16,ty*16,r); if (getT(m,tx,ty)===T.ROCK) drawPropBuiltin(x,"rock",tx*16,ty*16,r); } B.bg=c; }
  ctx.imageSmoothingEnabled=false; ctx.fillStyle="#0b0f14"; ctx.fillRect(0,0,cv.width,cv.height); ctx.drawImage(B.bg,ox,oy,ts*m.w,ts*m.h);
  const X=(v)=>ox+v*ts, Y=(v)=>oy+v*ts;
  for (const f of B.fx) if (f.kind!=="line"){ ctx.fillStyle = f.kind==="tele" ? `rgba(230,70,60,${0.18+0.3*(1-f.t/1.3)})` : f.kind==="boom" ? "rgba(255,170,120,.6)" : (f.col||"rgba(140,200,255,.35)"); ctx.beginPath(); ctx.arc(X(f.x),Y(f.y),f.r*ts,0,7); ctx.fill(); }
  if (B.dest){ ctx.strokeStyle="rgba(255,255,255,.7)"; ctx.lineWidth=Math.max(2,ts*0.06); ctx.beginPath(); ctx.ellipse(X(B.dest.x),Y(B.dest.y),ts*0.3,ts*0.15,0,0,7); ctx.stroke(); }
  for (const u of B.units.filter(u=>u.hp>0).sort((a,b)=>a.y-b.y)){
    const px=X(u.x), py=Y(u.y);
    if (u.kind==="enemy"){ if (B.ptgt===u){ ctx.strokeStyle="#ffe27a"; ctx.lineWidth=Math.max(2,ts*0.07); ctx.beginPath(); ctx.ellipse(px,py,u.r*ts*1.3,u.r*ts*0.55,0,0,7); ctx.stroke(); } drawEnemy(u,px,py,ts); }
    else {
      if (u.mode){ ctx.fillStyle = u.mode==="sword" ? "rgba(40,12,60,.6)" : "rgba(50,80,150,.55)"; ctx.beginPath(); ctx.ellipse(px,py,ts*0.6,ts*0.3,0,0,7); ctx.fill(); }
      const who=u.id==="player"?"player":u.id, spr=spriteFor(who), sc=spriteSpec(who).scale||1, dw=ts*1.05*sc, dh=dw*spr.fh/spr.fw;
      ctx.globalAlpha = u.st.invul>0 ? 0.5 : 1; ctx.drawImage(spr.img, u.frame*spr.fw, u.dir*spr.fh, spr.fw, spr.fh, Math.round(px-dw/2), Math.round(py-dh+ts*0.18), dw, dh); ctx.globalAlpha=1;
    }
    const bw=ts*(u.boss?1.6:0.9), top=py-ts*(u.kind==="enemy"?u.r*2.4+0.3:1.5), bh=Math.max(3,ts*0.1);
    ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(px-bw/2,top,bw,bh); ctx.fillStyle = u.side==="ally" ? (u===B.P?"#6fe08a":"#7fc4ff") : "#ff6b5e"; ctx.fillRect(px-bw/2,top,bw*u.hp/u.maxhp,bh);
  }
  for (const f of B.fx) if (f.kind==="line"){ ctx.strokeStyle=f.col; ctx.lineWidth=Math.max(2,ts*0.07); ctx.beginPath(); ctx.moveTo(X(f.x),Y(f.y)); ctx.lineTo(X(f.x2),Y(f.y2)); ctx.stroke(); }
  ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.font=`700 ${Math.max(12,Math.round(ts*0.42))}px "IBM Plex Sans KR", sans-serif`;
  for (const t of B.txt){ ctx.fillStyle="rgba(0,0,0,.65)"; ctx.fillText(t.s,X(t.x)+1,Y(t.y)+1); ctx.fillStyle=t.col; ctx.fillText(t.s,X(t.x),Y(t.y)); }
  if (B.shield>0){ ctx.strokeStyle="rgba(140,200,255,.75)"; ctx.lineWidth=Math.max(3,ts*0.12); ctx.strokeRect(ox+2,oy+2,ts*m.w-4,ts*m.h-4); }
  if (B.over){ ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fillRect(0,0,cv.width,cv.height); ctx.fillStyle="#fff"; ctx.font=`700 ${Math.round(ts*1.6)}px "Gowun Batang", serif`; ctx.fillText(B.retreat?"후퇴":B.win?"승리":"패배", cv.width/2, cv.height/2); }
  for (const o of B.btns){ const cd = o.u==="dodge" ? B.dodge : o.u.skt, dead = o.u!=="dodge" && o.u.hp<=0;
    const tx = o.label + (o.u!=="dodge" && o.u.mode ? (o.u.mode==="sword"?" (검)":" (방패)") : "") + (dead?" ✕":cd>0?` ${Math.ceil(cd)}`:"");
    if (o.shown!==tx){ o.shown=tx; o.b.textContent=tx; } const dis=dead||cd>0||B.over; if (o.b.disabled!==dis) o.b.disabled=dis; }
  const info=`${B.opts.title||"전투"} · 내 체력 ${Math.max(0,Math.round(B.P.hp))}/${B.P.maxhp} · 남은 적 ${B.units.filter(u=>u.side==="foe"&&u.hp>0).length}`, el=$("#btInfo"); if (el && el.textContent!==info) el.textContent=info;
}
function battleTap(e){
  const B=RT.battle; if (!B || B.over || B.hold || !B.view) return;
  const rect=cv.getBoundingClientRect(), k=cv.width/rect.width, v=B.view, x=((e.clientX-rect.left)*k-v.ox)/v.ts, y=((e.clientY-rect.top)*k-v.oy)/v.ts;
  let hit=null; for (const u of B.units) if (u.side==="foe" && u.hp>0 && Math.hypot(u.x-x,(u.y-u.r)-y)<Math.max(0.7,u.r+0.4)) hit=u;
  if (hit){ B.ptgt=hit; B.dest=null; } else { B.ptgt=null; B.dest={x:clamp(x,0.4,B.m.w-0.4), y:clamp(y,0.4,B.m.h-0.4)}; }
}
function gainXp(n){ const st=S.stats; let up=0; st.xp+=n; while (st.xp>=xpNeed(st.level)){ st.xp-=xpNeed(st.level); st.level++; up++; } return up; }
function openTraining(){
  if (!RT.started || Chat.session || RT.battle) return; let diff=1; const team=new Set();
  openModal("모의 전투", (box, api)=>{
    const st=S.stats, c=h("div",{class:"content"}), day=Math.floor(S.time/1440);
    c.append(h("p",{class:"hint"},"훈련장에서 하는 연습 전투예요. 땅을 누르면 움직이고, 적을 누르면 쫓아가서 공격해요. 가까운 적은 알아서 때려요. 아래 버튼으로 내 기술과 동행의 이능력을 써요. 키보드는 방향키/WASD로 움직이고 스페이스가 강타, Shift가 회피예요."));
    const ds=h("select",{}, [1,2,3].map(d=>h("option",{value:d,selected:diff===d||null,disabled:st.level<MISSION_UNLOCK[d-1]||null},`난이도 ${"★".repeat(d)}${st.level<MISSION_UNLOCK[d-1]?` (레벨 ${MISSION_UNLOCK[d-1]}부터)`:""}`))); ds.onchange=()=>{ diff=Number(ds.value); };
    c.append(h("div",{class:"field"}, h("label",{},"난이도"), ds));
    c.append(h("h3",{style:"font-size:15px;margin:10px 0 6px"},`함께 싸울 사람 (최대 ${MISSION_TEAM_MAX}명)`));
    for (const ch of S.chars.filter(ch=>ch.id!==S.world?.kyleId)){ const e=missionEligibility(ch);
      const cb=h("input",{type:"checkbox",checked:team.has(ch.id)||null,disabled:!e.ok||null}); cb.onchange=()=>{ if (cb.checked){ if (team.size>=MISSION_TEAM_MAX){ cb.checked=false; toast(`최대 ${MISSION_TEAM_MAX}명까지예요.`); return; } team.add(ch.id); } else team.delete(ch.id); };
      c.append(h("label",{class:"person",style:"margin-bottom:6px"+(e.ok?"":";opacity:.6")}, cb, portraitFor(ch.id,36), h("div",{style:"flex:1"}, h("b",{},dispName(ch.id)), h("small",{}, e.ok?`기술: ${combatSpec(ch.id).skill.name}`:e.why)))); }
    c.append(h("p",{class:"hint"}, st.lastTrain===day ? "오늘의 훈련 보상은 이미 받았어요. 연습은 계속할 수 있어요." : "이기면 하루에 한 번 경험을 조금 받아요."));
    c.append(h("div",{style:"display:flex;gap:8px;justify-content:flex-end"}, h("button",{class:"btn",onclick:()=>api.close()},"닫기"),
      h("button",{class:"btn primary",onclick:()=>{ for (const id of team){ const l=G(charById(id)).leash; if (l && !team.has(l)){ toast(`${cname(charById(id))}${josa(cname(charById(id)),"은","는")} ${cname(charById(l))}${josa(cname(charById(l)),"과","와")} 함께여야 해요.`); return; } }
        const ids=[...team]; api.close(); startBattle({diff, team:ids, title:"모의 전투", onEnd:(r)=>{
          let msg = r.retreat ? "훈련을 중단했어요." : r.win ? "모의 전투에서 이겼어요!" : "모의 전투에서 졌어요. 다시 해 볼 수 있어요.";
          if (r.win && S.stats.lastTrain!==Math.floor(S.time/1440)){ S.stats.lastTrain=Math.floor(S.time/1440); const xp=15*r.diff, up=gainXp(xp); msg+=` 경험 +${xp}.${up?` 레벨이 ${S.stats.level}(으)로 올랐어요!`:""}`; }
          S.time+=20; scheduleSave(); toast(msg); }}); }},"시작")));
    box.append(c);
  });
}
