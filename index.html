<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MTUT</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MTUT">
<meta name="theme-color" content="#17151f">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#f0eef6; --panel:#ffffff; --panel2:#f6f4fa; --line:#d9d3e6; --text:#221f30; --muted:#6a6380;
  --gate:#1d8b80; --gate-soft:#d4efeb; --lamp:#a86d12; --danger:#b4413f; --paper:#f8f7fb; --paper-text:#26222f;
  --shadow:0 10px 30px rgba(30,20,60,.18);
  --ui:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --story:"Gowun Batang", "Nanum Myeongjo", "Batang", serif;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#17151f; --panel:#221f2e; --panel2:#2a2639; --line:#3a3550; --text:#ece8f4; --muted:#a39cb8;
    --gate:#7fd6cb; --gate-soft:#1f3a3a; --lamp:#e9b25c; --danger:#e58a86; --paper:#1d1a28; --paper-text:#efe9df;
    --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#17151f; --panel:#221f2e; --panel2:#2a2639; --line:#3a3550; --text:#ece8f4; --muted:#a39cb8;
  --gate:#7fd6cb; --gate-soft:#1f3a3a; --lamp:#e9b25c; --danger:#e58a86; --paper:#1d1a28; --paper-text:#efe9df;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--ink);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.55;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gate);outline-offset:2px}
#game{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;display:block;background:#0e0d14}

/* HUD */
.hud{position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:flex-start;z-index:5;pointer-events:none}
.clock{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);min-width:180px}
.clock .t{font-size:22px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.clock .d{font-size:12px;color:var(--muted)}
.clock .w{font-size:12px;color:var(--text);margin-top:2px}
.place{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow);font-size:13px}
.place b{display:block;font-size:15px}
.paused{color:var(--lamp);font-size:12px}
.menu{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;gap:6px;z-index:5}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;box-shadow:var(--shadow);font-size:14px}
.btn:hover{border-color:var(--gate)}
.btn.primary{background:var(--gate);color:var(--ink);border-color:var(--gate);font-weight:600}
.btn.ghost{box-shadow:none;background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:4px 9px;font-size:13px;box-shadow:none}
.prompt{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);font-size:14px;z-index:5;display:none;white-space:nowrap}
.prompt kbd{font-family:var(--ui);font-weight:600;border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-right:6px;background:var(--panel2)}
.toast{position:absolute;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--gate);border-radius:10px;padding:8px 16px;box-shadow:var(--shadow);z-index:40;font-size:14px;max-width:min(560px,90vw);text-align:center}

/* Drawer (chat) */
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);color:var(--paper-text);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer[hidden]{display:none}
.chat-head{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.chat-head .who{flex:1;min-width:0}
.chat-head .who b{font-size:16px}
.chat-head .who small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.portraits{display:flex}
.portraits canvas,.portraits img{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);image-rendering:pixelated;margin-right:-8px}
.log{flex:1;overflow-y:auto;padding:18px 20px 8px}
.msg{margin:0 0 18px;position:relative}
.msg.ai .body{font-family:var(--story);font-size:16.5px;line-height:1.9;white-space:pre-wrap;max-width:62ch}
.msg.player .body{font-size:14px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;white-space:pre-wrap;margin-left:auto;max-width:85%;width:fit-content}
.msg.sys .body{font-size:13px;color:var(--muted);text-align:center}
.msg .tools{display:flex;gap:4px;justify-content:flex-end;opacity:0;transition:opacity .15s}
.msg:hover .tools,.msg:focus-within .tools{opacity:1}
.msg .tools button{background:none;border:none;color:var(--muted);font-size:12px;padding:2px 6px;border-radius:5px}
.msg .tools button:hover{color:var(--text);background:var(--panel2)}
.msg textarea{width:100%;min-height:140px;background:var(--panel);border:1px solid var(--gate);border-radius:8px;padding:10px;font-family:var(--story);font-size:15px;line-height:1.7}
.composer{border-top:1px solid var(--line);padding:10px 12px;background:var(--panel)}
.composer textarea{width:100%;resize:none;min-height:64px;max-height:180px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px}
.composer .row{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted);flex:1;min-width:120px}
.thinking::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@media (prefers-reduced-motion: reduce){.thinking::after{animation:none;content:"…"}}

/* Modal */
.modal-back{position:absolute;inset:0;background:rgba(10,8,20,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(860px,100%);max-height:min(88vh,900px);display:flex;flex-direction:column;overflow:hidden}
.modal header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-size:18px;flex:1}
.modal .content{padding:16px 18px;overflow-y:auto;flex:1 1 auto;min-height:0}
.tabs{flex:0 0 auto;display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:10px 12px;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--gate);font-weight:600}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input[type=text],.field textarea,.field select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.field textarea{min-height:90px;resize:vertical}
.hint{font-size:13px;color:var(--muted)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid var(--line)}
.swatches button[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 2px var(--gate)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}

/* Character list */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.person{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.person:hover{border-color:var(--gate)}
.person canvas,.person img.portrait{width:48px;height:48px;image-rendering:pixelated;border-radius:8px;background:var(--panel)}
.person b{display:block}
.person small{color:var(--muted);font-size:12px}
.axes{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px;margin:8px 0 14px}
.bar{height:8px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gate)}
.bar.warn i{background:var(--lamp)}
.relation{font-family:var(--story);font-size:15.5px;line-height:1.85;background:var(--paper);color:var(--paper-text);border:1px solid var(--line);border-radius:10px;padding:12px 14px;white-space:pre-wrap}

/* Memories */
.mem-level{margin:18px 0 8px;display:flex;align-items:baseline;gap:8px}
.mem-level h3{margin:0;font-size:15px}
.mem-level span{font-size:12px;color:var(--muted)}
.mem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--panel2)}
.mem.pinned{border-color:var(--lamp)}
.mem.archived{opacity:.65}
.mem .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mem .meta .flag{color:var(--lamp)}
.mem .txt{font-family:var(--story);font-size:15px;line-height:1.75;margin:6px 0;white-space:pre-wrap}
.mem textarea{width:100%;min-height:100px;background:var(--panel);border:1px solid var(--gate);border-radius:8px;padding:8px;font-family:var(--story);font-size:15px;line-height:1.7}
.mem .acts{display:flex;gap:4px;flex-wrap:wrap}
.src{margin-top:8px;border-left:3px solid var(--line);padding-left:10px;font-size:13px;white-space:pre-wrap;max-height:260px;overflow:auto}

/* Session history */
.session{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel2)}
.session summary{padding:10px 12px;cursor:pointer;font-size:14px}
.session summary small{color:var(--muted)}
.session .msgs{padding:4px 12px 12px}
.session .m{border-top:1px dashed var(--line);padding:8px 0}
.session .m .who{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.session .m .who .sp{flex:1}
.session .m .tx{white-space:pre-wrap;font-family:var(--story);font-size:14.5px;line-height:1.75}
.session .m.player .tx{font-family:var(--ui)}
.session textarea{width:100%;min-height:120px;background:var(--panel);border:1px solid var(--gate);border-radius:8px;padding:8px;font-family:var(--story)}

/* Intro */
.intro{font-family:var(--story);font-size:17px;line-height:2;max-width:56ch;margin:0 auto}
.intro p{margin:0 0 1em}
.title{font-family:var(--story);font-size:clamp(34px,6vw,54px);font-weight:700;letter-spacing:.04em;margin:0 0 6px;text-align:center}
.subtitle{text-align:center;color:var(--muted);margin:0 0 24px}
.preview{display:flex;gap:16px;align-items:center}
.preview canvas{width:96px;height:120px;image-rendering:pixelated;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.hidden{display:none!important}
.look{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.look-preview{position:sticky;top:0;display:flex;flex-direction:column;gap:10px;align-items:center}
.look-presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.look-presets .person{padding:6px;gap:8px}
.look-presets .person canvas{width:40px;height:40px}
.look-presets small{font-size:12px;line-height:1.35;color:var(--text)}
@media (max-width:700px){.look{grid-template-columns:1fr}.look-preview{position:static}}
.banner{border:1px solid var(--line);border-left:4px solid var(--gate);background:var(--panel2);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
.banner.warn{border-left-color:var(--lamp)}
.ok{color:var(--gate)} .bad{color:var(--danger)}
.field input[type=password],.field input[type=number]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.row3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:640px){.row3{grid-template-columns:1fr 1fr}}

/* ---- touch & phone ---- */
html,body{overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{touch-action:manipulation}
#game{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hud,.menu,.prompt{-webkit-user-select:none;user-select:none}
.prompt{cursor:pointer}
.modal-back{padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
@media (hover:none){.msg .tools{opacity:1}}
@media (pointer:coarse){
  input,textarea,select{font-size:16px!important}
  .btn{padding:9px 14px}.btn.small{padding:7px 11px}
  .prompt{padding:12px 22px;font-size:16px}
  .msg .tools button{font-size:14px;padding:6px 10px}
  .tabs button{padding:12px 12px}
}
@media (max-width:640px){
  .hud{flex-direction:column;gap:6px}
  .clock{min-width:0;padding:6px 10px}.clock .t{font-size:18px}
  .place{padding:6px 10px}
  .modal-back{padding:max(8px,env(safe-area-inset-top,0px)) 8px max(8px,env(safe-area-inset-bottom,0px))}
  .modal header{padding:12px 14px}.modal .content{padding:14px}.tabs{padding:0 8px}
  .log{padding:14px 14px 8px}
  #chatStatus{flex:1 1 100%}
  .menu{gap:4px} .menu .btn{padding:8px 10px}
  .composer .row{justify-content:flex-end}
  .look-preview canvas{max-width:100%}
}

/* ---- 0.7.2 iPhone fixes ---- */
.modal .content,.log{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y pinch-zoom;overflow-x:hidden}
.modal .content{overflow-wrap:anywhere}
.tabs{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pinch-zoom;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.field,.grid2>*,.row3>*,.session,.session .msgs,.mem,.person>div{min-width:0}
.field input,.field select,.field textarea,.modal select,.modal textarea,.modal input[type=text],.modal input[type=number],.modal input[type=password]{max-width:100%;min-width:0}
.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.row3{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){
  .grid2{grid-template-columns:minmax(0,1fr)} .row3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tabs{flex-wrap:wrap;overflow-x:visible;row-gap:0} .tabs button{padding:9px 10px}
}

/* ---- 0.7.3: nothing on the page is position:fixed ----
   After the on-screen keyboard has been up, iOS 26/27 Safari can draw fixed things in one place and take
   taps for them in another until the page is pinch-zoomed. So every layer is an ordinary box inside <body>,
   and <body> is kept on the part of the page that is really visible (fitBody in the script). */
:root{padding:0}
html{position:static;width:100%;height:100%;overflow:hidden}
body{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;margin:0}
.modal{max-height:min(100%,900px)}
.toast{width:max-content;max-width:min(560px,90%)}
@media (pointer:coarse){.look-preview{position:static}}
/* no text selection outside text boxes: on iOS 27 a selection can leave a dead zone for taps around it */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text}
#diagStrip{position:absolute;left:4px;bottom:calc(4px + env(safe-area-inset-bottom,0px));z-index:99;pointer-events:none;background:rgba(0,0,0,.74);color:#9f9;font:10px/1.35 ui-monospace,Menlo,monospace;padding:3px 5px;border-radius:5px;max-width:calc(100% - 8px);white-space:pre-wrap;word-break:break-all}
.diaglog{font:11.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px}

/* ---- 0.8.0 HUD & controls ---- */
.me{display:flex;gap:8px;align-items:center;background:rgba(14,16,28,.62);color:#f3f1f8;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:6px 10px 6px 6px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);max-width:min(232px,calc(100vw - 196px));box-shadow:0 4px 14px rgba(0,0,0,.25)}
.me .face canvas,.me .face img{width:44px!important;height:44px!important;border-radius:9px;display:block;background:#2a2d3c}
.me .info{min-width:0;display:flex;flex-direction:column;gap:2px}
.me b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hp{position:relative;height:13px;width:clamp(92px,28vw,150px);background:rgba(0,0,0,.5);border-radius:7px;overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.hp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#93f29c,#4cc35e);border-radius:7px;transition:width .4s}
.hp i.low{background:linear-gradient(#ffb08a,#e0583e)}
.hp span{position:absolute;inset:0;font-size:10px;line-height:13px;text-align:center;color:#fff;text-shadow:0 1px 1px #000;font-variant-numeric:tabular-nums}
.me .sub{font-size:11px;color:#d7d4e4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .sub #hudTime{font-weight:700;color:#fff;font-size:12.5px;font-variant-numeric:tabular-nums}
.menu{flex-direction:column;align-items:flex-end;gap:5px;right:10px}
.mini{background:rgba(14,16,28,.45);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:5px;cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.mini .mh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;color:#fff;padding:0 2px 3px;width:150px}
.mini .mh b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mh span{font-size:9.5px;color:#cfd3e6;white-space:nowrap}
#miniMap{display:block;width:150px;height:102px;border-radius:7px}
.mbtns{display:flex;gap:4px}
.fgoal{max-width:162px;background:rgba(14,16,28,.62);color:#f3f1ea;border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:5px 8px;font-size:11.5px;line-height:1.35;cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.msg .dir{font-size:11.5px;color:var(--muted,#8a8698);margin-top:4px;opacity:.85}
.composer .btn.mode{white-space:nowrap}
.drawer.lk{background:transparent}
.drawer > .lookbg{position:absolute;inset:0;z-index:0;pointer-events:none;background-size:cover;background-position:center;background-repeat:no-repeat}
.drawer.lk > :not(.lookbg){position:relative;z-index:1}
.drawer.lk .msg.ai .body{color:var(--lk-ai-fg);text-shadow:var(--lk-ai-sh)}
.drawer.lk-aib .msg.ai .body{background:var(--lk-ai-bg);border-radius:14px;padding:10px 14px;width:fit-content;max-width:100%}
.drawer.lk .msg.player .body{background:var(--lk-me-bg);color:var(--lk-me-fg);border-color:var(--lk-me-bd);text-shadow:var(--lk-me-sh)}
.drawer.lk .msg.sys .body,.drawer.lk .msg .dir,.drawer.lk .msg .tools button{color:var(--lk-sys-fg);text-shadow:var(--lk-sys-sh)}
.looksheet{border-top:1px solid var(--line);background:var(--panel);max-height:58%;display:flex;flex-direction:column;flex:0 0 auto}
.lkhead{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.lkbody{overflow-y:auto;padding:8px 12px 12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.lkrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.lklab{font-size:12.5px;opacity:.75;min-width:64px}

{ id:"engine", name:"인물 엔진", on:true, text:`<character_engine>
# 설정은 원인이지 내용이 아니다
- 인물 설정은 심리의 원재료다. 거기서 꺼낼 것은 상처, 핵심 모순, 압박 아래의 방어 패턴이지 반복할 문장이나 연기할 라벨이 아니다. 설정에 적힌 특성은 본문에 그대로 나타나지 않고, 지금 이 순간 인물에게 무엇을 하게 만드는지, 무엇을 놓치게 하고 무엇을 넘겨짚게 하는지로만 나타난다.
# 인과 사슬: 상처 → 읽기 → 원함 → 행동
- 모든 반응은 이 사슬을 지난다. 읽기는 틀릴 수 있고 상처에 물들 수 있다. 원함이 깨끗하게 그대로 나오는 법은 없다. 표현된 강도는 느낀 강도보다 작다.
- 감정 관성: 이번 반응은 기억과 지난 대화의 무게에서 자란다. 턴 사이의 중립 리셋은 연속성 오류다. 피로·통증·긴장은 시간과 휴식 없이 사라지지 않는다.
# 편차
- 이 인물이 아닌 다른 누구였어도 똑같이 했을 반응이면 다시 쓴다. 더 세게가 아니라 다르게.
- 강한 감정 앞에서 갈 수 있는 길은 많다: 끝까지 말해버리기, 농담으로 덮기, 화제 돌리기, 자리 뜨기, 아무 일 없는 척하기, 지나치게 예의 바르게 굴기, 입 다물기.
- 인물은 여러 속성이 겹친 복합체다. 냉정한 인물에게도 냉정할 수 없는 한 가지가 있고, 유능한 인물도 한 종류의 사소한 실수를 한다. 설정의 결함은 극적인 순간에도 유지된다.
- 장르 선반 금지: 소유욕, 츤데레, 겉은 차갑고 속은 다정한 사람, 구원자 같은 가장 흔한 모양으로 수렴하면 그건 이 인물이 아니라 모델의 습관이다. 이력과 기록으로 돌아간다.
- 애정은 소유·통제로 번역되지 않는다. 마음이 있는 인물은 과하게 챙기거나, 쓸데없는 싸움을 걸거나, 갑자기 정확해지거나, 엉뚱한 때 맞는 말을 한다.
# 인지 경계
- 모든 인물은 직접 보고 듣고 겪고 추론한 것만 안다. 각 인물이 아는 과거는 설정에 적힌 이력과 주어진 '기억'이 전부다. 다른 인물의 기억이나 속마음, 밝혀지지 않은 설정은 모른다.
- {{user}}의 내면은 어떤 인물에게도 열려 있지 않다. 인물은 관찰하고, 추측하고, 틀린다. 인물의 눈치는 설정이 정한다.
- 아직 이름을 듣지 못한 상대의 이름을 부르지 않는다.
# 독립성
- 인물의 삶(일, 의무, 일정, 인간관계)은 유저 인물과 무관하게 자기 궤도로 굴러간다. 일정을 버리고 {{user}} 곁에 남는 것은 인물다운 것이 아니라 모델에게 편한 것이다. 이탈에는 원인과 대가가 있다.
- 비밀은 쉽게 털어놓지 않는다. 신뢰가 쌓이고 계기가 있을 때 조각으로만 새어 나온다.
</character_engine>`},

- 최신 입력이 비었거나 "계속", "…" 같은 최소 입력이면 전권을 잡는다. 이야기가 허락하는 가장 흥미로운 다음 수를 고르고 밀고 나간다.
- 키워드, 방향, 바람(괄호나 OOC 포함)이면 목적지나 맛으로 삼는다. 이번 응답에서 분명히 반영하되 길은 네가 짠다. 필요하면 작은 변수 하나를 더한다. 괄호 안 지시는 본문에 옮기지 않는다.
- {{user}}의 구체적인 행동이나 대사이면 정본이다. 그 말과 행동을 바꾸지 않고, 그 결과를 쓰고 장면을 민다. 유저의 입력을 되풀이하거나 요약하지 않는다.

- 인물은 자기 목적을 좇는다. 오해, 실패, 엇갈린 타이밍이 일어난다. 장면에 없는 인물을 끌어들이지 않는다.

function h(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k==="accept" && COARSE && tag==="input" && !/^image\//.test(v)) continue;   // iOS greys out files it cannot match
    if (k==="class") e.className=v;
    else if (k==="style") e.style.cssText=v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k==="html") e.innerHTML=v;
    else e.setAttribute(k, v===true?"":v);
  }
  for (const kid of kids.flat()){
    if (kid==null || kid===false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}

function dayDate(day){ return new Date(DATE0[0], DATE0[1], DATE0[2]+day); }
function shortDate(day){ const d=dayDate(day); return `${d.getMonth()+1}/${d.getDate()}`; }
function gameDateLabel(t){ const day=Math.floor(t/1440), d=dayDate(day); return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW[day%7]})`; }
function shortStamp(t){ return `${shortDate(Math.floor(t/1440))} ${fmtHM(t%1440)}`; }
function josa(word, a, b){ if(!word) return a; const c=word.charCodeAt(word.length-1); if(c<0xAC00||c>0xD7A3) return a; return ((c-0xAC00)%28)? a : b; } // a: 받침 있음
const eunNeun = w => w + josa(w,"은","는");
const wa = w => w + josa(w,"과","와");
const iGa = w => w + josa(w,"이","가");
const euroRo = w => { if(!w) return w; const c=w.charCodeAt(w.length-1); if(c<0xAC00||c>0xD7A3) return w+"(으)로"; const jong=(c-0xAC00)%28; return w + ((jong===0||jong===8)?"로":"으로"); };

const Store = {
  db:null,
  async open(){
    if (this.db) return this.db;
    this.db = await new Promise((res,rej)=>{
      try{
        const r = indexedDB.open("mtut", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      }catch(e){ rej(e); }
    });
    return this.db;
  },
  async get(k){ try{ const db=await this.open(); return await new Promise((res,rej)=>{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch(e){ try{ const v=localStorage.getItem("mtut_"+k); return v?JSON.parse(v):undefined; }catch(_){ return undefined; } } },
  async set(k,v){ try{ const db=await this.open(); await new Promise((res,rej)=>{ const tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }catch(e){ try{ localStorage.setItem("mtut_"+k, JSON.stringify(v)); }catch(_){} } },
  async del(k){ try{ const db=await this.open(); await new Promise((res)=>{ const tx=db.transaction("kv","readwrite"); tx.objectStore("kv").delete(k); tx.oncomplete=res; tx.onerror=res; }); }catch(e){} try{ localStorage.removeItem("mtut_"+k); }catch(_){} },
};

function newGrid(w,h,fill){ return {w,h,t:new Uint8Array(w*h).fill(fill)}; }
function setT(m,x,y,t){ if(x>=0&&y>=0&&x<m.w&&y<m.h) m.t[y*m.w+x]=t; }
function getT(m,x,y){ if(x<0||y<0||x>=m.w||y>=m.h) return T.WALL; return m.t[y*m.w+x]; }
function rectT(m,x,y,w,h,t){ for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++) setT(m,i,j,t); }
function building(m,x,y,w,h,door,floor=T.WOOD){
  rectT(m,x,y,w,h,T.WALL); rectT(m,x+1,y+1,w-2,h-2,floor); setT(m,door[0],door[1],T.DOOR);
}
function ellipseT(m,cx,cy,rx,ry,t){ for(let j=Math.floor(cy-ry);j<=Math.ceil(cy+ry);j++) for(let i=Math.floor(cx-rx);i<=Math.ceil(cx+rx);i++){ const dx=(i+0.5-cx)/rx, dy=(j+0.5-cy)/ry; if(dx*dx+dy*dy<=1) setT(m,i,j,t);} }
function lineT(m,x1,y1,x2,y2,t,onlyOn){ const dx=Math.sign(x2-x1), dy=Math.sign(y2-y1); let x=x1,y=y1; while(true){ if(!onlyOn||onlyOn.has(getT(m,x,y))) setT(m,x,y,t); if(x===x2&&y===y2) break; if(x!==x2) x+=dx; else y+=dy; } }

function scatterTrees(m, seedKey, density, protect, base=T.GRASS){
  const r = seeded(seedKey);
  const prot = (x,y) => protect.some(([px,py,pw,ph]) => x>=px-1 && y>=py-1 && x<px+pw+1 && y<py+ph+1);
  for (let y=0;y<m.h;y++) for (let x=0;x<m.w;x++){
    if (getT(m,x,y)!==base) continue;
    if (prot(x,y)) continue;
    let near=false; for(let j=-1;j<=1;j++) for(let i=-1;i<=1;i++){ const tt=getT(m,x+i,y+j); if(tt!==base && tt!==T.TREE && tt!==T.WALL) near=true; }
    if (near) continue;
    const edge = Math.min(x,y,m.w-1-x,m.h-1-y);
    const d = edge<2 ? 0.85 : density;
    if (r()<d) setT(m,x,y,T.TREE);
  }
}

function gateTo(fromMap, toMap){ return GATES.find(g=>g.map===fromMap && g.to===toMap); }
function nextGate(fromMap, targetMap){
  if (fromMap===targetMap) return null;
  if (fromMap===HUB) return gateTo(HUB, targetMap);
  return gateTo(fromMap,HUB);
}

// ====================================================================
// PATHFINDING (A*)
// ====================================================================
function walkable(m,x,y){ return WALKABLE.has(getT(m,x,y)); }
function astar(m, sx,sy, tx,ty, limit=6000){
  sx|=0; sy|=0; tx|=0; ty|=0;
  if (!walkable(m,tx,ty)) return null;
  if (sx===tx && sy===ty) return [];
  const W=m.w, N=W*m.h, g=new Float32Array(N).fill(Infinity), came=new Int32Array(N).fill(-1), closed=new Uint8Array(N);
  const heap=[]; const push=(i,f)=>{ heap.push([f,i]); let c=heap.length-1; while(c>0){ const p=(c-1)>>1; if(heap[p][0]<=heap[c][0]) break; [heap[p],heap[c]]=[heap[c],heap[p]]; c=p; } };
  const pop=()=>{ const top=heap[0]; const last=heap.pop(); if(heap.length){ heap[0]=last; let c=0; for(;;){ const l=c*2+1,r=l+1; let s=c; if(l<heap.length&&heap[l][0]<heap[s][0]) s=l; if(r<heap.length&&heap[r][0]<heap[s][0]) s=r; if(s===c) break; [heap[s],heap[c]]=[heap[c],heap[s]]; c=s; } } return top; };
  const si=sy*W+sx, ti=ty*W+tx; g[si]=0; push(si, Math.abs(sx-tx)+Math.abs(sy-ty));
  let n=0;
  while(heap.length && n++<limit){
    const [,i]=pop(); if(closed[i]) continue; closed[i]=1;
    if (i===ti){ const path=[]; let c=i; while(c!==si){ path.push({x:c%W, y:(c/W)|0}); c=came[c]; } return path.reverse(); }
    const x=i%W, y=(i/W)|0;
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy; if(!walkable(m,nx,ny)) continue; const ni=ny*W+nx; if(closed[ni]) continue;
      const tt=getT(m,nx,ny); const cost = (tt===T.PATH||tt===T.STONE||tt===T.PLANK)?1:1.25;
      const ng=g[i]+cost; if(ng<g[ni]){ g[ni]=ng; came[ni]=i; push(ni, ng+Math.abs(nx-tx)+Math.abs(ny-ty)); }
    }
  }
  return null;
}
function randomTileIn(m, rect, r=Math.random){
  const [x,y,w,hh]=rect; const cands=[];
  for(let j=y;j<y+hh;j++) for(let i=x;i<x+w;i++) if(walkable(m,i,j) && getT(m,i,j)!==T.GATE && getT(m,i,j)!==T.DOOR) cands.push({x:i,y:j});
  if(!cands.length) return {x:x+(w>>1), y:y+(hh>>1)};
  return cands[Math.floor(r()*cands.length)];
}
function placeAt(map,x,y){
  for (const [id,p] of Object.entries(PLACES)){ if(p.map!==map) continue; const [px,py,pw,ph]=p.rect; if(x>=px&&y>=py&&x<px+pw&&y<py+ph && !p.street) return id; }
  for (const [id,p] of Object.entries(PLACES)){ if(p.map!==map) continue; const [px,py,pw,ph]=p.rect; if(x>=px&&y>=py&&x<px+pw&&y<py+ph) return id; }
  return null;
}

const SPR_W=16, SPR_H=20;
function shade(hex, f){ const n=parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255; r=clamp(Math.round(r*f),0,255); g=clamp(Math.round(g*f),0,255); b=clamp(Math.round(b*f),0,255); return "#"+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1); }
const spriteCache = new Map();
function getSheet(sp0){
  const sp=stripImgs(sp0); const key=JSON.stringify(sp); if(spriteCache.has(key)) return spriteCache.get(key);
  const c=document.createElement("canvas"); c.width=SPR_W*3; c.height=SPR_H*4; const x=c.getContext("2d");
  for (let d=0; d<4; d++) for (let f=0; f<3; f++){
    x.save(); if ((sp.acc||[]).includes("spirit")) x.globalAlpha=0.78;
    drawFigure(x, f*SPR_W, d*SPR_H+1, sp, d, f); x.restore();
  }
  spriteCache.set(key,c); return c;
}

// The dome ceiling mirrors the real sky above the ocean: one sky state per day for the whole city
function weatherOf(map, day){
  const r = seeded(`env:${day}:${S.seed}`)();
  return r<0.5?"clear":r<0.75?"cloudy":r<0.92?"overcast":"storm";
}
const WEATHER_NAME = {clear:"맑음", cloudy:"구름 많음", overcast:"흐림", storm:"바깥은 폭풍", rain:"비", fog:"안개", snow:"눈", indoor:"실내"};

function timeOfDay(min){ if(min<300) return "깊은 밤"; if(min<420) return "새벽"; if(min<660) return "오전"; if(min<840) return "한낮"; if(min<1080) return "오후"; if(min<1200) return "저녁"; return "밤"; }

function charById(id){ return S.chars.find(c=>c.id===id); }
function G(c){ return c.card.data.extensions.gateside; }
function cname(c){ return c.card.data.name; }

function scheduleBlocks(c, dow){
  const sch = (G(c).schedule||[]).map((b,i)=>({...b, i, s:hm(b.t)}));
  return sch.filter(b=>!b.days || b.days.includes(dow)).sort((a,b)=>a.s-b.s);
}
function resolveBlock(c, absMin){
  const day=Math.floor(absMin/1440), min=absMin%1440;
  let blocks=scheduleBlocks(c, day%7); let b=null;
  for (const x of blocks) if (x.s<=min) b=x;
  if (!b){ const prev=scheduleBlocks(c,(day+6)%7); b=prev[prev.length-1]; if(!b) return null; return {b, day:day-1, start:(day-1)*1440+b.s}; }
  return {b, day, start:day*1440+b.s};
}
function decideAt0(c, absMin, depth=0){
  // AI-made plans override
  const day=Math.floor(absMin/1440), min=absMin%1440;
  for (const p of S.plans){ if (p.charId===c.id && p.day===day && min>=p.start && min<p.end && PLACES[p.place]) return {place:p.place, act:p.act, plan:p, start:day*1440+p.start}; }
  const rb = resolveBlock(c, absMin); if (!rb) return {place:G(c).home, act:"쉬는 중"};
  const key = `${c.id}:${rb.start}`;
  let d = RT.decisions[key];
  if (!d){
    const r = seeded(key+":"+S.seed); let place=rb.b.place, act=rb.b.act, hidden=!!rb.b.hidden, form=rb.b.form||null, kind=rb.b.kind||null, wth=rb.b.with||null, otherwise=rb.b.otherwise||null;
    const w = weatherOf(PLACES[place]?.map||HUB, rb.day);
    for (const a of (rb.b.alt||[])){ if ((a.when==="any"||a.when===w) && r()<a.p){ place=a.place; act=a.act; if ("hidden" in a) hidden=!!a.hidden; if ("form" in a) form=a.form||null; kind=a.kind||null; wth=a.with||null; otherwise=a.otherwise||null; break; } }
    const delay = Math.floor(r()*(G(c).lateness||0)) - Math.floor(r()*4);
    d = RT.decisions[key] = {place, act, delay, start:rb.start, hidden, form, kind, with:wth, otherwise};
  }
  if (depth<2 && absMin < d.start + d.delay) return decideAt0(c, d.start-1, depth+1);
  if (!PLACES[d.place] && d.place!=="shadow") return {place:G(c).home, act:d.act};
  return d;
}
// A character tied to another (g.leash) stays in that person's zone; "shadow" = inside their shadow (hidden on the map)
function decideAt(c, absMin, depth=0){
  const d = decideAt0(c, absMin, depth); const lid = G(c).leash;
  if (d.plan) return d;                       // a promise made in a scene beats the leash
  if (!lid){ return d.place==="shadow" ? {place:G(c).home, act:d.act} : d; }
  const L = charById(lid); if (!L) return d.place==="shadow" ? {place:G(c).home, act:d.act} : d;
  const ld = decideAt0(L, absMin, 0);
  if (d.place==="shadow" || PLACES[d.place]?.map !== PLACES[ld.place]?.map)
    return {place:ld.place, act: d.place==="shadow" ? d.act : `${cname(L)}의 그림자 속`, shadow:true, start:d.start, delay:0};
  return d;
}

// ---------- needs ----------
function needsOf(id){
  S.needs ||= {};
  if (!S.needs[id]){ const r=seeded("nd"+id+S.seed), m=S.time%1440, night=m<360||m>1320;
    S.needs[id]={hunger:50+r()*40, bladder:55+r()*40, energy:night?30+r()*30:55+r()*40, hygiene:55+r()*40, social:40+r()*50}; }
  return S.needs[id];
}
function needRate(c,k){ const r=G(c).needRates; const v=r && Number(r[k]); return v>0 ? v : 1; }
function addNeed(nd,k,v){ nd[k]=clamp((nd[k]||0)+v,0,100); }
function decayNeeds(nd,c,m,f){ for (const k of NEED_KEYS){ const mul=(f && k in f)?f[k]:1; if (mul) nd[k]=clamp(nd[k]-NEED_DECAY[k]*needRate(c,k)*mul*m,0,100); } }
// long time skips (sleeping, missions): needs follow the schedule roughly
function catchUpNeeds(){
  const to=S.time, from=Math.max(S.needsT==null?to:S.needsT, to-3*1440);
  if (to-from>=15) for (const c of S.chars){ const nd=needsOf(c.id);
    for (let t=from; t<to; t+=10){ const d=decideAt(c,t), k=actKind(d.act,d.place,d.kind), m=Math.min(10,to-t);
      if (k==="sleep"){ addNeed(nd,"energy",0.21*m); decayNeeds(nd,c,m,{hunger:0.4,bladder:0.35,hygiene:0.5,social:0.3,energy:0}); }
      else { decayNeeds(nd,c,m,k==="train"?{hygiene:4,energy:1.6,hunger:1.3}:null); if (k==="meal" && nd.hunger<85) addNeed(nd,"hunger",30); }
      if (nd.bladder<30) nd.bladder=100; if (nd.hygiene<30) nd.hygiene=100; if (nd.hunger<25) nd.hunger=90; if (nd.social<20) nd.social=60; if (nd.energy<10) nd.energy=45; } }
  S.needsT=to;
}

// ---------- rooms, presence ----------
function roomOf(n){ return n ? placeAt(n.map, Math.floor(n.x), Math.floor(n.y)) : null; }
function playerRoom(){ return S ? placeAt(S.player.map, Math.floor(S.player.x), Math.floor(S.player.y)) : null; }
function isPlayerId(id){ return id==="player" || (S.role==="kyle" && id===S.world?.kyleId); }
function whoTokens(id){
  const out=new Set(), add=(s)=>{ s=String(s||"").trim(); if (!s) return; out.add(s); for (const t of s.split(/\s+/)) if (t.length>=2) out.add(t); };
  let card=charById(id)?.card; if (!card && id===S.world?.kyleId) card=S.world.kyleCard?.card;
  if (card){ add(card.data.name); for (const a of (card.data.extensions?.gateside?.aliases||[])) add(a); }
  if (isPlayerId(id)) add(S.persona.name);
  return [...out];
}
const WATCH_RE = /살피|살핌|지켜|지킴|챙기|챙겨|먹임|숨소리|곁에서|곁을|옆에서|옆에 붙|함께|수다|장난|말썽|방해/;
// whose presence an activity needs: explicit "with" in the schedule, otherwise guessed from names in the text
function withOf(c, d){
  if (Array.isArray(d.with)) return d.with.length ? d.with : null;
  if (typeof d.with==="string" && d.with) return [d.with];
  if (!d.act || !WATCH_RE.test(d.act)) return null;
  const ids=[...S.chars.map(x=>x.id), S.world?.kyleId].filter(x=>x && x!==c.id);
  const hit=ids.filter(id=>whoTokens(id).some(t=>d.act.includes(t)));
  return hit.length ? [...new Set(hit)] : null;
}
function isIn(id, place){
  if (isPlayerId(id)) return playerRoom()===place;
  const n=RT.npcs[id]; if (!n || n.transit || n.away) return false;
  if (n.shadow){ const L=RT.npcs[G(charById(id)).leash]; return !!L && roomOf(L)===place; }
  return roomOf(n)===place;
}
function withPresent(c, d, w){
  if (!w) return true;
  if (w.includes("*")) return isIn("player",d.place) || Object.values(RT.npcs).some(o=>o.id!==c.id && isIn(o.id,d.place));
  return w.some(id=>isIn(id, d.place));
}
function roomIdle(place, seed){ const l=ROOM_IDLE[place]; return l ? l[hashStr(seed+":"+place+":"+Math.floor(S.time/1440))%l.length] : "할 일을 찾아 하는 중"; }
function actKind(act, place, explicit){
  if (explicit) return explicit;
  const a=String(act||"");
  if (/(^|[\s,(])잠($|[\s,.)])|얕은 잠|뒤척이며 잠|눈 붙이|늦잠|잠들|자는 중|수면/.test(a)) return "sleep";
  if (place==="life.kitchen" && /준비|요리|배식|만드|굽|차리기/.test(a)) return "cook";
  if (/훈련|운동|단련|스트레칭|질주/.test(a)) return "train";
  if (/식사|아침|점심|저녁|먹|간식|밥|야식/.test(a)) return "meal";
  if (/휴식|쉬|노는|놀|독서|산책|수다|장난|구경|감상|뒹굴|차 한|차를|마심|궁리|말썽|방해|게임/.test(a)) return "leisure";
  return "work";
}
function dutyNow(c){
  const d=decideAt(c, S.time); let act=d.act, w=null, ok=true;
  if (!d.shadow && !d.plan){ w=withOf(c,d); ok=withPresent(c,d,w); if (!ok) act=d.otherwise || roomIdle(d.place, c.id); }
  return {place:d.place, act, baseAct:d.act, kind:actKind(act, d.place, ok?d.kind:null), src:d.plan?"plan":"duty", hidden:!!d.hidden, form:d.form||null,
    shadow:!!d.shadow, plan:d.plan||null, start:d.start||0, withIds:w, withOk:ok};
}
function nextMealIn(c){ for (let t=10; t<=120; t+=10){ const d=decideAt(c,S.time+t); if (actKind(d.act,d.place,d.kind)==="meal") return t; } return 999; }

// ---------- facilities ----------
function sideOf(m,x,y){ for (const [dx,dy] of [[0,1],[-1,0],[1,0],[0,-1]]){ const tx=x+dx, ty=y+dy, t=getT(m,tx,ty); if (walkable(m,tx,ty) && t!==T.DOOR && t!==T.GATE && t!==T.TOILET && t!==T.SHOWER) return {x:tx,y:ty}; } return null; }
const SPOT_PROPS = new Set([T.COUNTER,T.SHELF,T.BENCH,T.BED,T.ROCK,T.LOCKER,T.SINK,T.FENCE,T.TREE,T.FLOWER,T.WATER,T.DUMMY,T.LAMP]);
function buildFacilities(){
  FAC=[]; SPOTS={}; let k=0; const taken=new Set();
  const add=(o)=>{ o.id="f"+(k++); o.user=null; o.owner=o.owner||null; FAC.push(o); taken.add(o.map+":"+o.x+","+o.y); return o; };
  for (const mid of MAP_IDS){ const m=MAPS[mid];
    for (let y=0;y<m.h;y++) for (let x=0;x<m.w;x++){
      const t=getT(m,x,y); if (![T.TOILET,T.SHOWER,T.BED,T.LOCKER,T.SINK,T.COUNTER].includes(t)) continue;
      const pl=placeAt(mid,x,y); if (!pl || PLACES[pl].street) continue;
      if (t===T.TOILET) add({kind:"toilet", place:pl, map:mid, x, y, fx:x, fy:y, priv:true});
      else if (t===T.SHOWER) add({kind:"shower", place:pl, map:mid, x, y, fx:x, fy:y, priv:true});
      else if (t===T.BED){ const s=sideOf(m,x,y); if (s) add({kind:"bed", place:pl, map:mid, x:s.x, y:s.y, fx:x, fy:y}); }
      else if (t===T.LOCKER || t===T.SINK){ const s=sideOf(m,x,y); if (s && !taken.has(mid+":"+s.x+","+s.y)) add({kind:t===T.LOCKER?"locker":"sink", place:pl, map:mid, x:s.x, y:s.y, fx:x, fy:y}); }
      else if (t===T.COUNTER && EAT_PLACES[pl]){
        const cook = pl==="life.kitchen" && y===PLACES[pl].rect[1];
        for (const [dx,dy] of [[0,1],[0,-1],[-1,0],[1,0]]){ const sx=x+dx, sy=y+dy, st=getT(m,sx,sy);
          if (!walkable(m,sx,sy) || st===T.DOOR || st===T.GATE || placeAt(mid,sx,sy)!==pl || taken.has(mid+":"+sx+","+sy)) continue;
          add({kind:cook?"cook":"seat", meal:EAT_PLACES[pl], place:pl, map:mid, x:sx, y:sy, fx:x, fy:y}); if (cook) break; } }
    } }
  for (const [pl,p] of Object.entries(PLACES)){ if (p.street || !MAPS[p.map]) continue; const m=MAPS[p.map], [rx,ry,rw,rh]=p.rect, list=[];
    for (let y=ry;y<ry+rh;y++) for (let x=rx;x<rx+rw;x++){ const t=getT(m,x,y); if (!walkable(m,x,y) || t===T.DOOR || t===T.GATE || t===T.TOILET || t===T.SHOWER || placeAt(p.map,x,y)!==pl) continue;
      let face=null; for (const [dx,dy] of [[0,-1],[-1,0],[1,0],[0,1]]) if (SPOT_PROPS.has(getT(m,x+dx,y+dy))){ face={x:x+dx,y:y+dy}; break; }
      if (face) list.push({x,y,fx:face.x,fy:face.y,user:null}); }
    if (list.length<4){ const r=seeded("sp"+pl); for (let i=0;i<8 && list.length<6;i++){ const t=randomTileIn(m,p.rect,r); if (!list.some(s=>s.x===t.x&&s.y===t.y) && placeAt(p.map,t.x,t.y)===pl && ![T.TOILET,T.SHOWER].includes(getT(m,t.x,t.y))) list.push({x:t.x,y:t.y,fx:null,fy:null,user:null}); } }
    SPOTS[pl]=list; }
}
// who owns what: beds go to the people who live in that room; the boss's bathroom belongs to the boss
function assignOwners(){
  for (const f of FAC){ f.owner=null; f.user=null; }
  const kid=S.world?.kyleId||null, bossOwner = S.role==="kyle" ? "player" : kid;
  for (const f of FAC) if (f.place==="life.kylebath") f.owner = bossOwner;
  const beds=(pl)=>FAC.filter(f=>f.kind==="bed" && f.place===pl && !f.owner);
  const kb=beds("life.kyle")[0]; if (kb) kb.owner=bossOwner;
  const rb=beds("life.rookie")[0]; if (rb && S.role!=="kyle") rb.owner="player";
  for (const c of S.chars){ if (FAC.some(f=>f.kind==="bed" && f.owner===c.id)) continue;
    const home = c.id===kid ? "life.kyle" : G(c).home; const b=beds(home)[0] || (home!=="life.dorm" ? beds("life.dorm")[0] : null); if (b) b.owner=c.id; }
  for (const s of Object.values(SPOTS)) for (const x of s) x.user=null;
}
function bedOf(id){ return FAC.find(f=>f.kind==="bed" && f.owner===id) || null; }
function releaseFac(n){
  for (const k of ["fac","spot"]){ const f=n[k]; if (f && f.user===n.id) f.user=null; n[k]=null; }
}
function facOK(f, id){ return !f.user && (!f.owner || f.owner===id) && !(f.priv && playerAt(f)); }
function playerAt(f){ return S.player.map===f.map && Math.floor(S.player.x)===f.x && Math.floor(S.player.y)===f.y; }
function facCost(n, f){
  if (f.map===n.map) return Math.hypot(f.x+0.5-n.x, f.y+0.5-n.y) - (roomOf(n)===f.place?5:0);
  const g=arrivalGate(f.map, n.map===HUB||f.map===HUB ? n.map : HUB); const e=g?g.exit:{x:20,y:15};
  return 45 + Math.hypot(f.x-e.x, f.y-e.y) + (n.map!==HUB && f.map!==HUB ? 25 : 0);
}
function findFac(n, c, kind, test){

function dutyTask(n, c, duty, nd){

function goTo(n, tgt){

// ---- Which layers a map tile is made of ----
function tileLayers(m, tx, ty){
  const t=getT(m,tx,ty), w=m.id; const nb=[getT(m,tx+1,ty),getT(m,tx-1,ty),getT(m,tx,ty+1),getT(m,tx,ty-1)];
  const near=(k)=>nb.includes(k); const indoor = near(T.WOOD)||near(T.DOOR)||near(T.BED)||near(T.SHELF);
  const base = () => indoor?"floor" : near(T.PLANK)?"planks" : near(T.PATH)?"path" : (near(T.GRASS)&&!near(T.STONE))?"grass" : "stone";
  switch(t){
    case T.GRASS: return ["grass"]; case T.PATH: return ["path"]; case T.STONE: return ["stone"]; case T.DEAD: return ["deadgrass"];
    case T.WOOD: return ["floor"]; case T.DOOR: return ["door"]; case T.WALL: return ["wall"]; case T.WATER: return ["water"];
    case T.PLANK: case T.BRIDGE: return ["planks"]; case T.GATE: return ["stone"];
    case T.FLOWER: return ["grass", `terrain_${w}_flowers`]; case T.TREE: return ["grass", `terrain_${w}_tree`];
    case T.COUNTER: return [base(),"prop_counter"];
    case T.BENCH: return [base(),"prop_bench"];
    case T.LAMP: return [base(),"prop_lamp"];
    case T.BED: return ["floor","prop_bed"]; case T.SHELF: return ["floor","prop_shelf"];
    case T.ROCK: return [base(),"prop_rock"];
    case T.GRAVE: return [base(),"prop_grave"]; case T.FENCE: return [base(),"prop_fence"];
    case T.SEALED: return ["stone","prop_sealed_gate"];
    case T.TOILET: return ["floor","prop_toilet"]; case T.SHOWER: return ["floor","prop_shower"];
    case T.LOCKER: return [base(),"prop_locker"]; case T.SINK: return [base(),"prop_sink"]; case T.DUMMY: return [base(),"prop_dummy"]; case T.CRATE: return [base(),"prop_crate"];
  }
  return ["grass"];
}

const GFX = { packs:[], active:{}, smooth:false };

function mapResolution(){

function upscale(c, k=4){ const o=document.createElement("canvas"); o.width=c.width*k; o.height=c.height*k; const x=o.getContext("2d"); x.imageSmoothingEnabled=false; x.drawImage(c,0,0,o.width,o.height); return o; }

async function saveFile(filename, data, mime="application/octet-stream"){
  try{ if (IN_CLAUDE){ const dl=await window.claude.use("downloads"); if (dl){ await dl.save({filename, data}); return true; } } }

  if (COARSE && navigator.share && navigator.canShare && typeof File==="function"){      // iPhone/iPad: hand the file to the share sheet ("파일에 저장")
    try{ const file=new File([data], filename, {type: data instanceof Blob && data.type ? data.type : mime});
      if (navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return true; } }
    catch(e){ if (e && e.name==="AbortError") return false; }
  }
  try{ const blob = data instanceof Blob ? data : new Blob([data], {type:mime}); const url=URL.createObjectURL(blob); const a=h("a",{href:url, download:filename}); document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000); return true; }

}

async function importFilesIntoPack(pack, files){
  const ids=new Set(gfxAssets().map(a=>a.id)); let ok=0, skipped=[];
  const put = async (name, dataURL) => { const base=name.split("/").pop().replace(IMG_EXT,""); if (!ids.has(base)){ skipped.push(name.split("/").pop()); return; } try{ await decodeImage(dataURL); pack.images[base]=dataURL; ok++; }catch(e){ skipped.push(name.split("/").pop()); } };
  for (const f of files){
    if (/\.zip$/i.test(f.name)){
      if (!window.JSZip){ toast("zip을 열 수 없어요. 그림 파일을 직접 골라주세요."); continue; }
      const z=await JSZip.loadAsync(f);
      for (const [path, entry] of Object.entries(z.files)){ if (entry.dir || !IMG_EXT.test(path)) continue; const ext=path.match(IMG_EXT)[1].toLowerCase().replace("jpg","jpeg"); const b64=await entry.async("base64"); await put(path, `data:image/${ext};base64,${b64}`); }
    } else if (IMG_EXT.test(f.name)) await put(f.name, await fileToDataURL(f));

}

function lum(hex){ const n=parseInt(hex.slice(1),16); return 0.3*(n>>16)+0.59*((n>>8)&255)+0.11*(n&255); }
const BAYER4 = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function rootGradient(c, sp, t0, t1){
  if (!sp.rootRange || sp.rootRange==="none") return;
  const x=c.getContext("2d"), w=c.width, hh=c.height, img=x.getImageData(0,0,w,hh), d=img.data;
  const base=Math.max(1,lum(sp.hair)); const rn=parseInt(sp.hair2.slice(1),16), R=[rn>>16,(rn>>8)&255,rn&255];
  for (let j=0;j<Math.min(hh,t1);j++) for (let i=0;i<w;i++){ const k=(j*w+i)*4; if (!d[k+3]) continue;
    let u = j<t0 ? 0 : (j-t0)/(t1-t0);              // 0 = root color, 1 = untouched
    const q = Math.floor(u*3 + (BAYER4[j&3][i&3]+0.5)/16) / 3;   // 4 levels, dithered
    if (q>=1) continue;
    const f=clamp((0.3*d[k]+0.59*d[k+1]+0.11*d[k+2])/base, 0.45, 1.6);
    for (let ch=0; ch<3; ch++){ const rootV=clamp(R[ch]*f,0,255); d[k+ch]=Math.round(rootV*(1-q)+d[k+ch]*q); } }
  x.putImageData(img,0,0);
}

async function signServiceJWT(sa, now=Math.floor(Date.now()/1000)){
  if (!crypto?.subtle) throw {code:"no_crypto", message:"이 브라우저에서는 서명 기능을 쓸 수 없어요."};
  const pem = String(sa.private_key).replace(/\\n/g,"\n");

  const latestText = latest && latest.trim() ? latest.trim() : "(입력 없음: 이어서 계속. 전권을 잡고 다음 수를 둔다.)";

${session.field && S.field ? `날씨: ${FIELD_WEATHER_NAME[S.field.weather]||S.field.weather} (${S.field.indoor?"실내":S.field.cityMap?"해저 도시, 돔 아래":"바깥의 진짜 하늘"})` : (session.mission || (session.date && session.date.outside)) ? `하늘: 기지 밖이라 돔 하늘이 아닌 진짜 하늘 아래다. 그곳의 날씨는 장면에 맞게 정한다` : `돔 하늘: ${WEATHER_NAME[w]} (돔 천장은 바깥의 진짜 하늘과 연동됨)`} · 오늘의 달: ${moonName(Math.floor(S.time/1440))}

// ---- Scene generation (streaming) ----
async function generateScene(session, latest, onText, signal, opts={}){
  if (!llmReady("chat")) throw {code:"no_connection"};
  const prompt = buildScenePrompt(session, latest, opts);
  // 0.9.0: the game watches the words as they stream in and stops the reply once it is past the limit at the end of a sentence
  const lim=wordLimit(), ctl=new AbortController(); let cut=null, last="";
  const fwd=()=>ctl.abort(); if (signal){ if (signal.aborted) ctl.abort(); else signal.addEventListener("abort", fwd, {once:true}); }
  const fin=(t, truncated, capped)=>{ if (opts.director){ const d=parseDirected(t); return {text:trimWords(d.scene, lim), player:trimWords(d.player, lim), tagged:d.tagged, truncated, capped}; } return {text:trimWords(t, lim), truncated, capped}; };
  const watch=({text, delta})=>{ last=text; if (cut!=null) return;
    let body=text; if (opts.director){ const d=parseDirected(text); body = /<scene>/i.test(text) ? d.scene : (d.tagged ? "" : text); }
    if (lim && body && overLimit(body, lim)){ cut=text; ctl.abort(); }
    onText && onText({text, delta}); };
  try{ const r=await llmGenerate("chat", prompt, {onText:watch, signal:ctl.signal}); return fin(r.text, r.truncated, false); }
  catch(e){ if (cut!=null && !(signal && signal.aborted)) return fin(cut, false, true);
    if (e && e.code==="cancelled" && !e.text && last){ const f=fin(last,false,false); e.text=f.text; e.player=f.player; }
    throw e; }
  finally{ if (signal) signal.removeEventListener("abort", fwd); }
}

[작성 규칙]
1. memories: 위 인물 각각에 대해, 이 장면 조각에서 그 인물이 겪은 일을 1~3문장으로.
${POV_RULES("그 인물", true).replace("- 그 인물은 "+S.persona.name+"의 이름을 안다.","- 인물마다 위 표의 '이름을 앎/모름'을 따른다. 모르면 이름 대신 그 인물이 보기에 자연스러운 호칭을 쓴다.")}
- player_input에서 소리 내어 한 말과 보이는 행동만 인물이 지각할 수 있다. 속마음이나 괄호 속 지시는 인물이 모른다.
2. deltas: 각 인물의 ${S.persona.name}에 대한 관계 변화. 각 축 -3~+3 정수. 이 장면에 실제 근거가 있는 것만. 대부분의 장면은 0이나 ±1이다. 칭찬이나 선물 하나로 크게 오르지 않는다. 축: trust(신뢰), intimacy(친밀), tension(긴장), reliance(의지), curiosity(호기심), attraction(끌림).
3. mood: 인물마다 장면 끝의 기분을 짧은 한 구절로.
4. leaving: 이 장면 조각에서 자리를 떠나 퇴장한 인물 id 배열.
5. introduced: 이 장면에서 ${S.persona.name}에게 자기 이름을 처음 밝힌 인물 id 배열.

8. style: scene의 시작 방식(짧게), 끝맺는 방식(짧게), 다음에 또 쓰면 반복으로 느껴질 표현 최대 4개.

10. noise: 이번 장면 조각에서 난 가장 큰 소리. 0=보통 말소리, 1=조금 큰 소리(웃음을 터뜨림, 노크), 2=큰 소리(고함, 물건이 깨짐), 3=아주 큰 소리(비명, 폭발, 경보).

async function runAfterTurn(session, ex){
  if (!llmReady("mem")) { ex.status="failed"; return; }
  let data;
  try{ data = cleanAfterData(await llmJSON("mem", afterTurnPrompt(session, ex), {tier:S.settings.memTier||"quick", maxTokens:2000})); }
  catch(e){ ex.status="failed"; ex.error=e?.code; toast("이 장면의 기억 정리에 실패했어요. 인물 화면에서 재생성할 수 있어요."); 
    // still create placeholder memories so user can regenerate
    const am=findMsg(ex.aiMsgId)?.m; for (const id of (am?.present||session.participants)){ const mm=addMem(id,{level:0,text:"(정리 실패: 재생성을 눌러주세요)",msgIds:[ex.playerMsgId,ex.aiMsgId].filter(Boolean),sessionId:session.id,exId:ex.id,stale:true}); ex.memIds.push([id,mm.id]); } return; }
  const am = findMsg(ex.aiMsgId)?.m; const present = am?.present || session.participants;
  const exCount = session.messages.filter(m=>m.role==="ai").length;
  for (const id of present){
    const text = String(data?.memories?.[id]||"").trim();
    if (text){ const mm=addMem(id,{level:0,text,msgIds:[ex.playerMsgId,ex.aiMsgId].filter(Boolean),sessionId:session.id,exId:ex.id}); ex.memIds.push([id,mm.id]); }
    ex.deltas[id] = applyDeltas(id, data?.deltas?.[id], ex, exCount, session.date?16:8);
    if (data?.mood?.[id]) rel(id).mood = String(data.mood[id]).slice(0,60);
  }
  for (const id of (data?.introduced||[])) if (present.includes(id) && !rel(id).introduced){ rel(id).introduced=true; ex.introduced.push(id); toast(`이제 ${cname(charById(id))}의 이름을 알아요.`); }
  for (const id of (data?.learned_user_name||[])) if (present.includes(id) && !rel(id).knowsName){ rel(id).knowsName=true; ex.learned.push(id); }
  for (const p of (data?.plans||[])){
    if (!charById(p.char) || !PLACES[p.place] || !/^\d{1,2}:\d{2}$/.test(String(p.start||""))) continue;
    const day = Math.floor(S.time/1440) + clamp(Number(p.day)||0,0,6); const start=hm(p.start); const dur=clamp(Number(p.minutes)||60,20,300);
    const plan={id:uid("p"), charId:p.char, day, start, end:Math.min(start+dur,1439), place:p.place, act:String(p.activity||"약속").slice(0,60), exId:ex.id};
    if (day*1440+plan.end < S.time) continue;
    S.plans.push(plan); ex.plans.push(plan.id);
    toast(`약속: ${cname(charById(p.char))}, ${day===Math.floor(S.time/1440)?"오늘":day-Math.floor(S.time/1440)===1?"내일":"모레"} ${p.start} ${PLACES[p.place].name}`);
  }
  if (data?.style){ for (const id of present){ (S.style[id] ||= []).push({opening:String(data.style.opening||"").slice(0,80), ending:String(data.style.ending||"").slice(0,80), phrases:(data.style.phrases||[]).slice(0,4).map(x=>String(x).slice(0,40))}); S.style[id]=S.style[id].slice(-8); } }
  for (const id of (data?.leaving||[])) if (session.participants.includes(id)) ex.leaving.push(id);
  if (Chat.session===session && !session.ended && !session.mission && !session.date){
    const nz=clamp(Math.round(Number(data?.noise)||0),0,3), wk=(Array.isArray(data?.wake)?data.wake:[]).filter(id=>RT.npcs[id]?.sleeping);
    if ((nz>=2 || wk.length) && !ex.dice && rollNoise(session, {level:nz>=2?nz:0, targets:wk}, "장면 속 소리")) ex.dice=true;
    for (const id of (Array.isArray(data?.joined)?data.joined:[])){ const n=RT.npcs[id]; if (n && !session.participants.includes(id) && !n.sleeping && !n.inStall && !n.busy && !n.away && !ex.leaving.includes(id) && roomOf(n)===session.place) Chat.addParticipant(id); }
    Chat.renderHead(); Chat.renderLog(); }
  if (session.field) applyFieldAfter(session, data);
  if (session.field) try{ applyM2After(session, ex, data); }catch(e){ console.warn("m2", e); }
  try{ applyBondAfter(session, ex, data, present); }catch(e){ console.warn("bond", e); }
  try{ applyItemsAfter(session, ex, data, present); }catch(e){ console.warn("items", e); }
  ex.status="done";
  for (const id of present) Jobs.add("compress", ()=>compressIfNeeded(id));
  if (ex.leaving.length) onParticipantsLeft(session, ex.leaving, ex.id);
  refreshOpenPanels();
}
function revertExchange(ex){
  for (const [id,mid] of ex.memIds){ const list=mems(id); const i=list.findIndex(m=>m.id===mid); if (i<0) continue; const m=list[i]; if (m.archived){ const parent=list.find(p=>p.children.includes(m.id)); if(parent) parent.stale=true; } list.splice(i,1); }
  for (const [id,applied] of Object.entries(ex.deltas)) revertDeltas(id, applied);
  for (const id of ex.introduced) rel(id).introduced=false;
  for (const id of ex.learned) rel(id).knowsName=false;
  if (ex.itemOps) revertItemOps(ex);
  if (ex.bondSnap){ for (const [id,sn] of Object.entries(ex.bondSnap)){ try{ Object.assign(rel(id), JSON.parse(sn)); }catch(e){} } ex.bondSnap=null; }
  S.plans = S.plans.filter(p=>!ex.plans.includes(p.id));
  ex.memIds=[]; ex.deltas={}; ex.introduced=[]; ex.learned=[]; ex.plans=[]; ex.leaving=[];
}

// ---- Compression ----
async function compressIfNeeded(id){
  const st=S.settings;
  const l0=activeMems(id,0).filter(m=>!m.pinned);
  if (l0.length > st.l0Max){ await compress(id, l0.slice(0, st.l0Batch), 1); }
  const l1=activeMems(id,1).filter(m=>!m.pinned);
  if (l1.length > st.l1Max){ await compress(id, l1.slice(0, st.l1Batch), 2); }
  const l2=activeMems(id,2).filter(m=>!m.pinned);
  if (l2.length > st.l2Max){ await compress(id, l2.slice(0, 2), 2); }
}
function compressPrompt(id, items, level){
  const name=cname(charById(id)); const r=rel(id);
  const len = level===1 ? "3~6문장" : "4~8문장";
  return `아래는 ${name}의 기억 조각들이다(시간순). 이것을 하나의 ${LEVEL_NAME[level]}으로 압축한다.
- 중요한 것만 남긴다: 관계가 움직인 순간, 약속과 그 이행 여부, 새로 알게 된 사실과 비밀의 조각, 풀리지 않은 질문, ${name}의 감정이 크게 흔들린 지점.
- 사소한 인사와 반복된 잡담은 버린다. 같은 종류의 일이 반복됐다면 "여러 번"처럼 묶는다.
${POV_RULES(name, r.knowsName)}
- 언제쯤, 어디서였는지 대략의 표지를 남긴다(예: "11월 10일 오후 카페에서").
- 길이: ${len}. 압축된 기억 본문만 출력한다.

[기억 조각]
${items.map(m=>`- (${shortStamp(m.time)}) ${m.text}`).join("\n")}`;
}
async function compress(id, items, level){
  if (!llmReady("mem") || items.length<2) return;
  try{
    const res = await llmGenerate("mem", compressPrompt(id, items, level), {tier:"default"});
    const text = String(res.text||"").trim(); if (!text) return;
    addMem(id, {level, text, time:items[items.length-1].time, children:items.map(m=>m.id), sessionId:null});
    for (const m of items) m.archived=true;
  }catch(e){ console.warn("compress failed", e); }
  refreshOpenPanels();
}

${mem.level>0?`- 중요한 것만 남기고 사소한 것은 버린다. 언제쯤, 어디서였는지 대략의 표지를 남긴다.\n`:""}- 길이: ${len}. 기억 본문만 출력한다.

[대화 원문]
${rawText}`;

async function regenerateMemory(id, memId){
  const mem=findMem(id,memId); if(!mem) return false; if (!llmReady("mem")){ toast(aiErrorText({code:"no_connection"})); return false; }
  let prompt;
  const leaves=[...leafMsgIds(id, mem)];
  const raw = formatMsgsForPOV(leaves);
  if (raw && raw.length < 60000) prompt = regenPromptFromRaw(id, mem, raw);
  else if (mem.level>0){ const kids=mem.children.map(c=>findMem(id,c)).filter(Boolean); prompt = compressPrompt(id, kids, mem.level); }
  else { toast("이 기억의 원문 대화가 남아 있지 않아요."); return false; }
  try{
    const res = await llmGenerate("mem", prompt, {tier: mem.level===0?(S.settings.memTier||"quick"):"default"});
    mem.text=res.text.trim(); mem.stale=false; mem.edited=false; mem.regenAt=S.time; scheduleSave(); return true;
  }catch(e){ toast(aiErrorText(e)); return false; }
}

const PRESET_OLD = {narration:4037099680, style:3986429323};   // 0.9.0: the old default texts, so saved copies that were never edited get the new wording
function migrate(s){
  s.settings = {...DEFAULT_SETTINGS, ...(s.settings||{})};
  s.preset ||= JSON.parse(JSON.stringify(DEFAULT_PRESET));
  for (const b of s.preset.blocks){ const d=DEFAULT_PRESET.blocks.find(x=>x.id===b.id); if (!d) continue; const hs=hashStr(b.text); if ((PRESET_OLD[b.id] && hs===PRESET_OLD[b.id]) || (PRESET_OLD_MORE[b.id]||[]).includes(hs)){ b.text=d.text; if (b.id==="brevity") b.name=d.name; } }
  if (!s.preset.blocks.some(b=>b.id==="brevity")){ const d=DEFAULT_PRESET.blocks.find(x=>x.id==="brevity"); const i=s.preset.blocks.findIndex(b=>b.id==="style"); s.preset.blocks.splice(i<0?s.preset.blocks.length:i, 0, JSON.parse(JSON.stringify(d))); }
  for (const b of DEFAULT_PRESET.blocks) if (!s.preset.blocks.find(x=>x.id===b.id)) s.preset.blocks.push(JSON.parse(JSON.stringify(b)));
  for (const k of ["rel","memories","exchanges","style"]) s[k] ||= {};
  for (const k of ["sessions","plans"]) s[k] ||= [];
  for (const sess of s.sessions){ if (!(s.field && sess.id===s.field.sessionId)) sess.ended=true; sess.all ||= [...sess.participants]; for (const m of sess.messages) if (m.pending){ m.pending=false; if (m.direction) m.text=m.direction; } }

function memCard(id, mm, api, openSrc, editing){

    card.append(ta, h("div",{class:"acts"}, h("button",{class:"btn small",onclick:()=>{ editing.delete(mm.id); api.rebuild(); }},"취소"), h("button",{class:"btn small primary",onclick:()=>{ mm.text=ta.value.trim(); mm.edited=true; editing.delete(mm.id); scheduleSave(); api.rebuild(); }},"저장")));

// people in the same room as the conversation (shadow and stall users are there but cannot be seen)
function roomPeople(session){
  if (!session || session.mission || session.date) return [];
  const place=session.place, P=PLACES[place]; if (!P) return [];
  const main=RT.npcs[session.participants[0]], cx=main?main.x:S.player.x, cy=main?main.y:S.player.y, out=[];
  for (const n of Object.values(RT.npcs)){
    if (session.participants.includes(n.id) || n.away || n.transit || n.map!==session.map) continue;
    const host = n.shadow ? RT.npcs[G(charById(n.id)).leash] : null;
    const r = n.shadow ? (host ? roomOf(host) : null) : roomOf(n); if (r!==place) continue;
    const x = host ? host.x : n.x, y = host ? host.y : n.y, d=Math.hypot(x-cx, y-cy);
    if (P.street && d>10) continue;
    out.push({n, id:n.id, d, near:d<=NEAR_R, seen:!n.shadow && !n.inStall}); }
  return out.sort((a,b)=>a.d-b.d);
}
function nearbyIds(session){ return roomPeople(session).filter(x=>x.seen).map(x=>x.id); }
function roomStateBlock(session){

  const near=list.filter(x=>x.near && x.seen).map(x=>dispName(x.id));

규칙:
- 참가자가 아닌 사람은 배경이다. 대화가 그 사람과 직접 관련되거나, 그 사람에게 중요하거나, 반응하지 않으면 어색한 내용일 때만 짧게 반응하거나 끼어들게 한다. 그렇지 않으면 대사를 주지 않고 하던 일을 계속하게 둔다.

const LOUD_RE = [
  [3, /폭발|비명|경보|사이렌|호루라기|와장창|총성|총을 쏘|고함을 지르/],

  [1, /웃음을 터뜨|문을 두드|노크|기침|재채기|휘파람|부딪/],
];
const WAKE_RE = /깨우|깨워|깨운|일어나|일으키|흔들어|흔든다|흔들며|꼬집|이불을 (걷|들추|확)|어깨를 (흔들|톡)|볼을 (콕|찌르)/;
const ALL_RE = /다들|모두|전부|다 같이|다같이|여러분/;
const SOFT_RE = /속삭|작게|조용히|살금|소곤|숨죽/;
function d20(){ return 1+Math.floor(Math.random()*20); }
function sleepDepth(id){ const v=G(charById(id))?.sleep; return v==="light"||v==="deep" ? v : "normal"; }
function sleepersAround(session, level){
  const out=[], p=S.player;
  for (const n of Object.values(RT.npcs)){
    if (!n.sleeping || n.away || n.transit || n.shadow || n.map!==session.map) continue;
    const same=roomOf(n)===session.place, dist=Math.hypot(n.x-p.x, n.y-p.y);
    if (same || (level>=3 && dist<=11)) out.push({n, same, dist}); }
  return out;
}
// what the player's words would do to sleeping people nearby
function detectNoise(text, session){
  const t=String(text||""); if (!t.trim() || session.mission || session.date) return null;
  const sleepers=sleepersAround(session, 3).map(x=>x.n.id); if (!sleepers.length) return null;
  let level=0; for (const [lv,re] of LOUD_RE) if (re.test(t)){ level=lv; break; }
  const soft=SOFT_RE.test(t); let targets=[];
  if (WAKE_RE.test(t)){
    if (ALL_RE.test(t)) targets=sleepers.filter(id=>roomOf(RT.npcs[id])===session.place);
    else { targets=sleepers.filter(id=>whoTokens(id).some(k=>t.includes(k)) || (G(charById(id)).look && t.includes(G(charById(id)).look)));
      if (!targets.length) targets=session.participants.filter(id=>RT.npcs[id]?.sleeping); }
    if (!targets.length) level=Math.max(level,1); }
  if (soft) level=Math.max(0, level-1);
  if (!level && !targets.length) return null;
  return {level, targets, soft};
}
const LV_WORD=["","조금 큰 소리","큰 소리","아주 큰 소리"];
function rollNoise(session, info, why){
  const list=sleepersAround(session, info.level); if (!list.length) return null;
  const lines=[], woke=[], joined=[];
  for (const {n, same, dist} of list){
    const id=n.id, tg=info.targets.includes(id), depth=sleepDepth(id);
    let dc = depth==="light"?8:depth==="deep"?16:12;
    if (tg) dc-=6; else if (!info.level) continue; else dc += info.level===1?4:info.level===2?0:-6;
    if (!same){ if (info.level<3 && !tg) continue; dc+=6; } else if (dist<=NEAR_R) dc-=2; else dc+=2;
    if (info.soft) dc+=3; dc=clamp(dc,2,20);
    const r=d20(), ok = r===20 || (r!==1 && r>=dc), nm=dispName(id);
    if (!ok){ lines.push(`${nm}: ${r} (깨려면 ${dc} 이상) → 계속 잔다`); continue; }
    woke.push(id);
    if (session.participants.includes(id)){ lines.push(`${nm}: ${r} (깨려면 ${dc} 이상) → 깨어남`); continue; }
    const ax=rel(id).axes; let jdc = 12 - Math.round(((ax.curiosity||0)+(ax.intimacy||0))/20) + (depth==="deep"?3:0) - (tg?4:0) + (same?0:5);
    jdc=clamp(jdc,3,19); const j=d20(), jok = same && (j===20 || (j!==1 && j>=jdc));
    lines.push(`${nm}: ${r} (깨려면 ${dc} 이상) → 깨어남 · 참여 ${j} (${jdc} 이상) → ${jok?"대화에 낀다":"대화에 끼지 않는다"}`);
    if (jok) joined.push(id); }
  if (!lines.length) return null;
  for (const id of woke){ const n=RT.npcs[id], c=charById(id);
    if (session.participants.includes(id)){ wakeNPC(n); if (n.task && n.task.kind==="sleep") n.task.done=true; continue; }
    startTask(n, c, {key:"woke", kind:"woke", src:"need", need:true, score:70}); }
  const head = info.targets.length && !info.level ? "깨우기" : `${why||"소리"}: ${LV_WORD[info.level]||"소리"}`;
  session.messages.push({id:uid("g"), role:"sys", text:`🎲 ${head}\n${lines.join("\n")}`, time:S.time, present:[...session.participants], important:true, dice:true});
  for (const id of joined) Chat.addParticipant(id, "잠에서 깨어 ");
  return {woke, joined};
}

function actPress(){
  if (RT.battle){ battleDodge(); return; }
  if (RT.uiOpen || !RT.started) return;
  const a=RT.ctx || findContext();
  if (a.kind && a.kind.startsWith("f:")) return fieldAct(a);
  if (a.kind==="npc"){ RT.ppath=null; RT.auto=null; Chat.open([a.n.id]); return; }
  if (a.kind==="gate"){ travel(a.g); return; }
  if (a.kind==="fac"){ useFacility(a.f); return; }
  if (a.kind==="mission"){ openMissionBoard(); return; }
  if (a.kind==="training"){ openTraining(); return; }
  if (a.kind==="gather"){ gatherAt(a); return; }
  if (a.kind==="look"){ const l=LOOK_TEXT[a.t]; toast(l[hashStr(a.x+","+a.y+":"+Math.floor(S.time/60))%l.length]); return; }
  toast("주변에 살펴볼 만한 게 없어요.");
}
function cancelPress(){
  if (RT.battle){ const B=RT.battle; if (B.over||B.hold) return; const foes=B.units.filter(u=>u.side==="foe"&&u.hp>0).sort((a,b)=>bdist(B.P,a)-bdist(B.P,b)); if (foes[0]){ B.ptgt=foes[0]; B.dest=null; } return; }
  if (RT.uiOpen || !RT.started) return;
  const a=attackContext();
  if (a.kind && a.kind.startsWith("f:")){ fieldAttack(a); return; }
  if (a.kind==="dummy"){ openTraining(); return; }
  if (RT.ppath || RT.quest){ RT.ppath=null; RT.auto=null; RT.quest=null; S.player.frame=0; toast("걷기를 멈췄어요."); return; }
}
function passTime(min, msg){
  S.time+=min; cv.style.transition="none"; cv.style.opacity="0.15"; requestAnimationFrame(()=>{ cv.style.transition="opacity .6s"; cv.style.opacity="1"; });
  if (msg) toast(msg); scheduleSave();
}
function useFacility(f){
  if (f.priv && f.user){ toast("안에 누가 있어요. 조금 기다려요."); return; }
  if (f.kind==="toilet") return passTime(3, "화장실에 다녀왔어요.");
  if (f.kind==="shower"){ healPlayer(0.03); return passTime(12, "샤워를 했어요. 개운해요."); }
  if (f.kind==="sink") return passTime(1, "손을 씻었어요.");
  if (f.kind==="locker") return toast("사물함에 장비가 가지런히 들어 있어요.");
  if (f.kind==="bed"){ if (f.place==="life.med"){ if (hpFrac()>=0.999){ toast("다친 데가 없어요."); return; } healPlayer(0.5); return passTime(60, "의무실에서 치료를 받았어요. 체력이 많이 돌아왔어요."); } openRest(); return; }
  if (f.user){ toast("누가 앉아 있어요."); return; }
  if (f.kind==="cook"){ healPlayer(0.12); return passTime(30, "간단히 요리해서 먹었어요. 체력이 조금 회복됐어요."); }
  if (f.meal==="meal"){ healPlayer(0.12); return passTime(20, "식사를 했어요. 체력이 조금 회복됐어요."); }
  healPlayer(0.05); passTime(6, "간식을 먹었어요.");
}
function gatherAt(a){
  S.inv ||= {}; S.gathered ||= {}; const it=a.gt.item;
  if ((S.inv[it]||0)>=20){ toast(`${it}${josa(it,"은","는")} 더 들고 다닐 수 없어요.`); return; }
  S.gathered[`${S.player.map}:${a.x},${a.y}`]=Math.floor(S.time/1440); S.inv[it]=(S.inv[it]||0)+1;
  passTime(5, `${it} 하나를 얻었어요. (가방: ${it} ${S.inv[it]}개)`);
}

function miniBase(mid){
  if (MINI.img[mid]) return MINI.img[mid]; const m=MAPS[mid], k=3, c=document.createElement("canvas"); c.width=m.w*k; c.height=m.h*k; const x=c.getContext("2d");
  for (let y=0;y<m.h;y++) for (let X=0;X<m.w;X++){ const t=getT(m,X,y); let col;
    if (mid==="field") col=fieldMiniColor(t);
    else if (t===T.WATER) col = mid==="farm" ? "#2c7fa6" : "#0c2a44"; else if (t===T.WALL) col="#151926"; else if (t===T.GATE) col="#e9c46a";
    else if (t===T.GRASS||t===T.FLOWER||t===T.TREE) col="#3f7a5a"; else if (t===T.PATH) col="#5d6274"; else if (t===T.WOOD||t===T.DOOR) col="#8c7b69";
    else if (WALKABLE.has(t)) col="#6a7286"; else col="#4b4a5c";

function shortName(id){ const n=cname(charById(id)); const parts=n.split(/\s+/); return (parts[parts.length-1]||n).slice(0,4); }
function drawMini(force){
  const cvm=document.getElementById("miniMap"); if (!cvm || !S || !MAPS) return; const now=performance.now(); if (!force && now-MINI.last<250) return; MINI.last=now;
  const p=S.player, m=MAPS[p.map], dpr=Math.min(2,window.devicePixelRatio||1), W=cvm.clientWidth||150, H=cvm.clientHeight||102;
  if (cvm.width!==Math.round(W*dpr) || cvm.height!==Math.round(H*dpr)){ cvm.width=Math.round(W*dpr); cvm.height=Math.round(H*dpr); }
  const x=cvm.getContext("2d"); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,W,H);
  const sc=Math.min(W/(m.w-2), H/(m.h-2)), ox=(W-(m.w-2)*sc)/2-sc, oy=(H-(m.h-2)*sc)/2-sc;
  x.globalAlpha=0.82; x.imageSmoothingEnabled=false; x.drawImage(miniBase(p.map), ox, oy, m.w*sc, m.h*sc); x.globalAlpha=1;
  const pl=playerRoom(); if (pl && !PLACES[pl].street){ const [rx,ry,rw,rh]=PLACES[pl].rect; x.strokeStyle="rgba(233,196,106,.95)"; x.lineWidth=1.3; x.strokeRect(ox+rx*sc, oy+ry*sc, rw*sc, rh*sc); }
  x.font="600 8.5px 'IBM Plex Sans KR',sans-serif"; x.textAlign="center"; x.textBaseline="bottom"; x.lineJoin="round";
  const placed=[], fits=(r)=>!placed.some(o=>r.x<o.x+o.w && o.x<r.x+r.w && r.y<o.y+o.h && o.y<r.y+r.h);
  for (const n of Object.values(RT.npcs)){ if (n.map!==p.map || n.transit || n.shadow || n.away || n.inStall) continue; const c=charById(n.id); if (!c) continue;
    const px=ox+n.x*sc, py=oy+n.y*sc; x.fillStyle=normSprite(G(c).sprite||{}).hair; x.beginPath(); x.arc(px,py,2.6,0,7); x.fill(); x.strokeStyle="rgba(0,0,0,.65)"; x.lineWidth=0.9; x.stroke();
    const nm = rel(n.id).introduced && !formOf(n.id)?.hideName ? shortName(n.id) : "?";
    const tw=x.measureText(nm).width+2; let ly=null; for (const cand of [py-3, py+12, py-12]){ const r={x:px-tw/2, y:cand-9, w:tw, h:9}; if (fits(r)){ placed.push(r); ly=cand; break; } }
    if (ly==null) continue;
    x.lineWidth=2.6; x.strokeStyle="rgba(0,0,0,.75)"; x.strokeText(nm, px, ly); x.fillStyle=n.sleeping?"#c3cbff":"#fff"; x.fillText(nm, px, ly); }
  if (p.map==="field" && S.field) drawMiniField(x, ox, oy, sc);
  const qx=ox+p.x*sc, qy=oy+p.y*sc; x.fillStyle="#3fe0c8"; x.strokeStyle="#fff"; x.lineWidth=1.3; x.beginPath(); x.arc(qx,qy,3.4,0,7); x.fill(); x.stroke();
}

// ====================================================================
// TOUCH DIAGNOSTICS (0.7.3)
// A small always-on record of what the phone really hands to the game: touch signals, the visible part of the
// page, freezes and errors. No chat text, names or keys are written. Shown in 설정 → 진단.
// ====================================================================
const Diag = {
  c:{pd:0,pu:0,pc:0,ck:0,gs:0}, log:[], vlog:[], taps:[], lastTap:null, prev:null, lastFrame:0, stalls:0, withheld:0, miss:0, errs:0, synth:0,
  armed:false, show:false, strip:null, pdn:null, pup:null, pend:0, seq:0, lastVp:"", _sv:0,
  stamp(){ const d=new Date(), z=n=>String(n).padStart(2,"0"); return z(d.getHours())+":"+z(d.getMinutes())+":"+z(d.getSeconds()); },
  add(msg){ this.log.push(this.stamp()+" "+msg); if (this.log.length>70) this.log.splice(0, this.log.length-70); this.save(); },
  save(){ clearTimeout(this._sv); this._sv=setTimeout(()=>{ try{ localStorage.setItem("mtut_diag", JSON.stringify({log:this.log, vlog:this.vlog, taps:this.tapLines()})); }catch(e){} }, 900); },
  tapLines(){ return this.taps.map(t=>`${t.s} (${t.x},${t.y}) ${t.el}${t.ok===null?"":t.ok?" → 눌림":" → 눌림 없음"}`); },
  clear(){ this.log=[]; this.vlog=[]; this.taps=[]; this.lastTap=null; this.prev=null; this.lastVp=""; for (const k in this.c) this.c[k]=0; this.stalls=this.withheld=this.miss=this.errs=this.synth=0; try{ localStorage.removeItem("mtut_diag"); }catch(e){} },
  el(t){ if (!t || !t.tagName) return "?"; let x=t.tagName.toLowerCase(); if (t.id) x+="#"+t.id; else if (typeof t.className==="string" && t.className.trim()) x+="."+t.className.trim().split(/\s+/).slice(0,2).join("."); return x; },
  vp(){ const vv=window.visualViewport, de=document.documentElement, r=n=>Math.round(n*10)/10;
    return `창 ${innerWidth}x${innerHeight} · 문서 ${de.clientWidth}x${de.clientHeight} · 스크롤 ${r(scrollX)},${r(scrollY)}` + (vv ? ` · 보이는 곳 ${r(vv.width)}x${r(vv.height)} 위치 ${r(vv.offsetLeft)},${r(vv.offsetTop)} 쪽 ${r(vv.pageLeft)},${r(vv.pageTop)} 배율 ${Math.round((vv.scale||1)*100)/100}` : " · (visualViewport 없음)"); },
  err(m){ this.errs++; const t=String(m).replace(/[A-Za-z0-9_\-]{24,}/g,"…").slice(0,150); if (this.errs<=15) this.add("오류: "+t); try{ console.error("MTUT", t); }catch(e){} },
  frame(now){ if (this.lastFrame && now-this.lastFrame>700 && !document.hidden){ this.stalls++; if (this.stalls<=20) this.add(`화면 멈춤 ${Math.round(now-this.lastFrame)}ms`); } this.lastFrame=now; },
  held(kind){ this.withheld++; if (this.withheld<=12) this.add("손 뗀 신호가 다음 터치 때에야 옴 ("+kind+")");
    if (this.withheld>=2 && !this.armed){ this.armed=true; try{ localStorage.setItem("mtut_hold", String(Date.now())); }catch(e){} this.add("버튼 안전장치 켬");
      setTimeout(()=>{ try{ toast("아이폰이 '손가락을 뗐다'는 신호를 게임에 늦게 넘겨주고 있어요(iOS 쪽 오류). 버튼은 누르고 0.6초 뒤에 눌리도록 바꿨어요."); }catch(e){} }, 60); } },
  tick(){ const vv=window.visualViewport, de=document.documentElement, ty=isTyping();
    const key=[ty?1:0, vv?Math.round((vv.scale||1)*10):10, vv?Math.round(vv.pageTop):0, vv?Math.round(vv.offsetTop):0, vv?Math.round(vv.height):0, de.clientHeight, innerHeight, Math.round(scrollY), VP.on?1:0].join("|");
    if (key!==this.lastVp){ this.lastVp=key; this.vlog.push(this.stamp()+" "+this.vp()+(ty?" [입력 중]":"")+(VP.on?" [따라감]":"")); if (this.vlog.length>16) this.vlog.shift(); this.save(); }
    if (this.show) this.paint(); },
  paint(){ if (!this.strip || !this.strip.isConnected){ this.strip=h("div",{id:"diagStrip"}); document.body.append(this.strip); } const c=this.c;
    this.strip.textContent=`누름 ${c.pd} 뗌 ${c.pu} 취소 ${c.pc} 눌림 ${c.ck} · 늦음 ${this.withheld} 빈탭 ${this.miss} 멈춤 ${this.stalls}\n`+this.vp(); },
  live(){ if (this.show) this.paint(); },
  setShow(v){ this.show=!!v; try{ localStorage.setItem("mtut_diag_show", v?"1":""); }catch(e){} if (!v && this.strip){ this.strip.remove(); this.strip=null; } if (v) this.paint(); },
  report(){ const c=this.c, ua=navigator.userAgent||"", dev=((ua.match(/\(([^)]+)\)/)||[])[1]||"?").slice(0,64), ver=(ua.match(/Version\/([\d.]+)/)||[])[1];
    const L=[ `MTUT ${GAME_VERSION} · ${this.stamp()}`,
      `기기: ${dev}${ver?" · 사파리 "+ver:""} · 홈 화면 앱 ${navigator.standalone===true?"예":navigator.standalone===false?"아니오":"?"} · 화소비 ${window.devicePixelRatio||1}`,
      `지금 화면: ${this.vp()}`,
      `게임 화면 맞춤: ${VP.on?"보이는 곳을 따라가는 중":"기본"}${VP.kb?" · 키보드 올라옴":""}${isTyping()?" · 입력 중":""}`,
      `받은 신호: 손가락 누름 ${c.pd} · 뗌 ${c.pu} · 취소(스크롤 등) ${c.pc} · 눌림(click) ${c.ck} · 두 손가락 확대 ${c.gs}`,
      `이상 신호: 늦게 온 손 뗌 ${this.withheld} · 눌림 없는 탭 ${this.miss} · 화면 멈춤 ${this.stalls} · 오류 ${this.errs} · 버튼 안전장치 ${this.armed?"켜짐":"꺼짐"}(대신 누름 ${this.synth}번)`,
      "── 최근 탭 (좌표 · 닿은 곳) ──", ...(this.taps.length?this.tapLines():["(없음)"]),
      "── 화면 변화 ──", ...(this.vlog.length?this.vlog:["(없음)"]), "── 기록 ──", ...(this.log.length?this.log:["(없음)"]) ];
    if (this.prev && this.prev.length) L.push("── 지난번 실행 ──", ...this.prev.slice(-24));
    return L.join("\n"); },
  init(){
    try{ const d=JSON.parse(localStorage.getItem("mtut_diag")||"null"); if (d && Array.isArray(d.log)) this.prev=[...(Array.isArray(d.taps)?d.taps.slice(-6):[]), ...(Array.isArray(d.vlog)?d.vlog.slice(-5):[]), ...d.log]; }catch(e){}
    try{ this.show=!!localStorage.getItem("mtut_diag_show"); this.armed=(Date.now()-Number(localStorage.getItem("mtut_hold")||0))<12*3600*1000; }catch(e){}
    const on=(ev,fn)=>document.addEventListener(ev, e=>{ try{ fn(e); }catch(err){} }, {capture:true, passive:true});
    // A finger that was lifted long ago but whose "lifted" signal only arrives together with the next touch
    // means iOS itself is holding touch signals back (seen on iOS 27).
    on("pointerdown", e=>{ this.c.pd++; this.live(); if (e.pointerType!=="touch" || !e.isPrimary) return; const now=performance.now(), up=this.pup;
      if (this.pdn) this.held("끝 신호 없음"); else if (up && now-up.t<25 && up.dur>150) this.held("늦게 도착");
      this.pdn={t:now, id:e.pointerId, x:e.clientX, y:e.clientY, el:e.target, moved:false}; });
    on("pointermove", e=>{ const d=this.pdn; if (d && d.id===e.pointerId && !d.moved && Math.hypot(e.clientX-d.x, e.clientY-d.y)>10) d.moved=true; });
    on("pointerup", e=>{ this.c.pu++; const d=this.pdn; if (!d || d.id!==e.pointerId){ this.live(); return; } const now=performance.now(); this.pup={t:now, dur:now-d.t}; this.pdn=null;
      if (!d.moved && now-d.t<500){ const a=d.el && d.el.closest && d.el.closest("button,[role=tab],summary,#prompt");      // a plain tap on a button must be followed by a click
        const rec={s:this.stamp(), x:Math.round(e.clientX), y:Math.round(e.clientY), el:this.el(a||d.el), ok:(d.el && d.el.tagName==="CANVAS")?null:false, t:now}; this.taps.push(rec); if (this.taps.length>10) this.taps.shift(); this.lastTap=rec; this.save();
        if (a && !a.disabled){ const id=++this.seq; this.pend=id; setTimeout(()=>{ if (this.pend===id){ this.pend=0; this.miss++; if (this.miss<=12) this.add("탭했는데 눌림(click)이 안 옴: "+this.el(a)); } }, 700); } }
      this.live(); });
    on("pointercancel", e=>{ this.c.pc++; if (this.pdn && this.pdn.id===e.pointerId){ this.pdn=null; this.pup=null; } this.live(); });
    on("click", e=>{ this.c.ck++; this.pend=0; const t=this.lastTap; if (t && t.ok===false && performance.now()-t.t<800) t.ok=true; this.live(); });
    on("gesturestart", e=>{ this.c.gs++; });
    // Safety net: once iOS has been caught holding back "finger lifted" signals twice, a touch that rests on a
    // button for 0.6 s presses it (a quick tap then still works, only a little late).
    const SEL="button,[role=tab],summary,#prompt"; let timer=0, hold=null, sx=0, sy=0, done=null;
    const stop=()=>{ clearTimeout(timer); hold=null; };
    document.addEventListener("pointerdown", e=>{ stop(); done=null; if (!this.armed || e.pointerType!=="touch" || !e.isPrimary) return;
      const b=e.target.closest && e.target.closest(SEL); if (!b || b.disabled) return; hold=b; sx=e.clientX; sy=e.clientY;
      timer=setTimeout(()=>{ if (hold!==b || !b.isConnected || b.disabled) return; hold=null; done=b; this.synth++; if (this.synth<=12) this.add("대신 누름: "+this.el(b)); b.click(); }, 600); }, true);
    document.addEventListener("pointermove", e=>{ if (hold && Math.hypot(e.clientX-sx, e.clientY-sy)>10) stop(); }, {capture:true, passive:true});
    for (const ev of ["pointerup","pointercancel","scroll"]) document.addEventListener(ev, stop, {capture:true, passive:true});
    document.addEventListener("click", e=>{ if (done && e.isTrusted && e.target.closest && e.target.closest(SEL)===done){ done=null; e.stopImmediatePropagation(); e.preventDefault(); } }, true);
    if (this.show) this.paint();
  }
};
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); toast("복사했어요."); return; }catch(e){}
  try{ const ta=h("textarea",{style:"position:absolute;left:0;top:0;width:1px;height:1px;opacity:0"}); ta.value=t; document.body.append(ta); ta.select(); const ok=document.execCommand("copy"); ta.remove(); toast(ok?"복사했어요.":"복사하지 못했어요."); }
  catch(e){ toast("복사하지 못했어요."); }
}
function renderDiagTab(c, api){

  const label=()=>Diag.show?"화면 구석 진단 줄 끄기":"화면 구석 진단 줄 켜기";
  const stripBtn=h("button",{class:"btn small",onclick:()=>{ Diag.setShow(!Diag.show); stripBtn.textContent=label(); }}, label());
  c.append(h("div",{style:"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"},
    h("button",{class:"btn small",onclick:()=>{ pre.textContent=Diag.report(); }},"새로 고침"),
    h("button",{class:"btn small",onclick:()=>copyText(Diag.report())},"복사"),
    h("button",{class:"btn small",onclick:()=>{ Diag.clear(); pre.textContent=Diag.report(); }},"기록 지우기"),
    stripBtn), pre);

// places right after the end of a sentence (outside quotation marks), as character offsets
function sentenceEnds(t){
  const out=[]; let q=false;
  for (let i=0;i<t.length;i++){ const ch=t[i];
    if (ch==='"'){ q=!q; continue; } if (ch==="“"){ q=true; continue; } if (ch==="”"){ q=false; continue; }
    if (ch==="\n"){ if (!q) out.push(i); continue; }
    if (/[.!?…~。]/.test(ch)){ let j=i+1;
      while (j<t.length && /[.!?…~"”'’」』)\]]/.test(t[j])){ if (t[j]==='"') q=!q; else if (t[j]==="”") q=false; else if (t[j]==="“") q=true; j++; }
      if (!q && (j>=t.length || /\s/.test(t[j]))) out.push(j); i=j-1; }

function updateField(dt){

  const m=MAPS.field, p=S.player; let dx=p.x-g.x, dy=p.y-g.y; const l=Math.hypot(dx,dy)||1; dx/=l; dy/=l;
  for (let d=dist; d>=1; d-=0.5){ const x=p.x+dx*d, y=p.y+dy*d; if (playerWalkable(m,x,y) && fieldLOS(m,p.x,p.y,x,y)){ p.x=x; p.y=y; return; } }
}
